<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="wfHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="50%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="wfShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="#fafafa"/>

  <!-- Header -->
  <rect width="800" height="64" rx="16" fill="url(#wfHeader)"/>
  <rect y="32" width="800" height="32" fill="url(#wfHeader)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">再活用ワークフロー（4ステップ）</text>

  <!-- Step 1 -->
  <rect x="40" y="100" width="160" height="160" rx="14" fill="#fff" filter="url(#wfShadow)"/>
  <circle cx="120" cy="130" r="22" fill="#dbeafe"/>
  <text x="120" y="137" text-anchor="middle" font-size="18" font-weight="bold" fill="#2563eb">1</text>
  <text x="120" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">文字起こし</text>
  <text x="120" y="190" text-anchor="middle" font-size="10" fill="#666">動画の全文テキストを</text>
  <text x="120" y="205" text-anchor="middle" font-size="10" fill="#666">自動文字起こしで取得</text>
  <rect x="55" y="225" width="130" height="22" rx="11" fill="#eff6ff"/>
  <text x="120" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#2563eb">所要時間：10〜30分</text>

  <!-- Arrow 1→2 -->
  <line x1="200" y1="180" x2="230" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="230,180 222,174 222,186" fill="#94a3b8"/>

  <!-- Step 2 -->
  <rect x="235" y="100" width="160" height="160" rx="14" fill="#fff" filter="url(#wfShadow)"/>
  <circle cx="315" cy="130" r="22" fill="#fce7f3"/>
  <text x="315" y="137" text-anchor="middle" font-size="18" font-weight="bold" fill="#db2777">2</text>
  <text x="315" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">骨格を抽出</text>
  <text x="315" y="190" text-anchor="middle" font-size="10" fill="#666">主張・データ・事例</text>
  <text x="315" y="205" text-anchor="middle" font-size="10" fill="#666">キーワードを整理</text>
  <rect x="250" y="225" width="130" height="22" rx="11" fill="#fdf2f8"/>
  <text x="315" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#db2777">所要時間：15〜30分</text>

  <!-- Arrow 2→3 -->
  <line x1="395" y1="180" x2="425" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="425,180 417,174 417,186" fill="#94a3b8"/>

  <!-- Step 3 -->
  <rect x="430" y="100" width="160" height="160" rx="14" fill="#fff" filter="url(#wfShadow)"/>
  <circle cx="510" cy="130" r="22" fill="#d1fae5"/>
  <text x="510" y="137" text-anchor="middle" font-size="18" font-weight="bold" fill="#059669">3</text>
  <text x="510" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">各メディアに再構成</text>
  <text x="510" y="190" text-anchor="middle" font-size="10" fill="#666">メディアごとの</text>
  <text x="510" y="205" text-anchor="middle" font-size="10" fill="#666">フォーマットに変換</text>
  <rect x="445" y="225" width="130" height="22" rx="11" fill="#ecfdf5"/>
  <text x="510" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#059669">所要時間：1〜3時間</text>

  <!-- Arrow 3→4 -->
  <line x1="590" y1="180" x2="620" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="620,180 612,174 612,186" fill="#94a3b8"/>

  <!-- Step 4 -->
  <rect x="625" y="100" width="140" height="160" rx="14" fill="#fff" filter="url(#wfShadow)"/>
  <circle cx="695" cy="130" r="22" fill="#fef3c7"/>
  <text x="695" y="137" text-anchor="middle" font-size="18" font-weight="bold" fill="#d97706">4</text>
  <text x="695" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">スケジュール投稿</text>
  <text x="695" y="190" text-anchor="middle" font-size="10" fill="#666">時間差で各チャネルに</text>
  <text x="695" y="205" text-anchor="middle" font-size="10" fill="#666">計画的に公開</text>
  <rect x="633" y="225" width="124" height="22" rx="11" fill="#fffbeb"/>
  <text x="695" y="240" text-anchor="middle" font-size="9" font-weight="bold" fill="#d97706">継続的に運用</text>

  <!-- Timeline section -->
  <text x="400" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">投稿スケジュールの目安</text>

  <!-- Timeline bar -->
  <rect x="60" y="330" width="680" height="6" rx="3" fill="#e5e7eb"/>

  <!-- Day 0 -->
  <circle cx="100" cy="333" r="10" fill="#dc2626"/>
  <text x="100" y="337" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">0</text>
  <text x="100" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">当日</text>
  <text x="100" y="380" text-anchor="middle" font-size="9" fill="#666">YouTube公開</text>
  <text x="100" y="393" text-anchor="middle" font-size="9" fill="#666">SNS告知</text>

  <!-- Day 1-3 -->
  <circle cx="290" cy="333" r="10" fill="#f59e0b"/>
  <text x="290" y="337" text-anchor="middle" font-size="7" fill="#fff" font-weight="bold">1-3</text>
  <text x="290" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">1〜3日後</text>
  <text x="290" y="380" text-anchor="middle" font-size="9" fill="#666">ショート動画</text>
  <text x="290" y="393" text-anchor="middle" font-size="9" fill="#666">Shorts・Reels</text>

  <!-- Day 7 -->
  <circle cx="500" cy="333" r="10" fill="#2563eb"/>
  <text x="500" y="337" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">7</text>
  <text x="500" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">1週間以内</text>
  <text x="500" y="380" text-anchor="middle" font-size="9" fill="#666">ブログ記事</text>
  <text x="500" y="393" text-anchor="middle" font-size="9" fill="#666">公開</text>

  <!-- Day 14 -->
  <circle cx="700" cy="333" r="10" fill="#059669"/>
  <text x="700" y="337" text-anchor="middle" font-size="7" fill="#fff" font-weight="bold">14</text>
  <text x="700" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">2週間以内</text>
  <text x="700" y="380" text-anchor="middle" font-size="9" fill="#666">メルマガ</text>
  <text x="700" y="393" text-anchor="middle" font-size="9" fill="#666">ポッドキャスト</text>

  <!-- Bottom note -->
  <rect x="150" y="440" width="500" height="40" rx="20" fill="#f0fdf4"/>
  <text x="400" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">時間差で投稿することで各チャネルの効果を最大化</text>
</svg>
