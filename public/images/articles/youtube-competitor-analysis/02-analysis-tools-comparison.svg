<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f766e"/>
      <stop offset="50%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <filter id="cardShadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="#fafafa"/>

  <!-- Header -->
  <rect width="800" height="64" rx="16" fill="url(#headerGrad2)"/>
  <rect y="32" width="800" height="32" fill="url(#headerGrad2)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">競合分析に使える無料ツール</text>

  <!-- Tool 1: YouTube Studio -->
  <rect x="40" y="90" width="345" height="175" rx="12" fill="#fff" filter="url(#cardShadow2)"/>
  <rect x="40" y="90" width="345" height="5" rx="2.5" fill="#dc2626"/>
  <text x="212" y="125" text-anchor="middle" font-size="26">📺</text>
  <text x="212" y="152" text-anchor="middle" font-size="17" font-weight="bold" fill="#dc2626">YouTube Studio</text>
  <text x="212" y="175" text-anchor="middle" font-size="11" fill="#666">YouTube公式の管理ツール</text>

  <circle cx="75" cy="200" r="4" fill="#dc2626"/>
  <text x="90" y="204" font-size="12" fill="#333">視聴者が見ている他チャンネルの確認</text>
  <circle cx="75" cy="222" r="4" fill="#dc2626"/>
  <text x="90" y="226" font-size="12" fill="#333">検索キーワードのリサーチ</text>
  <circle cx="75" cy="244" r="4" fill="#dc2626"/>
  <text x="90" y="248" font-size="12" fill="#333">自チャンネルとの比較分析</text>

  <!-- Tool 2: Social Blade -->
  <rect x="415" y="90" width="345" height="175" rx="12" fill="#fff" filter="url(#cardShadow2)"/>
  <rect x="415" y="90" width="345" height="5" rx="2.5" fill="#3b82f6"/>
  <text x="587" y="125" text-anchor="middle" font-size="26">📊</text>
  <text x="587" y="152" text-anchor="middle" font-size="17" font-weight="bold" fill="#3b82f6">Social Blade</text>
  <text x="587" y="175" text-anchor="middle" font-size="11" fill="#666">チャンネル統計データの外部サービス</text>

  <circle cx="450" cy="200" r="4" fill="#3b82f6"/>
  <text x="465" y="204" font-size="12" fill="#333">登録者数・再生回数の推移グラフ</text>
  <circle cx="450" cy="222" r="4" fill="#3b82f6"/>
  <text x="465" y="226" font-size="12" fill="#333">推定収益レンジの確認</text>
  <circle cx="450" cy="244" r="4" fill="#3b82f6"/>
  <text x="465" y="248" font-size="12" fill="#333">成長スピードの比較</text>

  <!-- Tool 3: vidIQ -->
  <rect x="40" y="290" width="345" height="175" rx="12" fill="#fff" filter="url(#cardShadow2)"/>
  <rect x="40" y="290" width="345" height="5" rx="2.5" fill="#8b5cf6"/>
  <text x="212" y="325" text-anchor="middle" font-size="26">🔎</text>
  <text x="212" y="352" text-anchor="middle" font-size="17" font-weight="bold" fill="#8b5cf6">vidIQ</text>
  <text x="212" y="375" text-anchor="middle" font-size="11" fill="#666">ブラウザ拡張機能（無料プランあり）</text>

  <circle cx="75" cy="400" r="4" fill="#8b5cf6"/>
  <text x="90" y="404" font-size="12" fill="#333">動画タグ・キーワードの可視化</text>
  <circle cx="75" cy="422" r="4" fill="#8b5cf6"/>
  <text x="90" y="426" font-size="12" fill="#333">SEOスコアの表示</text>
  <circle cx="75" cy="444" r="4" fill="#8b5cf6"/>
  <text x="90" y="448" font-size="12" fill="#333">競合動画のパフォーマンス表示</text>

  <!-- Tool 4: TubeBuddy -->
  <rect x="415" y="290" width="345" height="175" rx="12" fill="#fff" filter="url(#cardShadow2)"/>
  <rect x="415" y="290" width="345" height="5" rx="2.5" fill="#10b981"/>
  <text x="587" y="325" text-anchor="middle" font-size="26">🛠</text>
  <text x="587" y="352" text-anchor="middle" font-size="17" font-weight="bold" fill="#10b981">TubeBuddy</text>
  <text x="587" y="375" text-anchor="middle" font-size="11" fill="#666">ブラウザ拡張機能（無料プランあり）</text>

  <circle cx="450" cy="400" r="4" fill="#10b981"/>
  <text x="465" y="404" font-size="12" fill="#333">タグ候補の提案・比較</text>
  <circle cx="450" cy="422" r="4" fill="#10b981"/>
  <text x="465" y="426" font-size="12" fill="#333">サムネイルのA/Bテスト</text>
  <circle cx="450" cy="444" r="4" fill="#10b981"/>
  <text x="465" y="448" font-size="12" fill="#333">チャンネル間の比較レポート</text>
</svg>
