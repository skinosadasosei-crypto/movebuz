<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#eff6ff"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">YouTube広告の主な種類</text>
  <g transform="translate(50,75)">
    <rect width="340" height="110" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect width="100" height="110" rx="12" fill="#3b82f6"/>
    <rect x="86" width="14" height="110" fill="#3b82f6"/>
    <text x="50" y="50" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="white">インストリーム</text>
    <text x="50" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#dbeafe">スキップ可能</text>
    <text x="120" y="35" font-family="sans-serif" font-weight="600" font-size="13" fill="#1e40af">動画再生前に表示</text>
    <text x="120" y="58" font-family="sans-serif" font-size="12" fill="#64748b">5秒後にスキップ可能。</text>
    <text x="120" y="76" font-family="sans-serif" font-size="12" fill="#64748b">30秒以上視聴or</text>
    <text x="120" y="94" font-family="sans-serif" font-size="12" fill="#64748b">クリックで課金。</text>
  </g>
  <g transform="translate(410,75)">
    <rect width="340" height="110" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="100" height="110" rx="12" fill="#8b5cf6"/>
    <rect x="86" width="14" height="110" fill="#8b5cf6"/>
    <text x="50" y="50" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="white">インストリーム</text>
    <text x="50" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ede9fe">スキップ不可</text>
    <text x="120" y="35" font-family="sans-serif" font-weight="600" font-size="13" fill="#5b21b6">15秒以内の強制視聴</text>
    <text x="120" y="58" font-family="sans-serif" font-size="12" fill="#64748b">完全視聴を保証。</text>
    <text x="120" y="76" font-family="sans-serif" font-size="12" fill="#64748b">インプレッション</text>
    <text x="120" y="94" font-family="sans-serif" font-size="12" fill="#64748b">課金（CPM）。</text>
  </g>
  <g transform="translate(50,205)">
    <rect width="340" height="110" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <rect width="100" height="110" rx="12" fill="#f59e0b"/>
    <rect x="86" width="14" height="110" fill="#f59e0b"/>
    <text x="50" y="50" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="white">ディスカバリー</text>
    <text x="50" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fef3c7">インフィード</text>
    <text x="120" y="35" font-family="sans-serif" font-weight="600" font-size="13" fill="#92400e">検索結果・関連動画に表示</text>
    <text x="120" y="58" font-family="sans-serif" font-size="12" fill="#64748b">サムネイル+テキストで</text>
    <text x="120" y="76" font-family="sans-serif" font-size="12" fill="#64748b">表示。クリックで</text>
    <text x="120" y="94" font-family="sans-serif" font-size="12" fill="#64748b">課金（CPC）。</text>
  </g>
  <g transform="translate(410,205)">
    <rect width="340" height="110" rx="12" fill="white" stroke="#ec4899" stroke-width="2"/>
    <rect width="100" height="110" rx="12" fill="#ec4899"/>
    <rect x="86" width="14" height="110" fill="#ec4899"/>
    <text x="50" y="50" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="white">バンパー</text>
    <text x="50" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fce7f3">6秒広告</text>
    <text x="120" y="35" font-family="sans-serif" font-weight="600" font-size="13" fill="#9d174d">6秒の超短尺広告</text>
    <text x="120" y="58" font-family="sans-serif" font-size="12" fill="#64748b">スキップ不可。</text>
    <text x="120" y="76" font-family="sans-serif" font-size="12" fill="#64748b">ブランド認知向け。</text>
    <text x="120" y="94" font-family="sans-serif" font-size="12" fill="#64748b">CPM課金。</text>
  </g>
  <g transform="translate(50,340)">
    <rect width="700" height="80" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#1e40af">初心者におすすめ</text>
    <text x="350" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a5f">まずは「スキップ可能なインストリーム広告」から始めるのが安全。</text>
    <text x="350" y="73" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3a5f">視聴されなければ課金されないため、費用対効果を測りやすいのが利点です。</text>
  </g>
</svg>