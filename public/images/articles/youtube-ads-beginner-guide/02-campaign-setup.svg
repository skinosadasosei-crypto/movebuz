<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#fefce8"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">YouTube広告の出稿ステップ</text>
  <g transform="translate(50,75)">
    <rect width="700" height="70" rx="12" fill="#667eea"/>
    <circle cx="40" cy="35" r="20" fill="white"/>
    <text x="40" y="41" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="#667eea">1</text>
    <text x="80" y="30" font-family="sans-serif" font-weight="700" font-size="15" fill="white">Google広告アカウントを作成</text>
    <text x="80" y="52" font-family="sans-serif" font-size="12" fill="#e0e7ff">ads.google.com にアクセスし、ビジネス情報を登録</text>
  </g>
  <g transform="translate(50,160)">
    <rect width="700" height="70" rx="12" fill="#8b5cf6"/>
    <circle cx="40" cy="35" r="20" fill="white"/>
    <text x="40" y="41" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="#8b5cf6">2</text>
    <text x="80" y="30" font-family="sans-serif" font-weight="700" font-size="15" fill="white">キャンペーン目標を選択</text>
    <text x="80" y="52" font-family="sans-serif" font-size="12" fill="#ede9fe">認知拡大・検討促進・コンバージョンなどから選ぶ</text>
  </g>
  <g transform="translate(50,245)">
    <rect width="700" height="70" rx="12" fill="#ec4899"/>
    <circle cx="40" cy="35" r="20" fill="white"/>
    <text x="40" y="41" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="#ec4899">3</text>
    <text x="80" y="30" font-family="sans-serif" font-weight="700" font-size="15" fill="white">ターゲティングと予算を設定</text>
    <text x="80" y="52" font-family="sans-serif" font-size="12" fill="#fce7f3">地域・年齢・興味関心・配信先チャンネルなどを指定</text>
  </g>
  <g transform="translate(50,330)">
    <rect width="700" height="70" rx="12" fill="#f59e0b"/>
    <circle cx="40" cy="35" r="20" fill="white"/>
    <text x="40" y="41" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="#f59e0b">4</text>
    <text x="80" y="30" font-family="sans-serif" font-weight="700" font-size="15" fill="white">広告用の動画をアップロードして配信開始</text>
    <text x="80" y="52" font-family="sans-serif" font-size="12" fill="#fef3c7">YouTubeにアップロード済みの動画URLを指定し、審査後に配信スタート</text>
  </g>
</svg>