<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#fefce8"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">YouTube動画撮影に必要な機材</text>
  <g transform="translate(50,75)">
    <rect width="220" height="170" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <rect width="220" height="42" rx="12" fill="#f59e0b"/>
    <rect y="30" width="220" height="12" fill="#f59e0b"/>
    <text x="110" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="white">カメラ</text>
    <text x="20" y="68" font-family="sans-serif" font-size="12" fill="#64748b">・スマートフォン（入門）</text>
    <text x="20" y="90" font-family="sans-serif" font-size="12" fill="#64748b">・ミラーレス一眼</text>
    <text x="20" y="112" font-family="sans-serif" font-size="12" fill="#64748b">・Webカメラ（配信用）</text>
    <text x="20" y="140" font-family="sans-serif" font-weight="600" font-size="11" fill="#92400e">最初はスマホで十分OK</text>
  </g>
  <g transform="translate(290,75)">
    <rect width="220" height="170" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
    <rect width="220" height="42" rx="12" fill="#ef4444"/>
    <rect y="30" width="220" height="12" fill="#ef4444"/>
    <text x="110" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="white">マイク（最重要）</text>
    <text x="20" y="68" font-family="sans-serif" font-size="12" fill="#64748b">・ピンマイク（トーク向け）</text>
    <text x="20" y="90" font-family="sans-serif" font-size="12" fill="#64748b">・ショットガンマイク</text>
    <text x="20" y="112" font-family="sans-serif" font-size="12" fill="#64748b">・USBコンデンサーマイク</text>
    <text x="20" y="140" font-family="sans-serif" font-weight="600" font-size="11" fill="#991b1b">音質は映像より重要</text>
  </g>
  <g transform="translate(530,75)">
    <rect width="220" height="170" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect width="220" height="42" rx="12" fill="#3b82f6"/>
    <rect y="30" width="220" height="12" fill="#3b82f6"/>
    <text x="110" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="white">照明</text>
    <text x="20" y="68" font-family="sans-serif" font-size="12" fill="#64748b">・リングライト（顔出し）</text>
    <text x="20" y="90" font-family="sans-serif" font-size="12" fill="#64748b">・LEDパネルライト</text>
    <text x="20" y="112" font-family="sans-serif" font-size="12" fill="#64748b">・自然光＋レフ板</text>
    <text x="20" y="140" font-family="sans-serif" font-weight="600" font-size="11" fill="#1e40af">窓際の自然光が最もきれい</text>
  </g>
  <g transform="translate(50,275)">
    <rect width="340" height="80" rx="10" fill="white" stroke="#22c55e" stroke-width="2"/>
    <text x="170" y="28" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#166534">初心者向けスタートセット</text>
    <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#64748b">スマホ + ピンマイク + リングライト</text>
    <text x="20" y="70" font-family="sans-serif" font-weight="600" font-size="12" fill="#166534">合計1〜2万円から始められる</text>
  </g>
  <g transform="translate(410,275)">
    <rect width="340" height="80" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <text x="170" y="28" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#5b21b6">本格運用セット</text>
    <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#64748b">ミラーレス + ショットガン + LEDパネル</text>
    <text x="20" y="70" font-family="sans-serif" font-weight="600" font-size="12" fill="#5b21b6">15〜30万円で本格的な映像品質に</text>
  </g>
  <g transform="translate(50,380)">
    <rect width="700" height="50" rx="10" fill="#fef9c3" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="350" y="20" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#92400e">機材選びの鉄則</text>
    <text x="350" y="40" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#78350f">カメラよりマイクに投資する。視聴者は映像の粗さより音の悪さで離脱する。</text>
  </g>
</svg>