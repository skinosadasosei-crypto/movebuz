<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#f5f3ff"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">撮影の基本構図とアングル</text>
  <g transform="translate(30,70)">
    <rect width="230" height="170" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="230" height="42" rx="12" fill="#8b5cf6"/>
    <rect y="30" width="230" height="12" fill="#8b5cf6"/>
    <text x="115" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="white">三分割法</text>
    <rect x="20" y="55" width="190" height="105" rx="4" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
    <line x1="83" y1="55" x2="83" y2="160" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="147" y1="55" x2="147" y2="160" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="20" y1="90" x2="210" y2="90" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="20" y1="125" x2="210" y2="125" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="83" cy="90" r="5" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="147" cy="90" r="5" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="83" cy="125" r="5" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="147" cy="125" r="5" fill="#8b5cf6" opacity="0.6"/>
  </g>
  <g transform="translate(285,70)">
    <rect width="230" height="170" rx="12" fill="white" stroke="#ec4899" stroke-width="2"/>
    <rect width="230" height="42" rx="12" fill="#ec4899"/>
    <rect y="30" width="230" height="12" fill="#ec4899"/>
    <text x="115" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="white">トーキングヘッド</text>
    <rect x="20" y="55" width="190" height="105" rx="4" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1"/>
    <circle cx="115" cy="90" r="25" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="85" y="115" width="60" height="35" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="115" y="85" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#be185d">目線の位置</text>
    <line x1="115" y1="95" x2="115" y2="68" stroke="#ec4899" stroke-width="1" stroke-dasharray="3,2"/>
  </g>
  <g transform="translate(540,70)">
    <rect width="230" height="170" rx="12" fill="white" stroke="#0ea5e9" stroke-width="2"/>
    <rect width="230" height="42" rx="12" fill="#0ea5e9"/>
    <rect y="30" width="230" height="12" fill="#0ea5e9"/>
    <text x="115" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="white">ヘッドスペース</text>
    <rect x="20" y="55" width="190" height="105" rx="4" fill="#ecfeff" stroke="#67e8f9" stroke-width="1"/>
    <rect x="60" y="75" width="20" height="10" rx="2" fill="#0ea5e9" opacity="0.3"/>
    <text x="115" y="64" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#0369a1">適切な余白</text>
    <line x1="20" y1="72" x2="210" y2="72" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="115" cy="102" r="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="88" y="124" width="54" height="30" rx="4" fill="#ecfeff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="115" y="98" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#0369a1">頭上に</text>
    <text x="115" y="110" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#0369a1">余白を</text>
  </g>
  <g transform="translate(30,270)">
    <rect width="740" height="65" rx="10" fill="white" stroke="#22c55e" stroke-width="2"/>
    <circle cx="35" cy="32" r="20" fill="#22c55e"/>
    <text x="35" y="38" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">◎</text>
    <text x="70" y="25" font-family="sans-serif" font-weight="700" font-size="14" fill="#166534">良い構図のポイント</text>
    <text x="70" y="48" font-family="sans-serif" font-size="12" fill="#64748b">目線をレンズの高さに合わせる / 背景をすっきり整える / 顔に均一な光を当てる</text>
  </g>
  <g transform="translate(30,350)">
    <rect width="740" height="65" rx="10" fill="white" stroke="#ef4444" stroke-width="2"/>
    <circle cx="35" cy="32" r="20" fill="#ef4444"/>
    <text x="35" y="38" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">×</text>
    <text x="70" y="25" font-family="sans-serif" font-weight="700" font-size="14" fill="#991b1b">避けるべき構図</text>
    <text x="70" y="48" font-family="sans-serif" font-size="12" fill="#64748b">逆光で顔が暗い / 頭が画面ギリギリ / 散らかった背景が映り込む</text>
  </g>
</svg>