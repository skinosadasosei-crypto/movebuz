<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#f0f9ff"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">企業ショート動画のコンテンツアイデア</text>
  <g transform="translate(50,75)">
    <rect width="220" height="160" rx="12" fill="white" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#0ea5e9"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="white">1</text>
    <text x="80" y="35" font-family="sans-serif" font-weight="700" font-size="14" fill="#0c4a6e">ダイジェスト</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">本編のハイライト</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#475569">通常動画の中から最も</text>
    <text x="20" y="103" font-family="sans-serif" font-size="12" fill="#475569">インパクトのあるシーン</text>
    <text x="20" y="121" font-family="sans-serif" font-size="12" fill="#475569">を30秒に凝縮。本編への</text>
    <text x="20" y="139" font-family="sans-serif" font-size="12" fill="#475569">導線になります。</text>
  </g>
  <g transform="translate(290,75)">
    <rect width="220" height="160" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#8b5cf6"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="white">2</text>
    <text x="80" y="35" font-family="sans-serif" font-weight="700" font-size="14" fill="#4c1d95">ビフォーアフター</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">成果の可視化</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#475569">施策前後の変化を</text>
    <text x="20" y="103" font-family="sans-serif" font-size="12" fill="#475569">テンポよく見せる構成。</text>
    <text x="20" y="121" font-family="sans-serif" font-size="12" fill="#475569">制作事例やリフォームなど</text>
    <text x="20" y="139" font-family="sans-serif" font-size="12" fill="#475569">視覚的な差が出る業種向き。</text>
  </g>
  <g transform="translate(530,75)">
    <rect width="220" height="160" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#f59e0b"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="white">3</text>
    <text x="80" y="35" font-family="sans-serif" font-weight="700" font-size="14" fill="#78350f">豆知識・Tips</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">一言で伝わる情報</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#475569">業界の意外な事実や</text>
    <text x="20" y="103" font-family="sans-serif" font-size="12" fill="#475569">すぐ使える小技を</text>
    <text x="20" y="121" font-family="sans-serif" font-size="12" fill="#475569">15〜30秒でコンパクトに。</text>
    <text x="20" y="139" font-family="sans-serif" font-size="12" fill="#475569">シリーズ化しやすい。</text>
  </g>
  <g transform="translate(50,260)">
    <rect width="220" height="160" rx="12" fill="white" stroke="#22c55e" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#22c55e"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="white">4</text>
    <text x="80" y="35" font-family="sans-serif" font-weight="700" font-size="14" fill="#14532d">舞台裏・メイキング</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">親近感を生む</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#475569">撮影の裏側やオフィスの</text>
    <text x="20" y="103" font-family="sans-serif" font-size="12" fill="#475569">雰囲気を見せることで</text>
    <text x="20" y="121" font-family="sans-serif" font-size="12" fill="#475569">企業の人間味を伝え、</text>
    <text x="20" y="139" font-family="sans-serif" font-size="12" fill="#475569">ブランドへの愛着を育てます。</text>
  </g>
  <g transform="translate(290,260)">
    <rect width="220" height="160" rx="12" fill="white" stroke="#ec4899" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#ec4899"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="white">5</text>
    <text x="80" y="35" font-family="sans-serif" font-weight="700" font-size="14" fill="#831843">Q&amp;A回答</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">視聴者の質問に答える</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#475569">コメント欄やSNSで寄せ</text>
    <text x="20" y="103" font-family="sans-serif" font-size="12" fill="#475569">られた質問に短く回答。</text>
    <text x="20" y="121" font-family="sans-serif" font-size="12" fill="#475569">双方向のコミュニケーション</text>
    <text x="20" y="139" font-family="sans-serif" font-size="12" fill="#475569">がエンゲージメントを高めます。</text>
  </g>
  <g transform="translate(530,260)">
    <rect width="220" height="160" rx="12" fill="white" stroke="#6366f1" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="#6366f1"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="white">6</text>
    <text x="80" y="35" font-family="sans-serif" font-weight="700" font-size="14" fill="#312e81">トレンド便乗</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">話題に乗る</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#475569">流行りの音源やフォーマット</text>
    <text x="20" y="103" font-family="sans-serif" font-size="12" fill="#475569">を自社の文脈で活用。</text>
    <text x="20" y="121" font-family="sans-serif" font-size="12" fill="#475569">タイミングが重要なので</text>
    <text x="20" y="139" font-family="sans-serif" font-size="12" fill="#475569">すばやい企画・制作が鍵。</text>
  </g>
</svg>