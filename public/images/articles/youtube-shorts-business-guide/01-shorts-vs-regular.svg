<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" fill="none">
  <rect width="800" height="470" rx="16" fill="#fef2f2"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">ショート動画と通常動画の違い</text>
  <g transform="translate(60,75)">
    <rect width="310" height="360" rx="14" fill="white" stroke="#ef4444" stroke-width="2"/>
    <rect width="310" height="50" rx="14" fill="#ef4444"/>
    <rect y="36" width="310" height="14" fill="#ef4444"/>
    <text x="155" y="35" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="white">ショート動画</text>
    <text x="30" y="85" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">尺</text>
    <text x="30" y="105" font-family="sans-serif" font-size="13" fill="#64748b">60秒以内</text>
    <line x1="30" y1="120" x2="280" y2="120" stroke="#fee2e2" stroke-width="1.5"/>
    <text x="30" y="145" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">画面比率</text>
    <text x="30" y="165" font-family="sans-serif" font-size="13" fill="#64748b">縦型（9:16）</text>
    <line x1="30" y1="180" x2="280" y2="180" stroke="#fee2e2" stroke-width="1.5"/>
    <text x="30" y="205" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">リーチ</text>
    <text x="30" y="225" font-family="sans-serif" font-size="13" fill="#64748b">非登録者への露出が大きい</text>
    <line x1="30" y1="240" x2="280" y2="240" stroke="#fee2e2" stroke-width="1.5"/>
    <text x="30" y="265" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">収益化</text>
    <text x="30" y="285" font-family="sans-serif" font-size="13" fill="#64748b">Shorts広告収益（RPM低め）</text>
    <line x1="30" y1="300" x2="280" y2="300" stroke="#fee2e2" stroke-width="1.5"/>
    <text x="30" y="325" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">向いている用途</text>
    <text x="30" y="345" font-family="sans-serif" font-size="13" fill="#64748b">認知拡大・登録者獲得</text>
  </g>
  <g transform="translate(430,75)">
    <rect width="310" height="360" rx="14" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect width="310" height="50" rx="14" fill="#3b82f6"/>
    <rect y="36" width="310" height="14" fill="#3b82f6"/>
    <text x="155" y="35" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="white">通常動画</text>
    <text x="30" y="85" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">尺</text>
    <text x="30" y="105" font-family="sans-serif" font-size="13" fill="#64748b">制限なし（8〜15分が主流）</text>
    <line x1="30" y1="120" x2="280" y2="120" stroke="#dbeafe" stroke-width="1.5"/>
    <text x="30" y="145" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">画面比率</text>
    <text x="30" y="165" font-family="sans-serif" font-size="13" fill="#64748b">横型（16:9）</text>
    <line x1="30" y1="180" x2="280" y2="180" stroke="#dbeafe" stroke-width="1.5"/>
    <text x="30" y="205" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">リーチ</text>
    <text x="30" y="225" font-family="sans-serif" font-size="13" fill="#64748b">登録者・検索・おすすめ経由</text>
    <line x1="30" y1="240" x2="280" y2="240" stroke="#dbeafe" stroke-width="1.5"/>
    <text x="30" y="265" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">収益化</text>
    <text x="30" y="285" font-family="sans-serif" font-size="13" fill="#64748b">通常広告収益（RPM高め）</text>
    <line x1="30" y1="300" x2="280" y2="300" stroke="#dbeafe" stroke-width="1.5"/>
    <text x="30" y="325" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">向いている用途</text>
    <text x="30" y="345" font-family="sans-serif" font-size="13" fill="#64748b">ファン育成・深い情報提供</text>
  </g>
</svg>