<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="#fafafa"/>

  <!-- Header -->
  <rect width="800" height="64" rx="16" fill="url(#grad1)"/>
  <rect y="32" width="800" height="32" fill="url(#grad1)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">終了画面とカードの役割比較</text>

  <!-- End Screen Section -->
  <rect x="40" y="85" width="345" height="340" rx="14" fill="#fff" filter="url(#shadow1)"/>
  <rect x="40" y="85" width="345" height="50" rx="14" fill="#ede9fe"/>
  <rect x="40" y="115" width="345" height="20" fill="#ede9fe"/>
  <text x="212" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#7c3aed">終了画面（エンドスクリーン）</text>

  <!-- End Screen Icon - Play button with end marker -->
  <rect x="150" y="150" width="120" height="70" rx="8" fill="#7c3aed" opacity="0.15"/>
  <polygon points="195,175 195,205 220,190" fill="#7c3aed"/>
  <rect x="235" y="160" width="20" height="50" rx="4" fill="#7c3aed" opacity="0.5"/>
  <text x="245" y="230" text-anchor="middle" font-size="11" fill="#6d28d9">動画の最後に表示</text>

  <!-- End Screen Details -->
  <line x1="60" y1="248" x2="365" y2="248" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="80" cy="272" r="6" fill="#7c3aed"/>
  <text x="96" y="276" font-size="13" fill="#333">表示位置：動画の最後5〜20秒</text>
  <circle cx="80" cy="300" r="6" fill="#7c3aed"/>
  <text x="96" y="304" font-size="13" fill="#333">配置要素：動画・再生リスト・登録・リンク</text>
  <circle cx="80" cy="328" r="6" fill="#7c3aed"/>
  <text x="96" y="332" font-size="13" fill="#333">目的：次の視聴アクションを促す</text>
  <circle cx="80" cy="356" r="6" fill="#7c3aed"/>
  <text x="96" y="360" font-size="13" fill="#333">条件：動画が25秒以上であること</text>

  <!-- Highlight -->
  <rect x="60" y="380" width="305" height="30" rx="6" fill="#f3e8ff"/>
  <text x="212" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">「次はこちらをご覧ください」</text>

  <!-- Card Section -->
  <rect x="415" y="85" width="345" height="340" rx="14" fill="#fff" filter="url(#shadow1)"/>
  <rect x="415" y="85" width="345" height="50" rx="14" fill="#fef3c7"/>
  <rect x="415" y="115" width="345" height="20" fill="#fef3c7"/>
  <text x="587" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">カード（情報カード）</text>

  <!-- Card Icon - Play button with card popup -->
  <rect x="525" y="150" width="120" height="70" rx="8" fill="#f59e0b" opacity="0.15"/>
  <polygon points="570,175 570,205 595,190" fill="#f59e0b"/>
  <rect x="610" y="152" width="30" height="22" rx="4" fill="#f59e0b" opacity="0.7"/>
  <text x="625" y="166" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">i</text>
  <text x="585" y="230" text-anchor="middle" font-size="11" fill="#92400e">動画の途中で表示</text>

  <!-- Card Details -->
  <line x1="435" y1="248" x2="740" y2="248" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="455" cy="272" r="6" fill="#f59e0b"/>
  <text x="471" y="276" font-size="13" fill="#333">表示位置：任意のタイミング（右上）</text>
  <circle cx="455" cy="300" r="6" fill="#f59e0b"/>
  <text x="471" y="304" font-size="13" fill="#333">配置要素：動画・再生リスト・チャンネル・リンク</text>
  <circle cx="455" cy="328" r="6" fill="#f59e0b"/>
  <text x="471" y="332" font-size="13" fill="#333">目的：関連コンテンツへ途中で誘導</text>
  <circle cx="455" cy="356" r="6" fill="#f59e0b"/>
  <text x="471" y="360" font-size="13" fill="#333">上限：1動画あたり最大5枚まで</text>

  <!-- Highlight -->
  <rect x="435" y="380" width="305" height="30" rx="6" fill="#fef9c3"/>
  <text x="587" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">「ちなみにこちらもどうぞ」</text>

  <!-- VS divider -->
  <circle cx="400" cy="255" r="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">VS</text>

  <!-- Footer -->
  <text x="400" y="460" text-anchor="middle" font-size="11" fill="#999">出典: MOVeBUZ | movebuz.vercel.app</text>
</svg>
