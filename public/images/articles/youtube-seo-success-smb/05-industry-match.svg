      <stop offset="50%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" rx="16" fill="#fafafa"/>
  <rect x="0" y="0" width="800" height="56" rx="16" fill="url(#grad)"/>
