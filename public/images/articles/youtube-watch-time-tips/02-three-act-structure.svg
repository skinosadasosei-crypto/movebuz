<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="retentionLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="520" rx="16" fill="#fafafa"/>
  <rect width="800" height="64" rx="16" fill="url(#grad2)"/>
  <rect y="32" width="800" height="32" fill="url(#grad2)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">動画構成の3幕構造と維持率の関係</text>

  <!-- Chart area -->
  <rect x="40" y="80" width="720" height="260" rx="14" fill="#fff" filter="url(#shadow2)"/>

  <!-- Y-axis label -->
  <text x="65" y="110" font-size="11" fill="#666" font-weight="bold">維持率</text>
  <text x="65" y="130" font-size="10" fill="#999">100%</text>
  <text x="65" y="185" font-size="10" fill="#999">75%</text>
  <text x="65" y="240" font-size="10" fill="#999">50%</text>
  <text x="65" y="295" font-size="10" fill="#999">25%</text>

  <!-- Grid lines -->
  <g opacity="0.15" stroke="#94a3b8">
    <line x1="100" y1="125" x2="730" y2="125"/>
    <line x1="100" y1="180" x2="730" y2="180"/>
    <line x1="100" y1="235" x2="730" y2="235"/>
    <line x1="100" y1="290" x2="730" y2="290"/>
  </g>

  <!-- Act dividers -->
  <line x1="195" y1="100" x2="195" y2="310" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="635" y1="100" x2="635" y2="310" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Act labels -->
  <rect x="110" y="300" width="75" height="24" rx="4" fill="#0891b2" opacity="0.15"/>
  <text x="147" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#0891b2">第1幕 導入</text>

  <rect x="330" y="300" width="90" height="24" rx="4" fill="#0891b2" opacity="0.15"/>
  <text x="375" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#0891b2">第2幕 本編</text>

  <rect x="650" y="300" width="75" height="24" rx="4" fill="#0891b2" opacity="0.15"/>
  <text x="687" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#0891b2">第3幕 結</text>

  <!-- Retention curve (good) -->
  <polyline points="100,130 130,142 160,148 195,155 250,165 320,178 400,192 480,208 560,220 635,232 680,240 730,248"
    fill="none" stroke="url(#retentionLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Area under good curve -->
  <polygon points="100,130 130,142 160,148 195,155 250,165 320,178 400,192 480,208 560,220 635,232 680,240 730,248 730,290 100,290"
    fill="#0891b2" opacity="0.06"/>

  <!-- Retention curve (bad - steep drop) -->
  <polyline points="100,130 130,170 160,210 195,240 250,260 320,272 400,278 480,282 560,285 635,287 680,288 730,289"
    fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8,4"/>

  <!-- Legend -->
  <line x1="480" y1="105" x2="510" y2="105" stroke="#0891b2" stroke-width="3"/>
  <text x="515" y="109" font-size="11" fill="#0891b2">3幕構造を意識した動画</text>
  <line x1="480" y1="120" x2="510" y2="120" stroke="#f43f5e" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="515" y="124" font-size="11" fill="#f43f5e">構成を意識しない動画</text>

  <!-- Tips section -->
  <rect x="40" y="355" width="720" height="135" rx="14" fill="#fff" filter="url(#shadow2)"/>
  <text x="80" y="390" font-size="16" font-weight="bold" fill="#333">各幕のポイント</text>
  <line x1="60" y1="405" x2="740" y2="405" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Tip boxes -->
  <rect x="60" y="415" width="210" height="55" rx="8" fill="#ecfeff"/>
  <text x="165" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#0891b2">導入（10〜15%）</text>
  <text x="165" y="456" text-anchor="middle" font-size="10" fill="#155e75">フック＋動画の価値提示</text>

  <rect x="290" y="415" width="230" height="55" rx="8" fill="#cffafe"/>
  <text x="405" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#0891b2">本編（70〜80%）</text>
  <text x="405" y="456" text-anchor="middle" font-size="10" fill="#155e75">小見出しで区切り＋変化を入れる</text>

  <rect x="540" y="415" width="200" height="55" rx="8" fill="#ecfeff"/>
  <text x="640" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#0891b2">まとめ（10〜15%）</text>
  <text x="640" y="456" text-anchor="middle" font-size="10" fill="#155e75">要点の振り返り＋CTA</text>

  <text x="400" y="507" text-anchor="middle" font-size="11" fill="#999">出典: MOVeBUZ | movebuz.vercel.app</text>
</svg>
