<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#fefce8"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">台本テンプレート（10分動画）</text>
  <g transform="translate(50,70)">
    <rect width="700" height="60" rx="10" fill="#667eea"/>
    <text x="20" y="25" font-family="sans-serif" font-weight="700" font-size="14" fill="white">0:00〜0:30 | オープニング（フック）</text>
    <text x="20" y="48" font-family="sans-serif" font-size="12" fill="#e0e7ff">問題提起 → 動画で得られること → 自己紹介（3行以内）</text>
  </g>
  <g transform="translate(50,145)">
    <rect width="700" height="60" rx="10" fill="#8b5cf6"/>
    <text x="20" y="25" font-family="sans-serif" font-weight="700" font-size="14" fill="white">0:30〜1:30 | 前提の共有</text>
    <text x="20" y="48" font-family="sans-serif" font-size="12" fill="#ede9fe">なぜこのテーマが重要か / 背景知識の補足</text>
  </g>
  <g transform="translate(50,220)">
    <rect width="700" height="80" rx="10" fill="#764ba2"/>
    <text x="20" y="25" font-family="sans-serif" font-weight="700" font-size="14" fill="white">1:30〜8:00 | メインコンテンツ（3〜5パート）</text>
    <text x="20" y="48" font-family="sans-serif" font-size="12" fill="#e8d5f5">パート1：ポイント → 理由 → 具体例（〜2分）</text>
    <text x="20" y="68" font-family="sans-serif" font-size="12" fill="#e8d5f5">パート2〜5：同じ構成を繰り返し。パート間に「次が一番重要です」で繋ぐ</text>
  </g>
  <g transform="translate(50,315)">
    <rect width="340" height="60" rx="10" fill="#ec4899"/>
    <text x="20" y="25" font-family="sans-serif" font-weight="700" font-size="14" fill="white">8:00〜9:00 | まとめ</text>
    <text x="20" y="48" font-family="sans-serif" font-size="12" fill="#fce7f3">要点を箇条書きで振り返り</text>
  </g>
  <g transform="translate(410,315)">
    <rect width="340" height="60" rx="10" fill="#f59e0b"/>
    <text x="20" y="25" font-family="sans-serif" font-weight="700" font-size="14" fill="white">9:00〜10:00 | CTA</text>
    <text x="20" y="48" font-family="sans-serif" font-size="12" fill="#fef3c7">登録・高評価・関連動画への誘導</text>
  </g>
  <g transform="translate(50,395)">
    <rect width="700" height="35" rx="8" fill="#fef9c3"/>
    <text x="350" y="23" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#854d0e">文字数の目安：10分動画 ≒ 3,000〜4,000文字（話す速度により調整）</text>
  </g>
</svg>