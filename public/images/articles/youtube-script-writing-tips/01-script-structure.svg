<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#f0f4ff"/>
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">台本の基本構成</text>
  <g transform="translate(80,80)">
    <rect width="180" height="100" rx="12" fill="#667eea"/>
    <text x="90" y="40" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="white">オープニング</text>
    <text x="90" y="65" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e0e7ff">冒頭15秒で掴む</text>
    <text x="90" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e0e7ff">問題提起＋結論</text>
  </g>
  <g transform="translate(310,80)">
    <rect width="180" height="100" rx="12" fill="#764ba2"/>
    <text x="90" y="40" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="white">メインパート</text>
    <text x="90" y="65" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e8d5f5">ポイントを3〜5つ</text>
    <text x="90" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e8d5f5">具体例で解説</text>
  </g>
  <g transform="translate(540,80)">
    <rect width="180" height="100" rx="12" fill="#ec4899"/>
    <text x="90" y="40" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="white">エンディング</text>
    <text x="90" y="65" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fce7f3">まとめ＋CTA</text>
    <text x="90" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#fce7f3">チャンネル登録誘導</text>
  </g>
  <line x1="260" y1="130" x2="310" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="490" y1="130" x2="540" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <g transform="translate(100,220)">
    <rect width="600" height="50" rx="10" fill="#dbeafe"/>
    <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="15" fill="#1e40af">視聴維持率を意識した流れが重要</text>
  </g>
  <g transform="translate(100,290)">
    <rect width="280" height="120" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="140" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#334155">話し言葉で書く</text>
    <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#64748b">・「〜ですよね」「〜なんです」</text>
    <text x="20" y="75" font-family="sans-serif" font-size="12" fill="#64748b">・短い文で区切る</text>
    <text x="20" y="95" font-family="sans-serif" font-size="12" fill="#64748b">・漢字を使いすぎない</text>
  </g>
  <g transform="translate(420,290)">
    <rect width="280" height="120" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="140" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#334155">時間配分の目安</text>
    <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#64748b">・オープニング：全体の10%</text>
    <text x="20" y="75" font-family="sans-serif" font-size="12" fill="#64748b">・メインパート：全体の80%</text>
    <text x="20" y="95" font-family="sans-serif" font-size="12" fill="#64748b">・エンディング：全体の10%</text>
  </g>
</svg>