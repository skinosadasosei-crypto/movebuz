<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad11" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <filter id="shadow11" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" rx="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="60" rx="16" fill="url(#grad11)"/>
  <rect x="0" y="16" width="800" height="44" fill="url(#grad11)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">運用代行会社を選ぶ5つのポイント</text>

  <!-- Item 1 -->
  <rect x="40" y="90" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow11)"/>
  <rect x="40" y="90" width="6" height="80" rx="3" fill="#f58529"/>
  <!-- Checkbox -->
  <rect x="65" y="115" width="30" height="30" rx="6" fill="#fff" stroke="#f58529" stroke-width="2"/>
  <polyline points="72,132 80,140 92,122" fill="none" stroke="#f58529" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="115" y="125" fill="#333" font-size="18" font-weight="bold">同業種の実績</text>
  <text x="115" y="150" fill="#777" font-size="14">自社と同じ業界での成功事例があるかを確認</text>

  <!-- Item 2 -->
  <rect x="40" y="186" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow11)"/>
  <rect x="40" y="186" width="6" height="80" rx="3" fill="#dd2a7b"/>
  <rect x="65" y="211" width="30" height="30" rx="6" fill="#fff" stroke="#dd2a7b" stroke-width="2"/>
  <polyline points="72,228 80,236 92,218" fill="none" stroke="#dd2a7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="115" y="221" fill="#333" font-size="18" font-weight="bold">企画力</text>
  <text x="115" y="246" fill="#777" font-size="14">トレンドを踏まえた企画提案ができるかどうか</text>

  <!-- Item 3 -->
  <rect x="40" y="282" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow11)"/>
  <rect x="40" y="282" width="6" height="80" rx="3" fill="#8134af"/>
  <rect x="65" y="307" width="30" height="30" rx="6" fill="#fff" stroke="#8134af" stroke-width="2"/>
  <polyline points="72,324 80,332 92,314" fill="none" stroke="#8134af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="115" y="317" fill="#333" font-size="18" font-weight="bold">データに基づくレポート</text>
  <text x="115" y="342" fill="#777" font-size="14">視聴データを分析し、改善提案まで行ってくれるか</text>

  <!-- Item 4 -->
  <rect x="40" y="378" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow11)"/>
  <rect x="40" y="378" width="6" height="80" rx="3" fill="#515bd4"/>
  <rect x="65" y="403" width="30" height="30" rx="6" fill="#fff" stroke="#515bd4" stroke-width="2"/>
  <polyline points="72,420 80,428 92,410" fill="none" stroke="#515bd4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="115" y="413" fill="#333" font-size="18" font-weight="bold">コミュニケーション</text>
  <text x="115" y="438" fill="#777" font-size="14">レスポンスの速さ、担当者との相性も重要なポイント</text>

  <!-- Item 5 -->
  <rect x="40" y="474" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow11)"/>
  <rect x="40" y="474" width="6" height="80" rx="3" fill="#c4389d"/>
  <rect x="65" y="499" width="30" height="30" rx="6" fill="#fff" stroke="#c4389d" stroke-width="2"/>
  <polyline points="72,516 80,524 92,506" fill="none" stroke="#c4389d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="115" y="509" fill="#333" font-size="18" font-weight="bold">契約期間・解約条件</text>
  <text x="115" y="534" fill="#777" font-size="14">最低契約期間や途中解約のペナルティを事前に確認</text>

  <!-- Bottom label -->
  <text x="400" y="572" text-anchor="middle" fill="#999" font-size="12">5つのポイントを比較して最適なパートナーを見つけよう</text>
</svg>