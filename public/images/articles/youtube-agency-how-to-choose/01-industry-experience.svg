  <line x1="60" y1="145" x2="740" y2="145" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="70" y="160" width="200" height="70" rx="8" fill="#ffe4e6"/>
  <text x="170" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#e11d48">業界によって異なる</text>
  <text x="170" y="210" text-anchor="middle" font-size="11" fill="#9f1239">効果的な動画テーマ</text>

  <rect x="300" y="160" width="200" height="70" rx="8" fill="#fce7f3"/>
  <text x="400" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#be185d">視聴者の行動パターン</text>
  <text x="400" y="210" text-anchor="middle" font-size="11" fill="#9d174d">ターゲットの特性を理解</text>

  <rect x="530" y="160" width="200" height="70" rx="8" fill="#fdf2f8"/>
  <text x="630" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#db2777">構成・編集の最適解</text>
  <text x="630" y="210" text-anchor="middle" font-size="11" fill="#be185d">業種ごとに異なる</text>

  <!-- Checklist -->
  <rect x="40" y="280" width="720" height="200" rx="14" fill="#fff" filter="url(#shadow1)"/>
  <text x="80" y="315" font-size="16" font-weight="bold" fill="#333">✅ 確認すべきポイント</text>
  <line x1="60" y1="330" x2="740" y2="330" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="60" y="345" width="330" height="50" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
