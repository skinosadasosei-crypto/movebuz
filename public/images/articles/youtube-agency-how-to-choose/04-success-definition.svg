  <text x="590" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">🏭 代行会社のKPI</text>
  <line x1="450" y1="155" x2="730" y2="155" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="445" y="170" width="290" height="45" rx="8" fill="#f0fdfa"/>
