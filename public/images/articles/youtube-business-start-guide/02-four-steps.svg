<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="gradA2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <filter id="shadowA2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" rx="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="64" rx="16" fill="url(#gradA2)"/>
  <rect y="32" width="800" height="32" fill="url(#gradA2)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">YouTube開設から運用までの4ステップ</text>

  <!-- Vertical timeline line -->
  <line x1="120" y1="120" x2="120" y2="490" stroke="url(#gradA2)" stroke-width="3" opacity="0.2"/>

  <!-- Step 1 -->
  <circle cx="120" cy="150" r="22" fill="#f58529"/>
  <text x="120" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
  <rect x="170" y="115" width="580" height="90" rx="12" fill="#fff" filter="url(#shadowA2)"/>
  <rect x="170" y="115" width="580" height="6" rx="3" fill="#f58529"/>
  <text x="200" y="150" font-size="17" font-weight="bold" fill="#333">方向性を決める</text>
  <rect x="200" y="162" width="520" height="28" rx="6" fill="#f58529" opacity="0.06"/>
  <text x="216" y="181" font-size="13" fill="#666">ターゲット</text>
  <text x="306" y="181" font-size="13" fill="#f58529" font-weight="bold">x</text>
  <text x="330" y="181" font-size="13" fill="#666">テーマ</text>
  <text x="394" y="181" font-size="13" fill="#f58529" font-weight="bold">x</text>
  <text x="418" y="181" font-size="13" fill="#666">形式 を明確にする</text>

  <!-- Arrow connector 1->2 -->
  <path d="M120,172 L120,220" stroke="url(#gradA2)" stroke-width="2" opacity="0.3" fill="none" stroke-dasharray="4,3"/>

  <!-- Step 2 -->
  <circle cx="120" cy="250" r="22" fill="#dd2a7b"/>
  <text x="120" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
  <rect x="170" y="215" width="580" height="90" rx="12" fill="#fff" filter="url(#shadowA2)"/>
  <rect x="170" y="215" width="580" height="6" rx="3" fill="#dd2a7b"/>
  <text x="200" y="250" font-size="17" font-weight="bold" fill="#333">チャンネルを開設</text>
  <rect x="200" y="262" width="520" height="28" rx="6" fill="#dd2a7b" opacity="0.06"/>
  <text x="216" y="281" font-size="13" fill="#666">ブランドアカウントで作成 + アイコン・バナー・概要欄の初期設定</text>

  <!-- Arrow connector 2->3 -->
  <path d="M120,272 L120,320" stroke="url(#gradA2)" stroke-width="2" opacity="0.3" fill="none" stroke-dasharray="4,3"/>

  <!-- Step 3 -->
  <circle cx="120" cy="350" r="22" fill="#8134af"/>
  <text x="120" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
  <rect x="170" y="315" width="580" height="90" rx="12" fill="#fff" filter="url(#shadowA2)"/>
  <rect x="170" y="315" width="580" height="6" rx="3" fill="#8134af"/>
  <text x="200" y="350" font-size="17" font-weight="bold" fill="#333">最初の動画を企画</text>
  <rect x="200" y="362" width="520" height="28" rx="6" fill="#8134af" opacity="0.06"/>
  <text x="216" y="381" font-size="13" fill="#666">ターゲットの悩みに答える動画からスタート</text>

  <!-- Arrow connector 3->4 -->
  <path d="M120,372 L120,420" stroke="url(#gradA2)" stroke-width="2" opacity="0.3" fill="none" stroke-dasharray="4,3"/>

  <!-- Step 4 -->
  <circle cx="120" cy="450" r="22" fill="#515bd4"/>
  <text x="120" y="456" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text>
  <rect x="170" y="415" width="580" height="90" rx="12" fill="#fff" filter="url(#shadowA2)"/>
  <rect x="170" y="415" width="580" height="6" rx="3" fill="#515bd4"/>
  <text x="200" y="450" font-size="17" font-weight="bold" fill="#333">継続的に運用</text>
  <rect x="200" y="462" width="520" height="28" rx="6" fill="#515bd4" opacity="0.06"/>
  <text x="216" y="481" font-size="13" fill="#666">週1〜2本ペース、最低3〜6ヶ月は継続して効果を検証</text>

  <!-- Footer note -->
  <text x="400" y="545" text-anchor="middle" font-size="11" fill="#999">出典: 動画のミカタ | douga-no-mikata.com</text>
</svg>