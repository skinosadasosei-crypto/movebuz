<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="100%" style="stop-color:#dd2a7b"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dd2a7b"/>
      <stop offset="100%" style="stop-color:#8134af"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#515bd4"/>
      <stop offset="100%" style="stop-color:#8134af"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" rx="16" ry="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="64" rx="16" ry="16" fill="url(#headerGrad)"/>
  <rect y="32" width="800" height="32" fill="url(#headerGrad)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">最低限チェックすべき4つの指標</text>

  <!-- Card 1: 視聴回数 -->
  <rect x="40" y="92" width="720" height="100" rx="12" ry="12" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="40" y="92" width="8" height="100" rx="4" ry="4" fill="url(#accent1)"/>
  <circle cx="90" cy="142" r="28" fill="#fff3e6"/>
  <text x="90" y="138" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#f58529">No.</text>
  <text x="90" y="156" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#f58529">1</text>
  <text x="140" y="130" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#333333">視聴回数</text>
  <text x="140" y="158" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#666666">動画の再生された回数</text>
  <!-- Mini bar chart icon -->
  <rect x="660" y="120" width="12" height="35" rx="2" fill="#f58529" opacity="0.3"/>
  <rect x="678" y="110" width="12" height="45" rx="2" fill="#f58529" opacity="0.5"/>
  <rect x="696" y="100" width="12" height="55" rx="2" fill="#f58529" opacity="0.7"/>
  <rect x="714" y="115" width="12" height="40" rx="2" fill="#f58529"/>

  <!-- Card 2: クリック率 -->
  <rect x="40" y="208" width="720" height="110" rx="12" ry="12" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="40" y="208" width="8" height="110" rx="4" ry="4" fill="url(#accent2)"/>
  <circle cx="90" cy="263" r="28" fill="#fce4f0"/>
  <text x="90" y="259" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#dd2a7b">No.</text>
  <text x="90" y="277" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#dd2a7b">2</text>
  <text x="140" y="246" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#333333">クリック率（CTR）</text>
  <text x="140" y="272" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#666666">サムネイル表示 → クリックの割合</text>
  <rect x="140" y="284" width="100" height="24" rx="12" fill="#fce4f0"/>
  <text x="190" y="301" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#dd2a7b">目安 4〜10%</text>

  <!-- Card 3: 平均視聴時間 -->
  <rect x="40" y="334" width="720" height="110" rx="12" ry="12" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="40" y="334" width="8" height="110" rx="4" ry="4" fill="url(#accent3)"/>
  <circle cx="90" cy="389" r="28" fill="#f0e6ff"/>
  <text x="90" y="385" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#8134af">No.</text>
  <text x="90" y="403" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#8134af">3</text>
  <text x="140" y="372" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#333333">平均視聴時間</text>
  <text x="140" y="398" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#666666">視聴者が平均何分見たか</text>
  <rect x="140" y="410" width="110" height="24" rx="12" fill="#f0e6ff"/>
  <text x="195" y="427" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#8134af">目安 50%以上</text>

  <!-- Card 4: 視聴者維持率 -->
  <rect x="40" y="460" width="720" height="80" rx="12" ry="12" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="40" y="460" width="8" height="80" rx="4" ry="4" fill="url(#accent4)"/>
  <circle cx="90" cy="500" r="28" fill="#e8eaff"/>
  <text x="90" y="496" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#515bd4">No.</text>
  <text x="90" y="514" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#515bd4">4</text>
  <text x="140" y="490" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="bold" fill="#333333">視聴者維持率</text>
  <text x="140" y="516" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#666666">どの部分で離脱したか</text>
  <rect x="430" y="488" width="140" height="24" rx="12" fill="#e8eaff"/>
  <text x="500" y="505" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#515bd4">冒頭30秒に注目</text>
</svg>