<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <linearGradient id="freqGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="100%" style="stop-color:#dd2a7b"/>
    </linearGradient>
    <linearGradient id="freqGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dd2a7b"/>
      <stop offset="100%" style="stop-color:#8134af"/>
    </linearGradient>
    <linearGradient id="freqGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" rx="16" ry="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="64" rx="16" ry="16" fill="url(#headerGrad)"/>
  <rect y="32" width="800" height="32" fill="url(#headerGrad)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">YouTube Studio 運用ルーティン</text>

  <!-- Section 1: 毎日 -->
  <rect x="40" y="92" width="720" height="140" rx="12" ry="12" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Frequency badge -->
  <rect x="56" y="108" width="80" height="36" rx="18" fill="url(#freqGrad1)"/>
  <text x="96" y="131" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">毎日</text>
  <!-- Time indicator -->
  <rect x="150" y="114" width="70" height="24" rx="12" fill="#fff3e6"/>
  <text x="185" y="131" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#f58529">約6分</text>

  <!-- Checklist items -->
  <!-- Item 1 -->
  <rect x="72" y="158" width="22" height="22" rx="4" fill="none" stroke="#f58529" stroke-width="2"/>
  <polyline points="77,170 82,175 90,164" fill="none" stroke="#f58529" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="106" y="174" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#333333">ダッシュボードチェック</text>
  <rect x="340" y="161" width="50" height="20" rx="10" fill="#fff3e6"/>
  <text x="365" y="175" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="#f58529">1分</text>

  <!-- Item 2 -->
  <rect x="72" y="192" width="22" height="22" rx="4" fill="none" stroke="#dd2a7b" stroke-width="2"/>
  <polyline points="77,204 82,209 90,198" fill="none" stroke="#dd2a7b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="106" y="208" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#333333">コメント返信</text>
  <rect x="260" y="195" width="50" height="20" rx="10" fill="#fce4f0"/>
  <text x="285" y="209" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="#dd2a7b">5分</text>

  <!-- Daily visual: small calendar dots -->
  <g transform="translate(620, 130)">
    <text x="50" y="0" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#999999">DAILY</text>
    <g transform="translate(0, 12)">
      <circle cx="10" cy="10" r="8" fill="#f58529" opacity="0.8"/><circle cx="30" cy="10" r="8" fill="#f58529" opacity="0.8"/><circle cx="50" cy="10" r="8" fill="#f58529" opacity="0.8"/><circle cx="70" cy="10" r="8" fill="#f58529" opacity="0.8"/><circle cx="90" cy="10" r="8" fill="#f58529" opacity="0.8"/>
      <circle cx="10" cy="30" r="8" fill="#dd2a7b" opacity="0.6"/><circle cx="30" cy="30" r="8" fill="#dd2a7b" opacity="0.6"/>
    </g>
  </g>

  <!-- Section 2: 週1回 -->
  <rect x="40" y="252" width="720" height="140" rx="12" ry="12" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Frequency badge -->
  <rect x="56" y="268" width="80" height="36" rx="18" fill="url(#freqGrad2)"/>
  <text x="96" y="291" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">週1回</text>
  <!-- Time indicator -->
  <rect x="150" y="274" width="70" height="24" rx="12" fill="#fce4f0"/>
  <text x="185" y="291" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#dd2a7b">約10分</text>

  <!-- Checklist items -->
  <rect x="72" y="318" width="22" height="22" rx="4" fill="none" stroke="#8134af" stroke-width="2"/>
  <polyline points="77,330 82,335 90,324" fill="none" stroke="#8134af" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="106" y="334" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#333333">アナリティクス確認</text>
  <rect x="310" y="321" width="60" height="20" rx="10" fill="#f0e6ff"/>
  <text x="340" y="335" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="#8134af">10分</text>

  <rect x="72" y="352" width="22" height="22" rx="4" fill="none" stroke="#515bd4" stroke-width="2"/>
  <polyline points="77,364 82,369 90,358" fill="none" stroke="#515bd4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="106" y="368" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#333333">次の動画の参考にする（人気動画・離脱ポイントを確認）</text>

  <!-- Weekly visual: bar chart -->
  <g transform="translate(630, 300)">
    <text x="40" y="0" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#999999">WEEKLY</text>
    <rect x="0" y="20" width="14" height="40" rx="3" fill="#dd2a7b" opacity="0.3"/>
    <rect x="20" y="30" width="14" height="30" rx="3" fill="#8134af" opacity="0.4"/>
    <rect x="40" y="15" width="14" height="45" rx="3" fill="#8134af" opacity="0.6"/>
    <rect x="60" y="25" width="14" height="35" rx="3" fill="#8134af" opacity="0.8"/>
  </g>

  <!-- Section 3: 月1回 -->
  <rect x="40" y="412" width="720" height="130" rx="12" ry="12" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Frequency badge -->
  <rect x="56" y="428" width="80" height="36" rx="18" fill="url(#freqGrad3)"/>
  <text x="96" y="451" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">月1回</text>
  <!-- Time indicator -->
  <rect x="150" y="434" width="80" height="24" rx="12" fill="#e8eaff"/>
  <text x="190" y="451" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#515bd4">約30分</text>

  <!-- Checklist items -->
  <rect x="72" y="478" width="22" height="22" rx="4" fill="none" stroke="#8134af" stroke-width="2"/>
  <polyline points="77,490 82,495 90,484" fill="none" stroke="#8134af" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="106" y="494" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#333333">パフォーマンス振り返り（月間の成長を確認）</text>

  <rect x="72" y="510" width="22" height="22" rx="4" fill="none" stroke="#515bd4" stroke-width="2"/>
  <polyline points="77,522 82,527 90,516" fill="none" stroke="#515bd4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="106" y="526" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#333333">カスタマイズ見直し（バナー・セクション・説明文の更新）</text>

  <!-- Monthly visual: circular progress -->
  <g transform="translate(680, 450)">
    <text x="0" y="-6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#999999">MONTHLY</text>
    <circle cx="0" cy="30" r="24" fill="none" stroke="#e8eaff" stroke-width="5"/>
    <circle cx="0" cy="30" r="24" fill="none" stroke="url(#freqGrad3)" stroke-width="5" stroke-dasharray="113" stroke-dashoffset="30" stroke-linecap="round" transform="rotate(-90, 0, 30)"/>
    <text x="0" y="35" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#8134af">30日</text>
  </g>
</svg>