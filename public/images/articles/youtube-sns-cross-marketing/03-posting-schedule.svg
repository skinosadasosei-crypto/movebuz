<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#f0f9ff"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">SNS連携の投稿スケジュール例</text>
  <g transform="translate(50,70)">
    <rect width="700" height="40" rx="8" fill="#0ea5e9"/>
    <text x="80" y="26" font-family="sans-serif" font-weight="700" font-size="14" fill="white">曜日</text>
    <text x="230" y="26" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="white">YouTube</text>
    <text x="400" y="26" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="white">X (Twitter)</text>
    <text x="580" y="26" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="white">Instagram</text>
  </g>
  <g transform="translate(50,115)">
    <rect width="700" height="45" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="28" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">月曜</text>
    <text x="230" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">—</text>
    <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d9bf0">予告ポスト投稿</text>
    <text x="580" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">—</text>
  </g>
  <g transform="translate(50,165)">
    <rect width="700" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="28" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">火曜</text>
    <text x="230" y="28" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ef4444">本編動画公開</text>
    <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d9bf0">公開告知＋ハイライト</text>
    <text x="580" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e1306c">ストーリーズで告知</text>
  </g>
  <g transform="translate(50,215)">
    <rect width="700" height="45" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="28" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">水曜</text>
    <text x="230" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">—</text>
    <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d9bf0">要点まとめスレッド</text>
    <text x="580" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">—</text>
  </g>
  <g transform="translate(50,265)">
    <rect width="700" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="28" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">木曜</text>
    <text x="230" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ef4444">ショート動画①</text>
    <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d9bf0">名言カード投稿</text>
    <text x="580" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e1306c">リール投稿</text>
  </g>
  <g transform="translate(50,315)">
    <rect width="700" height="45" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="28" font-family="sans-serif" font-weight="600" font-size="13" fill="#334155">金曜</text>
    <text x="230" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">—</text>
    <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1d9bf0">ショート告知</text>
    <text x="580" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e1306c">カルーセル投稿</text>
  </g>
  <g transform="translate(50,375)">
    <rect width="700" height="55" rx="10" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
    <text x="350" y="22" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#0e7490">ポイント</text>
    <text x="350" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#155e75">YouTube公開日を起点に、各SNSの投稿を前後に配置して相互送客する</text>
  </g>
</svg>