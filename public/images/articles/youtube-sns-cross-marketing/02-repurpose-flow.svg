  </g>
  <line x1="400" y1="140" x2="400" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="165" x2="130" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="165" x2="400" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="165" x2="670" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <g transform="translate(30,195)">
