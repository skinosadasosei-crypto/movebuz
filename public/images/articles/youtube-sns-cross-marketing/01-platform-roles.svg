<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#f8fafc"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">各SNSの役割と連携イメージ</text>
  <g transform="translate(300,70)">
    <circle cx="100" cy="60" r="55" fill="#ef4444" opacity="0.9"/>
    <text x="100" y="55" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="white">YouTube</text>
    <text x="100" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fecdd3">深い理解・信頼構築</text>
  </g>
  <line x1="340" y1="130" x2="200" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="460" y1="130" x2="600" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="400" y1="130" x2="400" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <g transform="translate(50,210)">
    <rect width="200" height="100" rx="12" fill="white" stroke="#1d9bf0" stroke-width="2"/>
    <text x="100" y="35" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#1d9bf0">X (Twitter)</text>
    <text x="100" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">拡散・話題化</text>
    <text x="100" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">動画の切り抜き投稿</text>
  </g>
  <g transform="translate(300,210)">
    <rect width="200" height="100" rx="12" fill="white" stroke="#e1306c" stroke-width="2"/>
    <text x="100" y="35" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#e1306c">Instagram</text>
    <text x="100" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">ビジュアル訴求</text>
    <text x="100" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">リールでの予告編</text>
  </g>
  <g transform="translate(550,210)">
    <rect width="200" height="100" rx="12" fill="white" stroke="#0a66c2" stroke-width="2"/>
    <text x="100" y="35" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#0a66c2">LinkedIn</text>
    <text x="100" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">BtoB・専門性</text>
    <text x="100" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">ノウハウ記事との連動</text>
  </g>
  <g transform="translate(50,345)">
    <rect width="700" height="80" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#334155">連携の基本方針</text>
    <text x="350" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">SNSで「興味」を生み → YouTubeで「理解」を深め → Webサイトで「行動」につなげる</text>
  </g>
</svg>