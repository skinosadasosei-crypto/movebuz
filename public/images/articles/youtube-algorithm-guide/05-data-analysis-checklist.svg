<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <filter id="shadow5" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" ry="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="64" rx="16" ry="16" fill="url(#grad5)"/>
  <rect y="32" width="800" height="32" fill="url(#grad5)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">データ分析チェックリスト</text>

  <!-- Table container -->
  <rect x="40" y="96" width="720" height="360" rx="12" ry="12" fill="#fff" filter="url(#shadow5)"/>

  <!-- Table header -->
  <rect x="40" y="96" width="720" height="52" rx="12" ry="12" fill="#f8f8f8"/>
  <rect x="40" y="126" width="720" height="22" fill="#f8f8f8"/>
  <!-- Header dividers -->
  <line x1="280" y1="100" x2="280" y2="148" stroke="#e5e5e5" stroke-width="1"/>
  <line x1="480" y1="100" x2="480" y2="148" stroke="#e5e5e5" stroke-width="1"/>
  <!-- Header text -->
  <text x="160" y="128" text-anchor="middle" fill="#555" font-size="15" font-weight="bold">チェック項目</text>
  <text x="380" y="128" text-anchor="middle" fill="#555" font-size="15" font-weight="bold">確認頻度</text>
  <text x="620" y="128" text-anchor="middle" fill="#555" font-size="15" font-weight="bold">改善アクション</text>
  <!-- Header bottom border -->
  <line x1="40" y1="148" x2="760" y2="148" stroke="#e5e5e5" stroke-width="1.5"/>

  <!-- Row 1: CTR -->
  <rect x="40" y="148" width="720" height="76" fill="#fff"/>
  <!-- Color accent -->
  <rect x="40" y="148" width="5" height="76" fill="#f58529"/>
  <!-- Checkbox icon -->
  <rect x="62" y="172" width="24" height="24" rx="6" ry="6" fill="#f5852920" stroke="#f58529" stroke-width="1.5"/>
  <text x="74" y="190" text-anchor="middle" fill="#f58529" font-size="14" font-weight="bold">✓</text>
  <!-- Item -->
  <text x="100" y="183" fill="#333" font-size="16" font-weight="bold">CTR</text>
  <text x="100" y="204" fill="#999" font-size="11">クリック率</text>
  <!-- Divider -->
  <line x1="280" y1="152" x2="280" y2="220" stroke="#f0f0f0" stroke-width="1"/>
  <!-- Frequency -->
  <rect x="330" y="172" width="100" height="28" rx="14" fill="#f5852912"/>
  <text x="380" y="191" text-anchor="middle" fill="#f58529" font-size="13" font-weight="bold">動画ごと</text>
  <!-- Divider -->
  <line x1="480" y1="152" x2="480" y2="220" stroke="#f0f0f0" stroke-width="1"/>
  <!-- Action -->
  <text x="500" y="189" fill="#666" font-size="13">サムネイル・タイトル改善</text>
  <!-- Row border -->
  <line x1="45" y1="224" x2="755" y2="224" stroke="#f0f0f0" stroke-width="1"/>

