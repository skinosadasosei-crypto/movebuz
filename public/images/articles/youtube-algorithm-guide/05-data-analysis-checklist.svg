  <rect x="40" y="224" width="720" height="76" fill="#fff"/>
  <rect x="40" y="224" width="5" height="76" fill="#dd2a7b"/>
  <rect x="62" y="248" width="24" height="24" rx="6" ry="6" fill="#dd2a7b20" stroke="#dd2a7b" stroke-width="1.5"/>
  <text x="74" y="266" text-anchor="middle" fill="#dd2a7b" font-size="14" font-weight="bold">✓</text>
  <text x="100" y="259" fill="#333" font-size="16" font-weight="bold">視聴維持率</text>
  <text x="100" y="280" fill="#999" font-size="11">平均視聴時間の割合</text>
  <line x1="280" y1="228" x2="280" y2="296" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="330" y="248" width="100" height="28" rx="14" fill="#dd2a7b12"/>
  <text x="380" y="267" text-anchor="middle" fill="#dd2a7b" font-size="13" font-weight="bold">動画ごと</text>
  <line x1="480" y1="228" x2="480" y2="296" stroke="#f0f0f0" stroke-width="1"/>
  <text x="500" y="265" fill="#666" font-size="13">冒頭と構成の見直し</text>
  <line x1="45" y1="300" x2="755" y2="300" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Row 3: Traffic Source -->
  <rect x="40" y="300" width="720" height="76" fill="#fff"/>
  <rect x="40" y="300" width="5" height="76" fill="#8134af"/>
  <rect x="62" y="324" width="24" height="24" rx="6" ry="6" fill="#8134af20" stroke="#8134af" stroke-width="1.5"/>
  <text x="74" y="342" text-anchor="middle" fill="#8134af" font-size="14" font-weight="bold">✓</text>
  <text x="100" y="335" fill="#333" font-size="16" font-weight="bold">トラフィックソース</text>
  <text x="100" y="356" fill="#999" font-size="11">流入元の分析</text>
  <line x1="280" y1="304" x2="280" y2="372" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="340" y="324" width="80" height="28" rx="14" fill="#8134af12"/>
  <text x="380" y="343" text-anchor="middle" fill="#8134af" font-size="13" font-weight="bold">月1回</text>
  <line x1="480" y1="304" x2="480" y2="372" stroke="#f0f0f0" stroke-width="1"/>
  <text x="500" y="341" fill="#666" font-size="13">検索・おすすめの割合確認</text>
  <line x1="45" y1="376" x2="755" y2="376" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Row 4: Audience -->
  <rect x="40" y="376" width="720" height="76" fill="#fff"/>
  <rect x="40" y="376" width="5" height="76" rx="0" ry="0" fill="#515bd4"/>
  <!-- Bottom-left corner fix -->
  <rect x="40" y="444" width="5" height="12" rx="0" ry="0" fill="#515bd4"/>
  <rect x="62" y="400" width="24" height="24" rx="6" ry="6" fill="#515bd420" stroke="#515bd4" stroke-width="1.5"/>
  <text x="74" y="418" text-anchor="middle" fill="#515bd4" font-size="14" font-weight="bold">✓</text>
  <text x="100" y="411" fill="#333" font-size="16" font-weight="bold">視聴者の属性</text>
  <text x="100" y="432" fill="#999" font-size="11">年齢・性別・地域</text>
  <line x1="280" y1="380" x2="280" y2="448" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="340" y="400" width="80" height="28" rx="14" fill="#515bd412"/>
  <text x="380" y="419" text-anchor="middle" fill="#515bd4" font-size="13" font-weight="bold">月1回</text>
  <line x1="480" y1="380" x2="480" y2="448" stroke="#f0f0f0" stroke-width="1"/>
  <text x="500" y="417" fill="#666" font-size="13">ターゲットに届いているか</text>

  <!-- Footer note -->
  <text x="400" y="472" text-anchor="middle" fill="#999" font-size="11">※ YouTube Studioのアナリティクスで確認できます</text>
</svg>