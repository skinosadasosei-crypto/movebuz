<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <filter id="shadow3" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="16" ry="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="64" rx="16" ry="16" fill="url(#grad3)"/>
  <rect y="32" width="800" height="32" fill="url(#grad3)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">アルゴリズムのよくある誤解</text>

  <!-- Myth 1 -->
  <rect x="40" y="96" width="720" height="110" rx="12" ry="12" fill="#fff" filter="url(#shadow3)"/>
  <!-- Number -->
  <circle cx="80" cy="151" r="22" fill="url(#grad3)"/>
  <text x="80" y="158" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">1</text>
  <!-- Wrong -->
  <rect x="116" y="112" width="280" height="36" rx="8" ry="8" fill="#fee2e2"/>
  <text x="130" y="135" fill="#dc2626" font-size="18" font-weight="bold">✕</text>
  <text x="152" y="136" fill="#dc2626" font-size="14" font-weight="bold">毎日投稿が有利</text>
  <!-- Arrow -->
  <text x="370" y="152" fill="#bbb" font-size="20">→</text>
  <!-- Correct -->
  <rect x="404" y="112" width="340" height="36" rx="8" ry="8" fill="#dcfce7"/>
  <text x="418" y="135" fill="#16a34a" font-size="18" font-weight="bold">○</text>
  <text x="442" y="136" fill="#16a34a" font-size="14" font-weight="bold">質の高い動画を週1〜2本</text>
  <!-- Explanation -->
  <text x="116" y="182" fill="#888" font-size="12">投稿頻度より動画の質が重要。無理に毎日投稿するより、視聴者に価値ある動画を定期的に届けましょう。</text>

  <!-- Myth 2 -->
  <rect x="40" y="222" width="720" height="110" rx="12" ry="12" fill="#fff" filter="url(#shadow3)"/>
  <circle cx="80" cy="277" r="22" fill="url(#grad3)"/>
  <text x="80" y="284" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">2</text>
  <rect x="116" y="238" width="280" height="36" rx="8" ry="8" fill="#fee2e2"/>
  <text x="130" y="261" fill="#dc2626" font-size="18" font-weight="bold">✕</text>
  <text x="152" y="262" fill="#dc2626" font-size="14" font-weight="bold">タグを大量に設定すれば有利</text>
  <text x="370" y="278" fill="#bbb" font-size="20">→</text>
  <rect x="404" y="238" width="340" height="36" rx="8" ry="8" fill="#dcfce7"/>
  <text x="418" y="261" fill="#16a34a" font-size="18" font-weight="bold">○</text>
  <text x="442" y="262" fill="#16a34a" font-size="14" font-weight="bold">タイトル・説明文が重要</text>
  <text x="116" y="308" fill="#888" font-size="12">タグの影響は限定的。タイトルと説明文に適切なキーワードを含めることが検索対策の基本です。</text>

  <!-- Myth 3 -->
  <rect x="40" y="348" width="720" height="110" rx="12" ry="12" fill="#fff" filter="url(#shadow3)"/>
  <circle cx="80" cy="403" r="22" fill="url(#grad3)"/>
  <text x="80" y="410" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">3</text>
  <rect x="116" y="364" width="280" height="36" rx="8" ry="8" fill="#fee2e2"/>
  <text x="130" y="387" fill="#dc2626" font-size="18" font-weight="bold">✕</text>
  <text x="152" y="388" fill="#dc2626" font-size="14" font-weight="bold">低評価で表示されなくなる</text>
  <text x="370" y="404" fill="#bbb" font-size="20">→</text>
  <rect x="404" y="364" width="340" height="36" rx="8" ry="8" fill="#dcfce7"/>
  <text x="418" y="387" fill="#16a34a" font-size="18" font-weight="bold">○</text>
  <text x="442" y="388" fill="#16a34a" font-size="14" font-weight="bold">反応のシグナルの一つ</text>
  <text x="116" y="434" fill="#888" font-size="12">低評価も「反応があった」というシグナル。表示に大きなマイナスはなく、むしろ無反応が不利です。</text>

  <!-- Myth 4 -->
  <rect x="40" y="474" width="720" height="110" rx="12" ry="12" fill="#fff" filter="url(#shadow3)"/>
  <circle cx="80" cy="529" r="22" fill="url(#grad3)"/>
  <text x="80" y="536" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">4</text>
  <rect x="116" y="490" width="280" height="36" rx="8" ry="8" fill="#fee2e2"/>
  <text x="130" y="513" fill="#dc2626" font-size="18" font-weight="bold">✕</text>
  <text x="152" y="514" fill="#dc2626" font-size="14" font-weight="bold">再生回数がすべて</text>
  <text x="370" y="530" fill="#bbb" font-size="20">→</text>
  <rect x="404" y="490" width="340" height="36" rx="8" ry="8" fill="#dcfce7"/>
  <text x="418" y="513" fill="#16a34a" font-size="18" font-weight="bold">○</text>
  <text x="442" y="514" fill="#16a34a" font-size="14" font-weight="bold">誰に届いたかが重要</text>
  <text x="116" y="560" fill="#888" font-size="12">再生回数より視聴維持率やエンゲージメントが重要。ターゲットに深く届く動画が評価されます。</text>
</svg>