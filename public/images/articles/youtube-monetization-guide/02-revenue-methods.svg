<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <rect width="800" height="480" rx="16" fill="#faf5ff"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="#1e293b">YouTube収益化の7つの方法</text>
  <g transform="translate(50,65)">
    <rect width="330" height="80" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#10b981"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">1</text>
    <text x="80" y="30" font-family="sans-serif" font-weight="700" font-size="14" fill="#334155">広告収益（AdSense）</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">動画再生時に表示される広告から</text>
    <text x="80" y="68" font-family="sans-serif" font-size="11" fill="#64748b">収益を得る最も基本的な方法</text>
  </g>
  <g transform="translate(420,65)">
    <rect width="330" height="80" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#3b82f6"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">2</text>
    <text x="80" y="30" font-family="sans-serif" font-weight="700" font-size="14" fill="#334155">メンバーシップ</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">月額課金で限定コンテンツを</text>
    <text x="80" y="68" font-family="sans-serif" font-size="11" fill="#64748b">提供し安定収益を確保</text>
  </g>
  <g transform="translate(50,165)">
    <rect width="330" height="80" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#8b5cf6"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">3</text>
    <text x="80" y="30" font-family="sans-serif" font-weight="700" font-size="14" fill="#334155">スーパーチャット・スーパーサンクス</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">ライブ配信や動画への</text>
    <text x="80" y="68" font-family="sans-serif" font-size="11" fill="#64748b">投げ銭による収益</text>
  </g>
  <g transform="translate(420,165)">
    <rect width="330" height="80" rx="12" fill="white" stroke="#ec4899" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#ec4899"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">4</text>
    <text x="80" y="30" font-family="sans-serif" font-weight="700" font-size="14" fill="#334155">企業案件・タイアップ</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">企業からの依頼でPR動画を</text>
    <text x="80" y="68" font-family="sans-serif" font-size="11" fill="#64748b">制作し報酬を得る</text>
  </g>
  <g transform="translate(50,265)">
    <rect width="330" height="80" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#f59e0b"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">5</text>
    <text x="80" y="30" font-family="sans-serif" font-weight="700" font-size="14" fill="#334155">自社商品・サービスの販売</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">動画を集客チャネルとして</text>
    <text x="80" y="68" font-family="sans-serif" font-size="11" fill="#64748b">自社の売上につなげる</text>
  </g>
  <g transform="translate(420,265)">
    <rect width="330" height="80" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#ef4444"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">6</text>
    <text x="80" y="30" font-family="sans-serif" font-weight="700" font-size="14" fill="#334155">アフィリエイト</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">商品紹介リンク経由の</text>
    <text x="80" y="68" font-family="sans-serif" font-size="11" fill="#64748b">成果報酬で収益を得る</text>
  </g>
  <g transform="translate(235,365)">
    <rect width="330" height="80" rx="12" fill="white" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#06b6d4"/>
    <text x="40" y="46" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">7</text>
    <text x="80" y="30" font-family="sans-serif" font-weight="700" font-size="14" fill="#334155">YouTubeショッピング</text>
    <text x="80" y="52" font-family="sans-serif" font-size="11" fill="#64748b">動画内やストアで直接</text>
    <text x="80" y="68" font-family="sans-serif" font-size="11" fill="#64748b">商品を販売できる機能</text>
  </g>
</svg>