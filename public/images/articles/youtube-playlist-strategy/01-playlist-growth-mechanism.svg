<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="#fafafa"/>

  <!-- Header -->
  <rect width="800" height="64" rx="16" fill="url(#headerGrad)"/>
  <rect y="32" width="800" height="32" fill="url(#headerGrad)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">再生リストがチャンネル成長に貢献する仕組み</text>

  <!-- Step 1: Playlist -->
  <rect x="260" y="90" width="280" height="70" rx="14" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="260" y="90" width="280" height="5" rx="2.5" fill="#3b82f6"/>
  <text x="310" y="132" text-anchor="middle" font-size="26">📋</text>
  <text x="420" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a5f">再生リストを作成</text>
  <text x="420" y="147" text-anchor="middle" font-size="11" fill="#666">テーマ別に動画を整理・構成</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="160" x2="400" y2="190" stroke="url(#flowGrad)" stroke-width="2.5"/>
  <polygon points="400,195 393,185 407,185" fill="#dc2626"/>

  <!-- Step 2: Auto-play -->
  <rect x="260" y="200" width="280" height="70" rx="14" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="260" y="200" width="280" height="5" rx="2.5" fill="#10b981"/>
  <text x="310" y="242" text-anchor="middle" font-size="26">▶</text>
  <text x="420" y="235" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">自動連続再生</text>
  <text x="420" y="257" text-anchor="middle" font-size="11" fill="#666">次の動画が自動で再生される</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="270" x2="400" y2="300" stroke="url(#flowGrad)" stroke-width="2.5"/>
  <polygon points="400,305 393,295 407,295" fill="#dc2626"/>

  <!-- Step 3: Session time -->
  <rect x="260" y="310" width="280" height="70" rx="14" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="260" y="310" width="280" height="5" rx="2.5" fill="#f59e0b"/>
  <text x="310" y="352" text-anchor="middle" font-size="26">⏱</text>
  <text x="420" y="345" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">セッション時間が増加</text>
  <text x="420" y="367" text-anchor="middle" font-size="11" fill="#666">視聴者の滞在時間が大幅に伸びる</text>

  <!-- Arrow 3 -->
  <line x1="400" y1="380" x2="400" y2="410" stroke="url(#flowGrad)" stroke-width="2.5"/>
  <polygon points="400,415 393,405 407,405" fill="#dc2626"/>

  <!-- Step 4: Algorithm boost -->
  <rect x="260" y="420" width="280" height="70" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="310" y="462" text-anchor="middle" font-size="26">📈</text>
  <text x="420" y="452" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">アルゴリズム評価UP</text>
  <text x="420" y="474" text-anchor="middle" font-size="11" fill="#b91c1c">おすすめ・検索で上位表示される</text>

  <!-- Side benefit cards -->
  <!-- Left: SEO -->
  <rect x="30" y="235" width="190" height="90" rx="12" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="30" y="235" width="190" height="5" rx="2.5" fill="#8b5cf6"/>
  <text x="125" y="270" text-anchor="middle" font-size="20">🔍</text>
  <text x="125" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">検索流入の増加</text>
  <text x="125" y="312" text-anchor="middle" font-size="11" fill="#666">リスト自体が検索に表示</text>

  <!-- Right: Navigation -->
  <rect x="580" y="235" width="190" height="90" rx="12" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="580" y="235" width="190" height="5" rx="2.5" fill="#06b6d4"/>
  <text x="675" y="270" text-anchor="middle" font-size="20">🧭</text>
  <text x="675" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#0e7490">チャンネル回遊性UP</text>
  <text x="675" y="312" text-anchor="middle" font-size="11" fill="#666">テーマ別整理で動画発見</text>

  <!-- Dashed arrows from side cards to center flow -->
  <line x1="220" y1="280" x2="258" y2="260" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="258,260 248,260 253,250" fill="#8b5cf6"/>

  <line x1="580" y1="280" x2="542" y2="260" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="542,260 552,260 547,250" fill="#06b6d4"/>
</svg>