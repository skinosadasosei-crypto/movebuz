<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <filter id="cardShadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" rx="16" fill="#fafafa"/>

  <!-- Header -->
  <rect width="800" height="64" rx="16" fill="url(#headerGrad2)"/>
  <rect y="32" width="800" height="32" fill="url(#headerGrad2)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">再生リストSEO 最適化チェックリスト</text>

  <!-- Left column: Title optimization -->
  <rect x="30" y="85" width="360" height="200" rx="14" fill="#fff" filter="url(#cardShadow2)"/>
  <rect x="30" y="85" width="360" height="5" rx="2.5" fill="#3b82f6"/>
  <text x="210" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a5f">タイトルの最適化</text>

  <circle cx="62" cy="148" r="10" fill="#dbeafe"/>
  <text x="62" y="153" text-anchor="middle" font-size="13" fill="#3b82f6" font-weight="bold">1</text>
  <text x="82" y="153" font-size="13" fill="#333">キーワードをタイトル先頭に配置</text>

  <circle cx="62" cy="178" r="10" fill="#dbeafe"/>
  <text x="62" y="183" text-anchor="middle" font-size="13" fill="#3b82f6" font-weight="bold">2</text>
  <text x="82" y="183" font-size="13" fill="#333">30〜60文字以内に収める</text>

  <circle cx="62" cy="208" r="10" fill="#dbeafe"/>
  <text x="62" y="213" text-anchor="middle" font-size="13" fill="#3b82f6" font-weight="bold">3</text>
  <text x="82" y="213" font-size="13" fill="#333">形式を示す語句を含める</text>

  <circle cx="62" cy="238" r="10" fill="#dbeafe"/>
  <text x="62" y="243" text-anchor="middle" font-size="13" fill="#3b82f6" font-weight="bold">4</text>
  <text x="82" y="243" font-size="13" fill="#333">内容が一目で分かる名前にする</text>

  <text x="210" y="272" text-anchor="middle" font-size="11" fill="#3b82f6" font-style="italic">例：YouTube撮影テクニック｜初心者向け</text>

  <!-- Right column: Description optimization -->
  <rect x="410" y="85" width="360" height="200" rx="14" fill="#fff" filter="url(#cardShadow2)"/>
  <rect x="410" y="85" width="360" height="5" rx="2.5" fill="#10b981"/>
  <text x="590" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">説明文の最適化</text>

  <circle cx="442" cy="148" r="10" fill="#d1fae5"/>
  <text x="442" y="153" text-anchor="middle" font-size="13" fill="#10b981" font-weight="bold">1</text>
  <text x="462" y="153" font-size="13" fill="#333">冒頭2〜3行に概要を書く</text>

  <circle cx="442" cy="178" r="10" fill="#d1fae5"/>
  <text x="442" y="183" text-anchor="middle" font-size="13" fill="#10b981" font-weight="bold">2</text>
  <text x="462" y="183" font-size="13" fill="#333">関連キーワードを自然に含める</text>

  <circle cx="442" cy="208" r="10" fill="#d1fae5"/>
  <text x="442" y="213" text-anchor="middle" font-size="13" fill="#10b981" font-weight="bold">3</text>
  <text x="462" y="213" font-size="13" fill="#333">おすすめ視聴順を記載する</text>

  <circle cx="442" cy="238" r="10" fill="#d1fae5"/>
  <text x="442" y="243" text-anchor="middle" font-size="13" fill="#10b981" font-weight="bold">4</text>
  <text x="462" y="243" font-size="13" fill="#333">チャンネル登録への誘導を追加</text>

  <text x="590" y="272" text-anchor="middle" font-size="11" fill="#10b981" font-style="italic">対象視聴者と動画構成を明記</text>

  <!-- Bottom section: URL strategy -->
  <rect x="30" y="305" width="740" height="100" rx="14" fill="#fff" filter="url(#cardShadow2)"/>
  <rect x="30" y="305" width="740" height="5" rx="2.5" fill="#f59e0b"/>
  <text x="400" y="338" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">再生リストURLの活用戦略</text>

  <text x="70" y="368" font-size="13" fill="#333">SNS共有時にリストURLを使う</text>
  <circle cx="52" cy="363" r="5" fill="#f59e0b"/>

  <text x="310" y="368" font-size="13" fill="#333">動画説明欄にリストURLを掲載</text>
  <circle cx="292" cy="363" r="5" fill="#f59e0b"/>

  <text x="560" y="368" font-size="13" fill="#333">チャンネル概要にURLを記載</text>
  <circle cx="542" cy="363" r="5" fill="#f59e0b"/>

  <text x="70" y="393" font-size="13" fill="#333">特定動画から開始するURLを活用</text>
  <circle cx="52" cy="388" r="5" fill="#f59e0b"/>

  <text x="310" y="393" font-size="13" fill="#333">ブログ記事内でリストURLを紹介</text>
  <circle cx="292" cy="388" r="5" fill="#f59e0b"/>

  <text x="560" y="393" font-size="13" fill="#333">メルマガでリスト単位で案内</text>
  <circle cx="542" cy="388" r="5" fill="#f59e0b"/>

  <!-- Bottom tip box -->
  <rect x="120" y="430" width="560" height="90" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="462" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">公開設定を「公開」にすることを忘れずに</text>
  <text x="400" y="485" text-anchor="middle" font-size="12" fill="#b91c1c">限定公開の再生リストはYouTube検索・Google検索に表示されません</text>
  <text x="400" y="505" text-anchor="middle" font-size="12" fill="#b91c1c">リスト内の動画タイトルやタグにも統一感を持たせましょう</text>
</svg>