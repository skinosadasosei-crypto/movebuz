<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <filter id="shadow7" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" rx="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="60" rx="16" fill="url(#grad7)"/>
  <rect x="0" y="16" width="800" height="44" fill="url(#grad7)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">外注で失敗しない5つのポイント</text>

  <!-- Tip 1 -->
  <rect x="40" y="90" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow7)"/>
  <rect x="40" y="90" width="6" height="80" rx="3" fill="#f58529"/>
  <circle cx="90" cy="130" r="24" fill="#f58529"/>
  <text x="90" y="137" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">1</text>
  <text x="135" y="124" fill="#333" font-size="18" font-weight="bold">最初は1本テスト発注</text>
  <text x="135" y="150" fill="#777" font-size="14">いきなり大量発注せず、まず1本で相性を確認する</text>

  <!-- Tip 2 -->
  <rect x="40" y="186" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow7)"/>
  <rect x="40" y="186" width="6" height="80" rx="3" fill="#dd2a7b"/>
  <circle cx="90" cy="226" r="24" fill="#dd2a7b"/>
  <text x="90" y="233" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">2</text>
  <text x="135" y="220" fill="#333" font-size="18" font-weight="bold">フィードバックは具体的に</text>
  <text x="135" y="246" fill="#777" font-size="14">「なんか違う」ではなく「テロップの色を青に」と具体的に伝える</text>

  <!-- Tip 3 -->
  <rect x="40" y="282" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow7)"/>
  <rect x="40" y="282" width="6" height="80" rx="3" fill="#8134af"/>
  <circle cx="90" cy="322" r="24" fill="#8134af"/>
  <text x="90" y="329" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">3</text>
  <text x="135" y="316" fill="#333" font-size="18" font-weight="bold">素材の整理をしっかり</text>
  <text x="135" y="342" fill="#777" font-size="14">ファイル名のルール化、フォルダ整理で作業効率アップ</text>

  <!-- Tip 4 -->
  <rect x="40" y="378" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow7)"/>
  <rect x="40" y="378" width="6" height="80" rx="3" fill="#515bd4"/>
  <circle cx="90" cy="418" r="24" fill="#515bd4"/>
  <text x="90" y="425" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">4</text>
  <text x="135" y="412" fill="#333" font-size="18" font-weight="bold">修正回数を事前に決める</text>
  <text x="135" y="438" fill="#777" font-size="14">「修正2回まで無料」など、契約前に取り決めておく</text>

  <!-- Tip 5 -->
  <rect x="40" y="474" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow7)"/>
  <rect x="40" y="474" width="6" height="80" rx="3" fill="#c4389d"/>
  <circle cx="90" cy="514" r="24" fill="#c4389d"/>
  <text x="90" y="521" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">5</text>
  <text x="135" y="508" fill="#333" font-size="18" font-weight="bold">長期的なパートナーを見つける</text>
  <text x="135" y="534" fill="#777" font-size="14">継続的な関係を築くことで、品質と効率が向上する</text>

  <!-- Bottom label -->
  <text x="400" y="572" text-anchor="middle" fill="#999" font-size="12">この5つを押さえれば外注の失敗リスクを大幅に減らせます</text>
</svg>