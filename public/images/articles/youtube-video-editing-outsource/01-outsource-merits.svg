<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <filter id="shadow4" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="60" rx="16" fill="url(#grad4)"/>
  <rect x="0" y="16" width="800" height="44" fill="url(#grad4)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">動画編集を外注する3つのメリット</text>

  <!-- Card 1: 時間の節約 -->
  <rect x="40" y="100" width="220" height="340" rx="12" fill="#fff" filter="url(#shadow4)"/>
  <rect x="40" y="100" width="220" height="8" rx="4" fill="#f58529"/>
  <!-- Icon circle -->
  <circle cx="150" cy="170" r="36" fill="#fff5eb"/>
  <text x="150" y="160" text-anchor="middle" fill="#f58529" font-size="14" font-weight="bold">MERIT</text>
  <text x="150" y="183" text-anchor="middle" fill="#f58529" font-size="22" font-weight="bold">01</text>
  <text x="150" y="240" text-anchor="middle" fill="#333" font-size="20" font-weight="bold">時間の節約</text>
  <line x1="100" y1="258" x2="200" y2="258" stroke="#f58529" stroke-width="2" stroke-linecap="round"/>
  <text x="150" y="290" text-anchor="middle" fill="#777" font-size="13">10分の動画編集に</text>
  <text x="150" y="312" text-anchor="middle" fill="#dd2a7b" font-size="18" font-weight="bold">8〜15時間</text>
  <text x="150" y="340" text-anchor="middle" fill="#777" font-size="13">かかる作業を外注して</text>
  <text x="150" y="362" text-anchor="middle" fill="#777" font-size="13">本業に集中できる</text>

  <!-- Card 2: クオリティ安定 -->
  <rect x="290" y="100" width="220" height="340" rx="12" fill="#fff" filter="url(#shadow4)"/>
  <rect x="290" y="100" width="220" height="8" rx="4" fill="#dd2a7b"/>
  <circle cx="400" cy="170" r="36" fill="#fce4f0"/>
  <text x="400" y="160" text-anchor="middle" fill="#dd2a7b" font-size="14" font-weight="bold">MERIT</text>
  <text x="400" y="183" text-anchor="middle" fill="#dd2a7b" font-size="22" font-weight="bold">02</text>
  <text x="400" y="240" text-anchor="middle" fill="#333" font-size="20" font-weight="bold">クオリティ安定</text>
  <line x1="350" y1="258" x2="450" y2="258" stroke="#dd2a7b" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="290" text-anchor="middle" fill="#777" font-size="13">プロの編集テクニックで</text>
  <text x="400" y="312" text-anchor="middle" fill="#777" font-size="13">視聴者を</text>
  <text x="400" y="340" text-anchor="middle" fill="#dd2a7b" font-size="18" font-weight="bold">飽きさせない</text>
  <text x="400" y="368" text-anchor="middle" fill="#777" font-size="13">動画を制作</text>

  <!-- Card 3: 継続投稿が可能 -->
  <rect x="540" y="100" width="220" height="340" rx="12" fill="#fff" filter="url(#shadow4)"/>
  <rect x="540" y="100" width="220" height="8" rx="4" fill="#8134af"/>
  <circle cx="650" cy="170" r="36" fill="#f3ecfa"/>
  <text x="650" y="160" text-anchor="middle" fill="#8134af" font-size="14" font-weight="bold">MERIT</text>
  <text x="650" y="183" text-anchor="middle" fill="#8134af" font-size="22" font-weight="bold">03</text>
  <text x="650" y="240" text-anchor="middle" fill="#333" font-size="20" font-weight="bold">継続投稿が可能</text>
  <line x1="600" y1="258" x2="700" y2="258" stroke="#8134af" stroke-width="2" stroke-linecap="round"/>
  <text x="650" y="290" text-anchor="middle" fill="#777" font-size="13">安定した制作体制で</text>
  <text x="650" y="318" text-anchor="middle" fill="#8134af" font-size="18" font-weight="bold">投稿ペース維持</text>
  <text x="650" y="348" text-anchor="middle" fill="#777" font-size="13">が可能になる</text>

  <!-- Bottom label -->
  <text x="400" y="475" text-anchor="middle" fill="#999" font-size="12">外注で「時間・品質・継続」の3つの課題を一気に解決</text>
</svg>