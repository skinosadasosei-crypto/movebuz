<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <filter id="shadow6" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="60" rx="16" fill="url(#grad6)"/>
  <rect x="0" y="16" width="800" height="44" fill="url(#grad6)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">外注時に伝えるべき6つの情報</text>

  <!-- Item 1 -->
  <rect x="40" y="90" width="345" height="120" rx="12" fill="#fff" filter="url(#shadow6)"/>
  <rect x="40" y="90" width="6" height="120" rx="3" fill="#f58529"/>
  <circle cx="90" cy="130" r="22" fill="#f58529"/>
  <text x="90" y="137" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">1</text>
  <text x="130" y="128" fill="#333" font-size="17" font-weight="bold">動画の尺</text>
  <text x="130" y="155" fill="#777" font-size="13">完成動画の目標時間を</text>
  <text x="130" y="175" fill="#777" font-size="13">明確に伝える（例：10〜15分）</text>

  <!-- Item 2 -->
  <rect x="415" y="90" width="345" height="120" rx="12" fill="#fff" filter="url(#shadow6)"/>
  <rect x="415" y="90" width="6" height="120" rx="3" fill="#dd2a7b"/>
  <circle cx="465" cy="130" r="22" fill="#dd2a7b"/>
  <text x="465" y="137" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">2</text>
  <text x="505" y="128" fill="#333" font-size="17" font-weight="bold">テイスト（参考チャンネル）</text>
  <text x="505" y="155" fill="#777" font-size="13">理想のイメージに近い</text>
  <text x="505" y="175" fill="#777" font-size="13">チャンネルや動画を共有</text>

  <!-- Item 3 -->
  <rect x="40" y="226" width="345" height="120" rx="12" fill="#fff" filter="url(#shadow6)"/>
  <rect x="40" y="226" width="6" height="120" rx="3" fill="#8134af"/>
  <circle cx="90" cy="266" r="22" fill="#8134af"/>
  <text x="90" y="273" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">3</text>
  <text x="130" y="264" fill="#333" font-size="17" font-weight="bold">テロップの有無</text>
  <text x="130" y="291" fill="#777" font-size="13">フルテロップか要所のみか、</text>
  <text x="130" y="311" fill="#777" font-size="13">フォントや色の希望も</text>

  <!-- Item 4 -->
  <rect x="415" y="226" width="345" height="120" rx="12" fill="#fff" filter="url(#shadow6)"/>
  <rect x="415" y="226" width="6" height="120" rx="3" fill="#515bd4"/>
  <circle cx="465" cy="266" r="22" fill="#515bd4"/>
  <text x="465" y="273" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">4</text>
  <text x="505" y="264" fill="#333" font-size="17" font-weight="bold">BGM・SE</text>
  <text x="505" y="291" fill="#777" font-size="13">使用する音源の指定や</text>
  <text x="505" y="311" fill="#777" font-size="13">雰囲気のイメージを共有</text>

  <!-- Item 5 -->
  <rect x="40" y="362" width="345" height="120" rx="12" fill="#fff" filter="url(#shadow6)"/>
  <rect x="40" y="362" width="6" height="120" rx="3" fill="#e8452e"/>
  <circle cx="90" cy="402" r="22" fill="#e8452e"/>
  <text x="90" y="409" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">5</text>
  <text x="130" y="400" fill="#333" font-size="17" font-weight="bold">納品形式</text>
  <text x="130" y="427" fill="#777" font-size="13">ファイル形式（MP4等）、</text>
  <text x="130" y="447" fill="#777" font-size="13">解像度、アスペクト比</text>

  <!-- Item 6 -->
  <rect x="415" y="362" width="345" height="120" rx="12" fill="#fff" filter="url(#shadow6)"/>
  <rect x="415" y="362" width="6" height="120" rx="3" fill="#c4389d"/>
  <circle cx="465" cy="402" r="22" fill="#c4389d"/>
  <text x="465" y="409" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">6</text>
  <text x="505" y="400" fill="#333" font-size="17" font-weight="bold">納期</text>
  <text x="505" y="427" fill="#777" font-size="13">希望納期と投稿スケジュール</text>
  <text x="505" y="447" fill="#777" font-size="13">を事前にすり合わせる</text>

  <!-- Bottom label -->
  <text x="400" y="508" text-anchor="middle" fill="#999" font-size="12">事前に情報を整理することでスムーズな外注が実現</text>
</svg>