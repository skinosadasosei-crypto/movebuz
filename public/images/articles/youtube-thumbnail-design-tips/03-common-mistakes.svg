<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f58529"/>
      <stop offset="33%" stop-color="#dd2a7b"/>
      <stop offset="66%" stop-color="#8134af"/>
      <stop offset="100%" stop-color="#515bd4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="480" rx="16" ry="16" fill="#fafafa"/>
  <rect x="0" y="0" width="800" height="480" rx="16" ry="16" fill="none" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="64" rx="16" ry="16" fill="url(#headerGrad3)"/>
  <rect x="0" y="32" width="800" height="32" fill="url(#headerGrad3)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">サムネイルでよくある失敗4選</text>

  <!-- Mistake 1 -->
  <rect x="40" y="90" width="340" height="155" rx="12" ry="12" fill="#ffffff" stroke="#f0e6f6" stroke-width="1.5"/>
  <rect x="56" y="106" width="36" height="36" rx="18" fill="#ffe8e8"/>
  <text x="74" y="131" text-anchor="middle" fill="#e53935" font-size="20" font-weight="bold">&#x2716;</text>
  <text x="104" y="130" fill="#333333" font-size="17" font-weight="bold">情報を詰め込みすぎ</text>
  <line x1="56" y1="150" x2="364" y2="150" stroke="#f5f5f5" stroke-width="1"/>
  <text x="56" y="175" fill="#666666" font-size="13">文字や要素が多すぎると、何が言いたい</text>
  <text x="56" y="195" fill="#666666" font-size="13">のか伝わりません。引き算のデザインを</text>
  <text x="56" y="215" fill="#666666" font-size="13">心がけましょう。</text>

  <!-- Mistake 2 -->
  <rect x="420" y="90" width="340" height="155" rx="12" ry="12" fill="#ffffff" stroke="#f0e6f6" stroke-width="1.5"/>
  <rect x="436" y="106" width="36" height="36" rx="18" fill="#ffe8e8"/>
  <text x="454" y="131" text-anchor="middle" fill="#e53935" font-size="20" font-weight="bold">&#x2716;</text>
  <text x="484" y="130" fill="#333333" font-size="17" font-weight="bold">デザインがバラバラ</text>
  <line x1="436" y1="150" x2="744" y2="150" stroke="#f5f5f5" stroke-width="1"/>
  <text x="436" y="175" fill="#666666" font-size="13">動画ごとにデザインが統一されていない</text>
  <text x="436" y="195" fill="#666666" font-size="13">と、チャンネルのブランドが定着しま</text>
  <text x="436" y="215" fill="#666666" font-size="13">せん。テンプレートを活用しましょう。</text>

  <!-- Mistake 3 -->
  <rect x="40" y="275" width="340" height="155" rx="12" ry="12" fill="#ffffff" stroke="#f0e6f6" stroke-width="1.5"/>
  <rect x="56" y="291" width="36" height="36" rx="18" fill="#ffe8e8"/>
  <text x="74" y="316" text-anchor="middle" fill="#e53935" font-size="20" font-weight="bold">&#x2716;</text>
  <text x="104" y="315" fill="#333333" font-size="17" font-weight="bold">タイトルと同じ内容</text>
  <line x1="56" y1="335" x2="364" y2="335" stroke="#f5f5f5" stroke-width="1"/>
  <text x="56" y="360" fill="#666666" font-size="13">サムネイルとタイトルが同じでは、情報</text>
  <text x="56" y="380" fill="#666666" font-size="13">が重複してもったいない。補完関係を</text>
  <text x="56" y="400" fill="#666666" font-size="13">意識してそれぞれ役割分担しましょう。</text>

  <!-- Mistake 4 -->
  <rect x="420" y="275" width="340" height="155" rx="12" ry="12" fill="#ffffff" stroke="#f0e6f6" stroke-width="1.5"/>
  <rect x="436" y="291" width="36" height="36" rx="18" fill="#ffe8e8"/>
  <text x="454" y="316" text-anchor="middle" fill="#e53935" font-size="20" font-weight="bold">&#x2716;</text>
  <text x="484" y="315" fill="#333333" font-size="17" font-weight="bold">スマホ表示を未確認</text>
  <line x1="436" y1="335" x2="744" y2="335" stroke="#f5f5f5" stroke-width="1"/>
  <text x="436" y="360" fill="#666666" font-size="13">YouTubeの視聴はスマホが主流。小さい</text>
  <text x="436" y="380" fill="#666666" font-size="13">画面でも文字が読めるか、必ず実機で</text>
  <text x="436" y="400" fill="#666666" font-size="13">プレビュー確認しましょう。</text>

  <!-- Footer accent line -->
  <rect x="40" y="452" width="720" height="4" rx="2" fill="url(#headerGrad3)" opacity="0.3"/>
</svg>