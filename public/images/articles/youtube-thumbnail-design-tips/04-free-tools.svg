<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f58529"/>
      <stop offset="33%" stop-color="#dd2a7b"/>
      <stop offset="66%" stop-color="#8134af"/>
      <stop offset="100%" stop-color="#515bd4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="480" rx="16" ry="16" fill="#fafafa"/>
  <rect x="0" y="0" width="800" height="480" rx="16" ry="16" fill="none" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="64" rx="16" ry="16" fill="url(#headerGrad4)"/>
  <rect x="0" y="32" width="800" height="32" fill="url(#headerGrad4)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">無料で使えるサムネイル作成ツール</text>

  <!-- Tool 1: Canva -->
  <rect x="40" y="90" width="220" height="350" rx="12" ry="12" fill="#ffffff" stroke="#f0e6f6" stroke-width="1.5"/>

  <!-- Canva header icon area -->
  <rect x="40" y="90" width="220" height="80" rx="12" ry="12" fill="#f58529" opacity="0.1"/>
  <rect x="40" y="146" width="220" height="24" fill="#f58529" opacity="0.1"/>
  <circle cx="150" cy="130" r="28" fill="#f58529"/>
  <text x="150" y="138" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">C</text>

  <!-- Canva title -->
  <text x="150" y="198" text-anchor="middle" fill="#333333" font-size="19" font-weight="bold">Canva</text>

  <!-- Canva features -->
  <rect x="55" y="218" width="190" height="30" rx="8" fill="#fff5eb"/>
  <text x="150" y="238" text-anchor="middle" fill="#f58529" font-size="13">テンプレート豊富</text>

  <rect x="55" y="258" width="190" height="30" rx="8" fill="#fff5eb"/>
  <text x="150" y="278" text-anchor="middle" fill="#f58529" font-size="13">直感的な操作</text>

  <rect x="55" y="298" width="190" height="30" rx="8" fill="#fff5eb"/>
  <text x="150" y="318" text-anchor="middle" fill="#f58529" font-size="13">無料プランで十分</text>

  <!-- Canva recommendation -->
  <rect x="55" y="350" width="190" height="36" rx="18" fill="#f58529"/>
  <text x="150" y="373" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">初心者に最もおすすめ</text>

  <!-- Decorative line -->
  <rect x="55" y="400" width="190" height="3" rx="1.5" fill="#f58529" opacity="0.2"/>

  <!-- Tool 2: PowerPoint / Google Slides -->
  <rect x="290" y="90" width="220" height="350" rx="12" ry="12" fill="#ffffff" stroke="#f0e6f6" stroke-width="1.5"/>

  <!-- PPT header icon area -->
  <rect x="290" y="90" width="220" height="80" rx="12" ry="12" fill="#dd2a7b" opacity="0.1"/>
  <rect x="290" y="146" width="220" height="24" fill="#dd2a7b" opacity="0.1"/>
  <circle cx="400" cy="130" r="28" fill="#dd2a7b"/>
  <text x="400" y="138" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">P</text>

  <!-- PPT title -->
  <text x="400" y="192" text-anchor="middle" fill="#333333" font-size="16" font-weight="bold">PowerPoint /</text>
  <text x="400" y="212" text-anchor="middle" fill="#333333" font-size="16" font-weight="bold">Googleスライド</text>

  <!-- PPT features -->
  <rect x="305" y="228" width="190" height="30" rx="8" fill="#fef3f8"/>
  <text x="400" y="248" text-anchor="middle" fill="#dd2a7b" font-size="13">使い慣れたツール</text>

  <rect x="305" y="268" width="190" height="30" rx="8" fill="#fef3f8"/>
  <text x="400" y="288" text-anchor="middle" fill="#dd2a7b" font-size="13">1280x720px設定可能</text>

  <rect x="305" y="308" width="190" height="30" rx="8" fill="#fef3f8"/>
  <text x="400" y="328" text-anchor="middle" fill="#dd2a7b" font-size="13">社内共有がスムーズ</text>

  <!-- PPT recommendation -->
  <rect x="305" y="350" width="190" height="36" rx="18" fill="#dd2a7b"/>
  <text x="400" y="373" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">導入コストゼロ</text>

  <!-- Decorative line -->
  <rect x="305" y="400" width="190" height="3" rx="1.5" fill="#dd2a7b" opacity="0.2"/>

  <!-- Tool 3: Figma -->
  <rect x="540" y="90" width="220" height="350" rx="12" ry="12" fill="#ffffff" stroke="#f0e6f6" stroke-width="1.5"/>

  <!-- Figma header icon area -->
  <rect x="540" y="90" width="220" height="80" rx="12" ry="12" fill="#8134af" opacity="0.1"/>
  <rect x="540" y="146" width="220" height="24" fill="#8134af" opacity="0.1"/>
  <circle cx="650" cy="130" r="28" fill="#8134af"/>
  <text x="650" y="138" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">F</text>

  <!-- Figma title -->
  <text x="650" y="198" text-anchor="middle" fill="#333333" font-size="19" font-weight="bold">Figma</text>

  <!-- Figma features -->
  <rect x="555" y="218" width="190" height="30" rx="8" fill="#f3f0fe"/>
  <text x="650" y="238" text-anchor="middle" fill="#8134af" font-size="13">ブラウザで動作</text>

  <rect x="555" y="258" width="190" height="30" rx="8" fill="#f3f0fe"/>
  <text x="650" y="278" text-anchor="middle" fill="#8134af" font-size="13">テンプレート作成が効率的</text>

  <rect x="555" y="298" width="190" height="30" rx="8" fill="#f3f0fe"/>
  <text x="650" y="318" text-anchor="middle" fill="#8134af" font-size="13">チーム共同編集に対応</text>

  <!-- Figma recommendation -->
  <rect x="555" y="350" width="190" height="36" rx="18" fill="#8134af"/>
  <text x="650" y="373" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">量産体制に最適</text>

  <!-- Decorative line -->
  <rect x="555" y="400" width="190" height="3" rx="1.5" fill="#8134af" opacity="0.2"/>

  <!-- Footer accent line -->
  <rect x="40" y="455" width="720" height="4" rx="2" fill="url(#headerGrad4)" opacity="0.3"/>
</svg>