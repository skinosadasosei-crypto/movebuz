<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" rx="16" fill="#fafafa"/>

  <!-- Header -->
  <rect width="800" height="64" rx="16" fill="url(#headerGrad)"/>
  <rect y="32" width="800" height="32" fill="url(#headerGrad)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">YouTubeエンゲージメントの全体像</text>

  <!-- Center circle: Algorithm -->
  <circle cx="400" cy="300" r="70" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="400" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">YouTube</text>
  <text x="400" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">アルゴリズム</text>

  <!-- Card 1: Comment (top-left) -->
  <rect x="40" y="100" width="200" height="110" rx="12" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="40" y="100" width="200" height="5" rx="2.5" fill="#3b82f6"/>
  <text x="140" y="135" text-anchor="middle" font-size="24">💬</text>
  <text x="140" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a5f">コメント</text>
  <text x="140" y="182" text-anchor="middle" font-size="11" fill="#666">議論・意見・質問</text>
  <text x="140" y="198" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="bold">影響度：★★★★★</text>

  <!-- Arrow from Card 1 to center -->
  <line x1="240" y1="180" x2="340" y2="265" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="340,265 330,255 335,268" fill="#3b82f6"/>

  <!-- Card 2: Like (top-right) -->
  <rect x="560" y="100" width="200" height="110" rx="12" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="560" y="100" width="200" height="5" rx="2.5" fill="#10b981"/>
  <text x="660" y="135" text-anchor="middle" font-size="24">👍</text>
  <text x="660" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">高評価</text>
  <text x="660" y="182" text-anchor="middle" font-size="11" fill="#666">肯定的な評価</text>
  <text x="660" y="198" text-anchor="middle" font-size="11" fill="#10b981" font-weight="bold">影響度：★★★★☆</text>

  <!-- Arrow from Card 2 to center -->
  <line x1="560" y1="180" x2="460" y2="265" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="460,265 470,255 465,268" fill="#10b981"/>

  <!-- Card 3: Share (bottom-left) -->
  <rect x="40" y="380" width="200" height="110" rx="12" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="40" y="380" width="200" height="5" rx="2.5" fill="#f59e0b"/>
  <text x="140" y="415" text-anchor="middle" font-size="24">🔗</text>
  <text x="140" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">共有</text>
  <text x="140" y="462" text-anchor="middle" font-size="11" fill="#666">SNS・メッセージ共有</text>
  <text x="140" y="478" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="bold">影響度：★★★★☆</text>

  <!-- Arrow from Card 3 to center -->
  <line x1="240" y1="420" x2="340" y2="335" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="340,335 330,345 335,332" fill="#f59e0b"/>

  <!-- Card 4: Subscribe (bottom-right) -->
  <rect x="560" y="380" width="200" height="110" rx="12" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="560" y="380" width="200" height="5" rx="2.5" fill="#8b5cf6"/>
  <text x="660" y="415" text-anchor="middle" font-size="24">🔔</text>
  <text x="660" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b21b6">チャンネル登録</text>
  <text x="660" y="462" text-anchor="middle" font-size="11" fill="#666">継続視聴の意思表明</text>
  <text x="660" y="478" text-anchor="middle" font-size="11" fill="#8b5cf6" font-weight="bold">影響度：★★★☆☆</text>

  <!-- Arrow from Card 4 to center -->
  <line x1="560" y1="420" x2="460" y2="335" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="460,335 470,345 465,332" fill="#8b5cf6"/>

  <!-- Bottom result box -->
  <rect x="200" y="520" width="400" height="44" rx="22" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="548" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">エンゲージメント↑ ＝ おすすめ表示↑ ＝ 再生数↑</text>

  <!-- Arrow from center to bottom -->
  <line x1="400" y1="370" x2="400" y2="518" stroke="url(#arrowGrad)" stroke-width="2.5"/>
  <polygon points="400,518 393,505 407,505" fill="#dc2626"/>
</svg>