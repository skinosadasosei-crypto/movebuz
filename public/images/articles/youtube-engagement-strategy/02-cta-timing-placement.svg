<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#ddd6fe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="#fafafa"/>

  <!-- Header -->
  <rect width="800" height="64" rx="16" fill="url(#headerGrad2)"/>
  <rect y="32" width="800" height="32" fill="url(#headerGrad2)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">CTAの最適な配置とタイミング</text>

  <!-- Timeline bar -->
  <rect x="60" y="105" width="680" height="36" rx="18" fill="url(#timelineGrad)"/>
  <text x="70" y="128" font-size="12" font-weight="bold" fill="#5b21b6">0:00</text>
  <text x="230" y="128" font-size="12" font-weight="bold" fill="#5b21b6">序盤</text>
  <text x="390" y="128" font-size="12" font-weight="bold" fill="#5b21b6">中盤</text>
  <text x="560" y="128" font-size="12" font-weight="bold" fill="#5b21b6">終盤</text>
  <text x="700" y="128" font-size="12" font-weight="bold" fill="#5b21b6">END</text>

  <!-- Timeline dots -->
  <circle cx="100" cy="123" r="8" fill="#7c3aed"/>
  <circle cx="260" cy="123" r="8" fill="#7c3aed"/>
  <circle cx="420" cy="123" r="8" fill="#7c3aed"/>
  <circle cx="590" cy="123" r="8" fill="#7c3aed"/>
  <circle cx="710" cy="123" r="8" fill="#7c3aed"/>

  <!-- Section 1: Opening -->
  <rect x="40" y="160" width="220" height="145" rx="12" fill="#fff" filter="url(#shadow2)"/>
  <rect x="40" y="160" width="220" height="5" rx="2.5" fill="#8b5cf6"/>
  <text x="150" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">🎬 冒頭（0〜30秒）</text>
  <line x1="60" y1="200" x2="240" y2="200" stroke="#e5e7eb" stroke-width="1"/>
  <text x="60" y="220" font-size="12" fill="#374151">✅ チャンネル登録の理由提示</text>
  <text x="60" y="240" font-size="12" fill="#374151">✅ 動画の価値を先に伝える</text>
  <text x="60" y="264" font-size="11" fill="#dc2626">❌ 冒頭での高評価お願いは</text>
  <text x="60" y="280" font-size="11" fill="#dc2626">　　効果が低い</text>

  <!-- Section 2: Mid (value delivery) -->
  <rect x="290" y="160" width="220" height="145" rx="12" fill="#fff" filter="url(#shadow2)"/>
  <rect x="290" y="160" width="220" height="5" rx="2.5" fill="#ef4444"/>
  <text x="400" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">⭐ 価値提供の直後</text>
  <line x1="310" y1="200" x2="490" y2="200" stroke="#e5e7eb" stroke-width="1"/>
  <text x="310" y="220" font-size="12" fill="#374151">✅ 高評価CTAのベスト</text>
  <text x="310" y="240" font-size="12" fill="#374151">　　タイミング</text>
  <text x="310" y="260" font-size="12" fill="#374151">✅「役に立ったら高評価で</text>
  <text x="310" y="280" font-size="12" fill="#374151">　　教えてください」</text>
  <rect x="310" y="288" width="180" height="8" rx="4" fill="#fef2f2"/>
  <rect x="310" y="288" width="180" height="8" rx="4" fill="#ef4444" opacity="0.3"/>
  <text x="400" y="296" text-anchor="middle" font-size="7" fill="#dc2626" font-weight="bold">効果MAX</text>

  <!-- Section 3: Ending -->
  <rect x="540" y="160" width="220" height="145" rx="12" fill="#fff" filter="url(#shadow2)"/>
  <rect x="540" y="160" width="220" height="5" rx="2.5" fill="#10b981"/>
  <text x="650" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">🔚 終盤〜エンドスクリーン</text>
  <line x1="560" y1="200" x2="740" y2="200" stroke="#e5e7eb" stroke-width="1"/>
  <text x="560" y="220" font-size="12" fill="#374151">✅ コメントを促す質問</text>
  <text x="560" y="240" font-size="12" fill="#374151">✅ 共有のお願い</text>
  <text x="560" y="260" font-size="12" fill="#374151">✅ エンドスクリーンで</text>
  <text x="560" y="280" font-size="12" fill="#374151">　　登録ボタン表示</text>

  <!-- Bottom summary cards -->
  <text x="400" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">エンゲージメント別CTAの配置まとめ</text>

  <!-- Summary row -->
  <rect x="40" y="360" width="170" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">💬 コメント</text>
  <text x="125" y="410" text-anchor="middle" font-size="11" fill="#3b82f6">動画の最後で質問</text>

  <rect x="225" y="360" width="170" height="70" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="310" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">👍 高評価</text>
  <text x="310" y="410" text-anchor="middle" font-size="11" fill="#ef4444">価値提供の直後</text>

  <rect x="410" y="360" width="170" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="495" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">🔗 共有</text>
  <text x="495" y="410" text-anchor="middle" font-size="11" fill="#f59e0b">概要欄 + 動画の最後</text>

  <rect x="595" y="360" width="170" height="70" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="680" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">🔔 登録</text>
  <text x="680" y="410" text-anchor="middle" font-size="11" fill="#8b5cf6">冒頭 + エンドスクリーン</text>

  <!-- Key takeaway -->
  <rect x="100" y="455" width="600" height="44" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="483" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">ポイント：CTAは「価値を感じた瞬間」に入れることで効果が最大化する</text>
</svg>