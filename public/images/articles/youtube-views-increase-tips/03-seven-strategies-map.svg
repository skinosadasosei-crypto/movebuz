<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" rx="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="64" rx="16" fill="url(#grad3)"/>
  <rect y="32" width="800" height="32" fill="url(#grad3)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">再生数を伸ばす7つの施策マップ</text>

  <!-- Center hub -->
  <circle cx="400" cy="190" r="50" fill="url(#grad3)" opacity="0.15"/>
  <circle cx="400" cy="190" r="42" fill="#fff" stroke="url(#grad3)" stroke-width="2.5"/>
  <text x="400" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#8134af">再生数</text>
  <text x="400" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#8134af">UP</text>

  <!-- Connecting lines from center to top row -->
  <line x1="360" y1="175" x2="185" y2="135" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="400" y1="148" x2="400" y2="135" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="440" y1="175" x2="615" y2="135" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Connecting lines from center to bottom row -->
  <line x1="365" y1="220" x2="140" y2="310" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="385" y1="232" x2="330" y2="310" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="415" y1="232" x2="520" y2="310" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="435" y1="220" x2="700" y2="310" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Row 1: 3 strategy cards -->
  <!-- Strategy 1 -->
  <rect x="50" y="90" width="210" height="80" rx="10" fill="#fff" filter="url(#shadow3)"/>
  <rect x="50" y="90" width="210" height="5" rx="2.5" fill="#f58529"/>
  <circle cx="78" cy="122" r="14" fill="#f58529" opacity="0.15"/>
  <text x="78" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#f58529">1</text>
  <text x="100" y="122" font-size="14" font-weight="bold" fill="#333">サムネイル最適化</text>
  <text x="100" y="146" font-size="11" fill="#888">CTRを高める視覚的な工夫</text>

  <!-- Strategy 2 -->
  <rect x="295" y="90" width="210" height="80" rx="10" fill="#fff" filter="url(#shadow3)"/>
  <rect x="295" y="90" width="210" height="5" rx="2.5" fill="#e04e6a"/>
  <circle cx="323" cy="122" r="14" fill="#e04e6a" opacity="0.15"/>
  <text x="323" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#e04e6a">2</text>
  <text x="345" y="122" font-size="14" font-weight="bold" fill="#333">タイトルにキーワード</text>
  <text x="345" y="146" font-size="11" fill="#888">検索に引っかかる言葉を配置</text>

  <!-- Strategy 3 -->
  <rect x="540" y="90" width="210" height="80" rx="10" fill="#fff" filter="url(#shadow3)"/>
  <rect x="540" y="90" width="210" height="5" rx="2.5" fill="#dd2a7b"/>
  <circle cx="568" cy="122" r="14" fill="#dd2a7b" opacity="0.15"/>
  <text x="568" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#dd2a7b">3</text>
  <text x="590" y="122" font-size="14" font-weight="bold" fill="#333">冒頭15秒にこだわる</text>
  <text x="590" y="146" font-size="11" fill="#888">離脱を防ぐオープニング設計</text>

  <!-- Row 2: 4 strategy cards -->
  <!-- Strategy 4 -->
  <rect x="30" y="280" width="195" height="100" rx="10" fill="#fff" filter="url(#shadow3)"/>
  <rect x="30" y="280" width="195" height="5" rx="2.5" fill="#8134af"/>
  <circle cx="58" cy="316" r="14" fill="#8134af" opacity="0.15"/>
  <text x="58" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#8134af">4</text>
  <text x="80" y="316" font-size="14" font-weight="bold" fill="#333">投稿スケジュール固定</text>
  <text x="50" y="342" font-size="11" fill="#888">曜日・時間を決めて</text>
  <text x="50" y="358" font-size="11" fill="#888">視聴者の習慣をつくる</text>

  <!-- Strategy 5 -->
  <rect x="245" y="280" width="155" height="100" rx="10" fill="#fff" filter="url(#shadow3)"/>
  <rect x="245" y="280" width="155" height="5" rx="2.5" fill="#6a3fbf"/>
  <circle cx="273" cy="316" r="14" fill="#6a3fbf" opacity="0.15"/>
  <text x="273" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a3fbf">5</text>
  <text x="295" y="316" font-size="14" font-weight="bold" fill="#333">概要欄を充実</text>
  <text x="265" y="342" font-size="11" fill="#888">SEOとリンク誘導</text>
  <text x="265" y="358" font-size="11" fill="#888">の要</text>

  <!-- Strategy 6 -->
  <rect x="420" y="280" width="175" height="100" rx="10" fill="#fff" filter="url(#shadow3)"/>
  <rect x="420" y="280" width="175" height="5" rx="2.5" fill="#515bd4"/>
  <circle cx="448" cy="316" r="14" fill="#515bd4" opacity="0.15"/>
  <text x="448" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#515bd4">6</text>
  <text x="470" y="316" font-size="14" font-weight="bold" fill="#333">ショート動画活用</text>
  <text x="440" y="342" font-size="11" fill="#888">新規視聴者との</text>
  <text x="440" y="358" font-size="11" fill="#888">タッチポイント拡大</text>

  <!-- Strategy 7 -->
  <rect x="615" y="280" width="155" height="100" rx="10" fill="#fff" filter="url(#shadow3)"/>
  <rect x="615" y="280" width="155" height="5" rx="2.5" fill="#4a4ec8"/>
  <circle cx="643" cy="316" r="14" fill="#4a4ec8" opacity="0.15"/>
  <text x="643" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a4ec8">7</text>
  <text x="665" y="316" font-size="14" font-weight="bold" fill="#333">データ分析で改善</text>
  <text x="635" y="342" font-size="11" fill="#888">アナリティクスを活用</text>
  <text x="635" y="358" font-size="11" fill="#888">してPDCAを回す</text>

  <!-- Bottom summary bar -->
  <rect x="80" y="430" width="640" height="56" rx="28" fill="url(#grad3)" opacity="0.08"/>
  <rect x="80" y="430" width="640" height="56" rx="28" fill="none" stroke="url(#grad3)" stroke-width="1.5" opacity="0.3"/>
  <text x="400" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#8134af">コンテンツ × テクニック × 分析</text>
  <text x="400" y="475" text-anchor="middle" font-size="12" fill="#8134af" opacity="0.7">3つの軸で再生数を最大化</text>

  <!-- Category labels -->
  <rect x="100" y="510" width="16" height="16" rx="3" fill="#f58529" opacity="0.6"/>
  <text x="122" y="523" font-size="11" fill="#666">コンテンツ改善 (1-3)</text>
  <rect x="310" y="510" width="16" height="16" rx="3" fill="#8134af" opacity="0.6"/>
  <text x="332" y="523" font-size="11" fill="#666">運用テクニック (4-6)</text>
  <rect x="530" y="510" width="16" height="16" rx="3" fill="#515bd4" opacity="0.6"/>
  <text x="552" y="523" font-size="11" fill="#666">データ活用 (7)</text>

  <!-- Footer note -->
  <text x="400" y="560" text-anchor="middle" font-size="11" fill="#999">出典: 動画のミカタ | douga-no-mikata.com</text>
</svg>