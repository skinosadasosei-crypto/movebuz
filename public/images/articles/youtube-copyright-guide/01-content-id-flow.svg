<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="#fafafa"/>
  <rect width="800" height="64" rx="16" fill="url(#grad1)"/>
  <rect y="32" width="800" height="32" fill="url(#grad1)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">Content IDの仕組みと著作権対応フロー</text>

  <!-- Upload step -->
  <rect x="280" y="90" width="240" height="56" rx="10" fill="#ede9fe" filter="url(#shadow1)"/>
  <text x="400" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">動画をアップロード</text>
  <text x="400" y="136" text-anchor="middle" font-size="11" fill="#6d28d9">YouTube Studioから投稿</text>

  <!-- Arrow down -->
  <polygon points="400,152 392,152 400,170 408,152" fill="#a78bfa"/>

  <!-- Scan step -->
  <rect x="240" y="176" width="320" height="56" rx="10" fill="#f3e8ff" filter="url(#shadow1)"/>
  <text x="400" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">Content IDが自動スキャン</text>
  <text x="400" y="222" text-anchor="middle" font-size="11" fill="#6d28d9">権利者のデータベースと照合</text>

  <!-- Branch arrows -->
  <line x1="300" y1="232" x2="150" y2="280" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="232" x2="650" y2="280" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Branch labels -->
  <text x="200" y="258" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="bold">一致あり</text>
  <text x="600" y="258" text-anchor="middle" font-size="12" fill="#22c55e" font-weight="bold">一致なし</text>

  <!-- Match found - 3 outcomes -->
  <rect x="30" y="286" width="340" height="180" rx="12" fill="#fff" filter="url(#shadow1)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="200" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">権利者の設定に応じた措置</text>
  <line x1="50" y1="322" x2="350" y2="322" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Outcome 1 -->
  <rect x="50" y="334" width="300" height="34" rx="6" fill="#fef3c7"/>
  <text x="200" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">収益化の移行 ─ 広告収益が権利者へ</text>

  <!-- Outcome 2 -->
  <rect x="50" y="376" width="300" height="34" rx="6" fill="#dbeafe"/>
  <text x="200" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">トラッキング ─ 視聴データの共有</text>

  <!-- Outcome 3 -->
  <rect x="50" y="418" width="300" height="34" rx="6" fill="#fecaca"/>
  <text x="200" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">ブロック ─ 動画の視聴制限</text>

  <!-- No match - safe -->
  <rect x="460" y="286" width="300" height="80" rx="12" fill="#dcfce7" filter="url(#shadow1)"/>
  <text x="610" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">問題なし</text>
  <text x="610" y="340" text-anchor="middle" font-size="12" fill="#15803d">動画はそのまま公開・収益化可能</text>

  <!-- Important note -->
  <rect x="460" y="386" width="300" height="80" rx="12" fill="#fff" filter="url(#shadow1)" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="610" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">Copyright Strike（警告）は別物</text>
  <text x="610" y="432" text-anchor="middle" font-size="11" fill="#991b1b">3回でチャンネル停止</text>
  <text x="610" y="450" text-anchor="middle" font-size="11" fill="#991b1b">Content IDの申し立てとは異なる</text>

  <text x="400" y="490" text-anchor="middle" font-size="11" fill="#999">出典: MOVeBUZ | movebuz.vercel.app</text>
</svg>
