<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#eff6ff"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">成功企業に共通する4つのパターン</text>
  <g transform="translate(50,70)">
    <rect width="340" height="155" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="30" cy="30" r="22" fill="#3b82f6"/>
    <text x="30" y="36" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">1</text>
    <text x="65" y="28" font-family="sans-serif" font-weight="700" font-size="15" fill="#1e40af">ニッチ領域に特化</text>
    <text x="65" y="50" font-family="sans-serif" font-size="12" fill="#64748b">大手と競合するのではなく、</text>
    <text x="65" y="68" font-family="sans-serif" font-size="12" fill="#64748b">自社だけが語れる専門テーマに絞る</text>
    <line x1="20" y1="85" x2="320" y2="85" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="108" font-family="sans-serif" font-size="12" fill="#3b82f6">例：「精密部品加工の裏側」</text>
    <text x="20" y="128" font-family="sans-serif" font-size="12" fill="#3b82f6">例：「相続税Q&amp;A」</text>
    <text x="20" y="148" font-family="sans-serif" font-size="12" fill="#3b82f6">例：「注文住宅の間取り解説」</text>
  </g>
  <g transform="translate(410,70)">
    <rect width="340" height="155" rx="12" fill="white" stroke="#22c55e" stroke-width="2"/>
    <circle cx="30" cy="30" r="22" fill="#22c55e"/>
    <text x="30" y="36" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">2</text>
    <text x="65" y="28" font-family="sans-serif" font-weight="700" font-size="15" fill="#166534">継続投稿を仕組み化</text>
    <text x="65" y="50" font-family="sans-serif" font-size="12" fill="#64748b">属人的な運用ではなく、</text>
    <text x="65" y="68" font-family="sans-serif" font-size="12" fill="#64748b">チームで回せる制作フローを構築</text>
    <line x1="20" y1="85" x2="320" y2="85" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="108" font-family="sans-serif" font-size="12" fill="#22c55e">・月初に企画を4本確定</text>
    <text x="20" y="128" font-family="sans-serif" font-size="12" fill="#22c55e">・撮影はまとめて月1〜2回</text>
    <text x="20" y="148" font-family="sans-serif" font-size="12" fill="#22c55e">・編集は外注を活用</text>
  </g>
  <g transform="translate(50,250)">
    <rect width="340" height="155" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="30" cy="30" r="22" fill="#f59e0b"/>
    <text x="30" y="36" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">3</text>
    <text x="65" y="28" font-family="sans-serif" font-weight="700" font-size="15" fill="#92400e">ビジネス導線を設計</text>
    <text x="65" y="50" font-family="sans-serif" font-size="12" fill="#64748b">動画→Webサイト→問い合わせの</text>
    <text x="65" y="68" font-family="sans-serif" font-size="12" fill="#64748b">導線を明確に設計している</text>
    <line x1="20" y1="85" x2="320" y2="85" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="108" font-family="sans-serif" font-size="12" fill="#f59e0b">・概要欄にCTAリンクを設置</text>
    <text x="20" y="128" font-family="sans-serif" font-size="12" fill="#f59e0b">・動画内で次のアクションを促す</text>
    <text x="20" y="148" font-family="sans-serif" font-size="12" fill="#f59e0b">・LP（ランディングページ）と連動</text>
  </g>
  <g transform="translate(410,250)">
    <rect width="340" height="155" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="30" cy="30" r="22" fill="#8b5cf6"/>
    <text x="30" y="36" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="white">4</text>
    <text x="65" y="28" font-family="sans-serif" font-weight="700" font-size="15" fill="#5b21b6">データで改善を続ける</text>
    <text x="65" y="50" font-family="sans-serif" font-size="12" fill="#64748b">再生数だけでなく、ビジネス指標</text>
    <text x="65" y="68" font-family="sans-serif" font-size="12" fill="#64748b">と連動した分析を継続している</text>
    <line x1="20" y1="85" x2="320" y2="85" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="108" font-family="sans-serif" font-size="12" fill="#8b5cf6">・問い合わせ元の分析</text>
    <text x="20" y="128" font-family="sans-serif" font-size="12" fill="#8b5cf6">・動画別のCVR（転換率）追跡</text>
    <text x="20" y="148" font-family="sans-serif" font-size="12" fill="#8b5cf6">・月次振り返りレポートの実施</text>
  </g>
</svg>