<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <filter id="shadow2" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" rx="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="60" rx="16" fill="url(#grad2)"/>
  <rect x="0" y="16" width="800" height="44" fill="url(#grad2)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">企画ネタ30選カテゴリマップ</text>

  <!-- Category 1: FAQ系 -->
  <rect x="40" y="90" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow2)"/>
  <rect x="40" y="90" width="8" height="80" rx="4" fill="#f58529"/>
  <circle cx="90" cy="130" r="24" fill="#fff5eb"/>
  <text x="90" y="137" text-anchor="middle" fill="#f58529" font-size="18" font-weight="bold">8</text>
  <text x="130" y="120" fill="#333" font-size="18" font-weight="bold">FAQ系</text>
  <text x="186" y="120" fill="#f58529" font-size="13" font-weight="bold">（8本）</text>
  <text x="130" y="148" fill="#777" font-size="14">お客様の疑問に答える</text>
  <!-- mini bar -->
  <rect x="500" y="118" width="240" height="10" rx="5" fill="#f0f0f0"/>
  <rect x="500" y="118" width="192" height="10" rx="5" fill="#f58529" opacity="0.7"/>
  <text x="700" y="147" text-anchor="end" fill="#aaa" font-size="12">8/30本</text>

  <!-- Category 2: 教育系 -->
  <rect x="40" y="186" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow2)"/>
  <rect x="40" y="186" width="8" height="80" rx="4" fill="#dd2a7b"/>
  <circle cx="90" cy="226" r="24" fill="#fce4f0"/>
  <text x="90" y="233" text-anchor="middle" fill="#dd2a7b" font-size="18" font-weight="bold">8</text>
  <text x="130" y="216" fill="#333" font-size="18" font-weight="bold">教育系</text>
  <text x="198" y="216" fill="#dd2a7b" font-size="13" font-weight="bold">（8本）</text>
  <text x="130" y="244" fill="#777" font-size="14">専門知識を発信</text>
  <rect x="500" y="214" width="240" height="10" rx="5" fill="#f0f0f0"/>
  <rect x="500" y="214" width="192" height="10" rx="5" fill="#dd2a7b" opacity="0.7"/>
  <text x="700" y="243" text-anchor="end" fill="#aaa" font-size="12">8/30本</text>

  <!-- Category 3: 事例・実績系 -->
  <rect x="40" y="282" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow2)"/>
  <rect x="40" y="282" width="8" height="80" rx="4" fill="#8134af"/>
  <circle cx="90" cy="322" r="24" fill="#f3ecfa"/>
  <text x="90" y="329" text-anchor="middle" fill="#8134af" font-size="18" font-weight="bold">5</text>
  <text x="130" y="312" fill="#333" font-size="18" font-weight="bold">事例・実績系</text>
  <text x="266" y="312" fill="#8134af" font-size="13" font-weight="bold">（5本）</text>
  <text x="130" y="340" fill="#777" font-size="14">信頼を構築</text>
  <rect x="500" y="310" width="240" height="10" rx="5" fill="#f0f0f0"/>
  <rect x="500" y="310" width="120" height="10" rx="5" fill="#8134af" opacity="0.7"/>
  <text x="700" y="339" text-anchor="end" fill="#aaa" font-size="12">5/30本</text>

  <!-- Category 4: ブランディング系 -->
  <rect x="40" y="378" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow2)"/>
  <rect x="40" y="378" width="8" height="80" rx="4" fill="#515bd4"/>
  <circle cx="90" cy="418" r="24" fill="#ecedfb"/>
  <text x="90" y="425" text-anchor="middle" fill="#515bd4" font-size="18" font-weight="bold">5</text>
  <text x="130" y="408" fill="#333" font-size="18" font-weight="bold">ブランディング系</text>
  <text x="296" y="408" fill="#515bd4" font-size="13" font-weight="bold">（5本）</text>
  <text x="130" y="436" fill="#777" font-size="14">会社の魅力を伝える</text>
  <rect x="500" y="406" width="240" height="10" rx="5" fill="#f0f0f0"/>
  <rect x="500" y="406" width="120" height="10" rx="5" fill="#515bd4" opacity="0.7"/>
  <text x="700" y="435" text-anchor="end" fill="#aaa" font-size="12">5/30本</text>

  <!-- Category 5: 比較・ランキング系 -->
  <rect x="40" y="474" width="720" height="80" rx="12" fill="#fff" filter="url(#shadow2)"/>
  <rect x="40" y="474" width="8" height="80" rx="4" fill="#e8452e"/>
  <circle cx="90" cy="514" r="24" fill="#fdecea"/>
  <text x="90" y="521" text-anchor="middle" fill="#e8452e" font-size="18" font-weight="bold">4</text>
  <text x="130" y="504" fill="#333" font-size="18" font-weight="bold">比較・ランキング系</text>
  <text x="310" y="504" fill="#e8452e" font-size="13" font-weight="bold">（4本）</text>
  <text x="130" y="532" fill="#777" font-size="14">検索に強い</text>
  <rect x="500" y="502" width="240" height="10" rx="5" fill="#f0f0f0"/>
  <rect x="500" y="502" width="96" height="10" rx="5" fill="#e8452e" opacity="0.7"/>
  <text x="700" y="531" text-anchor="end" fill="#aaa" font-size="12">4/30本</text>
</svg>