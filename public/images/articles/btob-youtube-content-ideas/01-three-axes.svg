<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f58529"/>
      <stop offset="33%" style="stop-color:#dd2a7b"/>
      <stop offset="66%" style="stop-color:#8134af"/>
      <stop offset="100%" style="stop-color:#515bd4"/>
    </linearGradient>
    <filter id="shadow1" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="#fafafa"/>

  <!-- Header bar -->
  <rect width="800" height="60" rx="16" fill="url(#grad1)"/>
  <rect x="0" y="16" width="800" height="44" fill="url(#grad1)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">企画ネタ出しの3つの軸</text>

  <!-- Card 1: FAQ系 -->
  <rect x="40" y="100" width="220" height="340" rx="12" fill="#fff" filter="url(#shadow1)"/>
  <rect x="40" y="100" width="220" height="8" rx="4" fill="#f58529"/>
  <text x="150" y="155" text-anchor="middle" fill="#f58529" font-size="14" font-weight="bold">軸 1</text>
  <text x="150" y="195" text-anchor="middle" fill="#333" font-size="24" font-weight="bold">FAQ系</text>
  <line x1="110" y1="215" x2="190" y2="215" stroke="#f58529" stroke-width="2" stroke-linecap="round"/>
  <!-- Icon: question mark circle -->
  <circle cx="150" cy="270" r="30" fill="#fff5eb" stroke="#f58529" stroke-width="2"/>
  <text x="150" y="280" text-anchor="middle" fill="#f58529" font-size="28" font-weight="bold">?</text>
  <text x="150" y="340" text-anchor="middle" fill="#555" font-size="13">お客様のよくある</text>
  <text x="150" y="362" text-anchor="middle" fill="#555" font-size="13">質問に答える</text>

  <!-- Card 2: 教育系 -->
  <rect x="290" y="100" width="220" height="340" rx="12" fill="#fff" filter="url(#shadow1)"/>
  <rect x="290" y="100" width="220" height="8" rx="4" fill="#dd2a7b"/>
  <text x="400" y="155" text-anchor="middle" fill="#dd2a7b" font-size="14" font-weight="bold">軸 2</text>
  <text x="400" y="195" text-anchor="middle" fill="#333" font-size="24" font-weight="bold">教育系</text>
  <line x1="360" y1="215" x2="440" y2="215" stroke="#dd2a7b" stroke-width="2" stroke-linecap="round"/>
  <!-- Icon: book -->
  <circle cx="400" cy="270" r="30" fill="#fce4f0" stroke="#dd2a7b" stroke-width="2"/>
  <text x="400" y="282" text-anchor="middle" fill="#dd2a7b" font-size="26">&#x1F4D6;</text>
  <text x="400" y="340" text-anchor="middle" fill="#555" font-size="13">業界の基礎知識を</text>
  <text x="400" y="362" text-anchor="middle" fill="#555" font-size="13">発信</text>

  <!-- Card 3: ブランディング系 -->
  <rect x="540" y="100" width="220" height="340" rx="12" fill="#fff" filter="url(#shadow1)"/>
  <rect x="540" y="100" width="220" height="8" rx="4" fill="#8134af"/>
  <text x="650" y="155" text-anchor="middle" fill="#8134af" font-size="14" font-weight="bold">軸 3</text>
  <text x="650" y="195" text-anchor="middle" fill="#333" font-size="22" font-weight="bold">ブランディング系</text>
  <line x1="600" y1="215" x2="700" y2="215" stroke="#8134af" stroke-width="2" stroke-linecap="round"/>
  <!-- Icon: star -->
  <circle cx="650" cy="270" r="30" fill="#f3ecfa" stroke="#8134af" stroke-width="2"/>
  <text x="650" y="282" text-anchor="middle" fill="#8134af" font-size="26">&#x2B50;</text>
  <text x="650" y="340" text-anchor="middle" fill="#555" font-size="13">自社の裏側を</text>
  <text x="650" y="362" text-anchor="middle" fill="#555" font-size="13">見せる</text>

  <!-- Bottom label -->
  <text x="400" y="475" text-anchor="middle" fill="#999" font-size="12">3つの軸を組み合わせてネタを量産しよう</text>
</svg>