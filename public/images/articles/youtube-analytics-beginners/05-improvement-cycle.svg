<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="520" rx="16" fill="#fafafa"/>
  <rect width="800" height="64" rx="16" fill="url(#grad1)"/>
  <rect y="32" width="800" height="32" fill="url(#grad1)"/>
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">データ改善サイクル</text>

  <!-- Center circle -->
  <circle cx="400" cy="280" r="60" fill="#ede9fe" opacity="0.5"/>
  <text x="400" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">PDCA</text>
  <text x="400" y="295" text-anchor="middle" font-size="11" fill="#7c3aed">改善サイクル</text>

  <!-- Step 1: 見る (top) -->
  <rect x="310" y="95" width="180" height="90" rx="14" fill="#fff" filter="url(#shadow1)"/>
  <rect x="310" y="95" width="180" height="6" rx="3" fill="#2563eb"/>
  <circle cx="350" cy="140" r="20" fill="#dbeafe"/>
  <text x="350" y="147" text-anchor="middle" font-size="20">👀</text>
  <text x="390" y="133" font-size="16" font-weight="bold" fill="#333">見る</text>
  <text x="390" y="155" font-size="11" fill="#666">データを確認</text>

  <!-- Step 2: 分析する (right) -->
  <rect x="540" y="225" width="180" height="90" rx="14" fill="#fff" filter="url(#shadow1)"/>
  <rect x="540" y="225" width="180" height="6" rx="3" fill="#7c3aed"/>
  <circle cx="580" cy="270" r="20" fill="#ede9fe"/>
  <text x="580" y="277" text-anchor="middle" font-size="20">🔍</text>
  <text x="620" y="263" font-size="16" font-weight="bold" fill="#333">分析する</text>
  <text x="620" y="285" font-size="11" fill="#666">原因を特定</text>

  <!-- Step 3: 改善する (bottom) -->
  <rect x="310" y="365" width="180" height="90" rx="14" fill="#fff" filter="url(#shadow1)"/>
  <rect x="310" y="365" width="180" height="6" rx="3" fill="#16a34a"/>
  <circle cx="350" cy="410" r="20" fill="#dcfce7"/>
  <text x="350" y="417" text-anchor="middle" font-size="20">🛠</text>
  <text x="390" y="403" font-size="16" font-weight="bold" fill="#333">改善する</text>
  <text x="390" y="425" font-size="11" fill="#666">次の動画に反映</text>

  <!-- Step 4: 検証する (left) -->
  <rect x="80" y="225" width="180" height="90" rx="14" fill="#fff" filter="url(#shadow1)"/>
  <rect x="80" y="225" width="180" height="6" rx="3" fill="#f59e0b"/>
  <circle cx="120" cy="270" r="20" fill="#fef3c7"/>
  <text x="120" y="277" text-anchor="middle" font-size="20">📊</text>
  <text x="160" y="263" font-size="16" font-weight="bold" fill="#333">検証する</text>
  <text x="160" y="285" font-size="11" fill="#666">効果を測定</text>

  <!-- Arrows -->
  <!-- Top to Right -->
  <path d="M490,150 Q530,160 530,220" fill="none" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6"/>
  <polygon points="525,218 530,230 535,218" fill="#5b21b6"/>
  <!-- Right to Bottom -->
  <path d="M540,320 Q530,360 500,370" fill="none" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6"/>
  <polygon points="502,365 490,370 502,375" fill="#5b21b6"/>
  <!-- Bottom to Left -->
  <path d="M310,420 Q270,420 265,320" fill="none" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6"/>
  <polygon points="260,322 265,310 270,322" fill="#5b21b6"/>
  <!-- Left to Top -->
  <path d="M260,230 Q265,160 305,145" fill="none" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6"/>
  <polygon points="303,140 315,140 308,150" fill="#5b21b6"/>

  <text x="400" y="505" text-anchor="middle" font-size="11" fill="#999">出典: MOVeBUZ | movebuz.vercel.app</text>
