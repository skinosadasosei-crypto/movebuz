<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="520" rx="16" fill="#fafafa"/>
  <rect width="800" height="64" rx="16" fill="url(#grad1)"/>
  <rect y="32" width="800" height="32" fill="url(#grad1)"/>
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">インプレッション数の仕組み</text>

  <!-- Flow diagram -->
  <!-- Step 1: Algorithm -->
  <rect x="60" y="120" width="180" height="140" rx="12" fill="#fff" filter="url(#shadow1)"/>
  <rect x="60" y="120" width="180" height="6" rx="3" fill="#f59e0b"/>
  <circle cx="150" cy="175" r="28" fill="#fef3c7"/>
  <text x="150" y="183" text-anchor="middle" font-size="28">🤖</text>
  <text x="150" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">アルゴリズムが</text>
  <text x="150" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">動画を選定</text>

  <!-- Arrow 1 -->
  <polygon points="250,190 280,180 280,200" fill="#f59e0b"/>
  <line x1="250" y1="190" x2="280" y2="190" stroke="#f59e0b" stroke-width="0"/>

  <!-- Step 2: Impression -->
  <rect x="290" y="120" width="200" height="140" rx="12" fill="#fff" filter="url(#shadow1)"/>
  <rect x="290" y="120" width="200" height="6" rx="3" fill="#ef4444"/>
  <circle cx="390" cy="175" r="28" fill="#fee2e2"/>
  <text x="390" y="183" text-anchor="middle" font-size="28">👁</text>
  <text x="390" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">サムネイルが表示</text>
  <text x="390" y="242" text-anchor="middle" font-size="13" fill="#ef4444" font-weight="bold">= インプレッション</text>

  <!-- Arrow 2 -->
  <polygon points="500,190 530,180 530,200" fill="#ef4444"/>

  <!-- Step 3: Click -->
  <rect x="540" y="120" width="200" height="140" rx="12" fill="#fff" filter="url(#shadow1)"/>
  <rect x="540" y="120" width="200" height="6" rx="3" fill="#8b5cf6"/>
  <circle cx="640" cy="175" r="28" fill="#ede9fe"/>
  <text x="640" y="183" text-anchor="middle" font-size="28">👆</text>
  <text x="640" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">クリックして視聴</text>
  <text x="640" y="242" text-anchor="middle" font-size="13" fill="#8b5cf6" font-weight="bold">= 再生回数</text>

  <!-- Bottom info cards -->
  <rect x="60" y="310" width="320" height="150" rx="12" fill="#fff" filter="url(#shadow1)"/>
  <text x="80" y="345" font-size="15" font-weight="bold" fill="#333">インプレッションが多い = </text>
  <text x="80" y="375" font-size="13" fill="#666">アルゴリズムが「この動画は視聴者に</text>
  <text x="80" y="395" font-size="13" fill="#666">合っている」と判断している証拠</text>
  <rect x="80" y="415" width="280" height="28" rx="6" fill="#fef3c7"/>
  <text x="95" y="434" font-size="12" fill="#b45309" font-weight="bold">💡 テーマ選定とSEOが鍵</text>

  <rect x="420" y="310" width="320" height="150" rx="12" fill="#fff" filter="url(#shadow1)"/>
  <text x="440" y="345" font-size="15" font-weight="bold" fill="#333">チェックポイント</text>
  <text x="440" y="375" font-size="13" fill="#666">✓ 時間の経過で増えているか</text>
  <text x="440" y="400" font-size="13" fill="#666">✓ 動画ごとの差はないか</text>
  <text x="440" y="425" font-size="13" fill="#666">✓ 過去の動画と比較してどうか</text>

  <text x="400" y="500" text-anchor="middle" font-size="11" fill="#999">出典: MOVeBUZ | movebuz.vercel.app</text>
</svg>