<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="520" rx="16" fill="#fafafa"/>
  <rect width="800" height="64" rx="16" fill="url(#grad1)"/>
  <rect y="32" width="800" height="32" fill="url(#grad1)"/>
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">視聴維持率グラフの読み方</text>

  <!-- Graph area -->
  <rect x="60" y="90" width="680" height="300" rx="12" fill="#fff" filter="url(#shadow1)"/>
  <!-- Y axis -->
  <text x="80" y="125" font-size="11" fill="#94a3b8">100%</text>
  <text x="85" y="195" font-size="11" fill="#94a3b8">75%</text>
  <text x="85" y="265" font-size="11" fill="#94a3b8">50%</text>
  <text x="85" y="335" font-size="11" fill="#94a3b8">25%</text>
  <!-- X axis -->
  <text x="140" y="370" font-size="11" fill="#94a3b8">0:00</text>
  <text x="340" y="370" font-size="11" fill="#94a3b8">5:00</text>
  <text x="540" y="370" font-size="11" fill="#94a3b8">10:00</text>
  <text x="700" y="370" font-size="11" fill="#94a3b8">15:00</text>
  <!-- Grid lines -->
  <line x1="120" y1="120" x2="720" y2="120" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="120" y1="190" x2="720" y2="190" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="120" y1="260" x2="720" y2="260" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="120" y1="330" x2="720" y2="330" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="120" y1="350" x2="720" y2="350" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Retention curve -->
  <polyline points="120,120 160,180 200,210 260,220 320,230 380,240 440,250 500,260 560,275 620,285 680,300 720,310" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="120,120 160,180 200,210 260,220 320,230 380,240 440,250 500,260 560,275 620,285 680,300 720,310 720,350 120,350" fill="#8b5cf6" opacity="0.08"/>

  <!-- Annotation: steep drop -->
  <line x1="160" y1="130" x2="160" y2="175" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4"/>
  <circle cx="160" cy="180" r="5" fill="#ef4444"/>
  <rect x="155" y="96" width="110" height="24" rx="6" fill="#ef4444"/>
  <text x="210" y="113" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">冒頭の急降下</text>

  <!-- Annotation: bump -->
  <rect x="410" y="215" width="90" height="24" rx="6" fill="#16a34a"/>
  <text x="455" y="232" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">繰り返し視聴</text>
  <circle cx="440" cy="250" r="5" fill="#16a34a"/>
  <line x1="440" y1="240" x2="440" y2="248" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Bottom labels -->
  <rect x="60" y="410" width="220" height="80" rx="10" fill="#fee2e2"/>
  <text x="80" y="438" font-size="13" font-weight="bold" fill="#dc2626">⚠ 冒頭で離脱</text>
  <text x="80" y="460" font-size="11" fill="#991b1b">→ 冒頭15秒の構成を改善</text>
  <text x="80" y="478" font-size="11" fill="#991b1b">→ 結論やメリットを先に伝える</text>

  <rect x="300" y="410" width="220" height="80" rx="10" fill="#fef3c7"/>
  <text x="320" y="438" font-size="13" font-weight="bold" fill="#d97706">⏱ 中盤で下降</text>
  <text x="320" y="460" font-size="11" fill="#92400e">→ テンポアップ・画面切替</text>
  <text x="320" y="478" font-size="11" fill="#92400e">→ 構成の見直し</text>

  <rect x="540" y="410" width="200" height="80" rx="10" fill="#dcfce7"/>
  <text x="560" y="438" font-size="13" font-weight="bold" fill="#16a34a">📈 特定箇所で上昇</text>
  <text x="560" y="460" font-size="11" fill="#166534">→ そのテーマが</text>
  <text x="560" y="478" font-size="11" fill="#166534">→ 求められている</text>

  <text x="400" y="510" text-anchor="middle" font-size="11" fill="#999">出典: MOVeBUZ | movebuz.vercel.app</text>
</svg>