  <text x="270" y="206" font-size="11" fill="#666">28%</text>

  <text x="60" y="230" font-size="11" fill="#64748b">45-54</text>
  <rect x="120" y="217" width="50" height="18" rx="4" fill="#16a34a" opacity="0.25"/>
  <text x="180" y="231" font-size="11" fill="#666">14%</text>

  <text x="60" y="255" font-size="11" fill="#64748b">55+</text>
  <rect x="120" y="242" width="30" height="18" rx="4" fill="#16a34a" opacity="0.15"/>
