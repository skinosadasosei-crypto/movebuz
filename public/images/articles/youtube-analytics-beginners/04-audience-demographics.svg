  <text x="60" y="180" font-size="11" fill="#64748b">25-34</text>
  <rect x="120" y="167" width="180" height="18" rx="4" fill="#16a34a" opacity="0.7"/>
  <text x="310" y="181" font-size="11" fill="#666" font-weight="bold">38%</text>

  <text x="60" y="205" font-size="11" fill="#64748b">35-44</text>
