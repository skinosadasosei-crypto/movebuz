<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="520" rx="16" fill="#fafafa"/>
  <rect width="800" height="64" rx="16" fill="url(#grad1)"/>
  <rect y="32" width="800" height="32" fill="url(#grad1)"/>
  <text x="400" y="40" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">視聴者属性データの例</text>

  <!-- Age distribution -->
  <rect x="40" y="90" width="350" height="190" rx="12" fill="#fff" filter="url(#shadow1)"/>
  <text x="60" y="120" font-size="15" font-weight="bold" fill="#333">👤 年齢層</text>
  <!-- Bars -->
