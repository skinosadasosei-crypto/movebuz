  <text x="530" y="425" font-size="11" fill="#666">4%</text>
  <text x="430" y="455" font-size="13" fill="#666">その他</text>
  <rect x="500" y="442" width="15" height="16" rx="4" fill="#16a34a" opacity="0.1"/>
  <text x="525" y="455" font-size="11" fill="#666">6%</text>

  <text x="400" y="505" text-anchor="middle" font-size="11" fill="#999">出典: MOVeBUZ | movebuz.vercel.app</text>
