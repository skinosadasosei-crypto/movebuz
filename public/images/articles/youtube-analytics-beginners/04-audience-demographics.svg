  <text x="196" y="405" font-size="9" fill="#94a3b8">15時</text>
  <text x="236" y="405" font-size="9" fill="#94a3b8">18時</text>
  <text x="276" y="405" font-size="9" fill="#94a3b8">20時</text>
  <text x="316" y="405" font-size="9" fill="#94a3b8">22時</text>
  <rect x="80" y="430" width="270" height="24" rx="6" fill="#dcfce7"/>
