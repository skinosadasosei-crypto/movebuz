<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="#fafafa"/>

  <!-- Header -->
  <rect width="800" height="64" rx="16" fill="url(#headerGrad)"/>
  <rect y="32" width="800" height="32" fill="url(#headerGrad)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">サムネイルABテストの仕組み</text>

  <!-- Step 1: Video -->
  <rect x="40" y="100" width="200" height="140" rx="12" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="40" y="100" width="200" height="5" rx="2.5" fill="#6366f1"/>
  <rect x="70" y="128" width="140" height="50" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="140" y="148" text-anchor="middle" font-size="20">▶</text>
  <text x="140" y="168" text-anchor="middle" font-size="10" fill="#6366f1">動画</text>
  <text x="140" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">1つの動画に対して</text>
  <text x="140" y="228" text-anchor="middle" font-size="12" fill="#666">サムネイルを複数用意</text>

  <!-- Arrow 1 -->
  <line x1="240" y1="170" x2="290" y2="170" stroke="#6366f1" stroke-width="2"/>
  <polygon points="290,170 282,164 282,176" fill="#6366f1"/>

  <!-- Step 2: Thumbnails A/B -->
  <rect x="300" y="100" width="200" height="140" rx="12" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="300" y="100" width="200" height="5" rx="2.5" fill="#f59e0b"/>
  <g>
    <rect x="320" y="122" width="70" height="45" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="355" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">A</text>
    <rect x="410" y="122" width="70" height="45" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
    <text x="445" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">B</text>
  </g>
  <text x="400" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">ランダムに表示</text>
  <text x="400" y="215" text-anchor="middle" font-size="11" fill="#666">視聴者ごとにA or Bを配信</text>
  <text x="400" y="230" text-anchor="middle" font-size="11" fill="#666">（最大3パターンまで）</text>

  <!-- Arrow 2 -->
  <line x1="500" y1="170" x2="550" y2="170" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="550,170 542,164 542,176" fill="#f59e0b"/>

  <!-- Step 3: Results -->
  <rect x="560" y="100" width="200" height="140" rx="12" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="560" y="100" width="200" height="5" rx="2.5" fill="#10b981"/>
  <text x="660" y="135" text-anchor="middle" font-size="20">📊</text>
  <text x="660" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">データで比較</text>
  <text x="660" y="185" text-anchor="middle" font-size="11" fill="#666">クリック率（CTR）</text>
  <text x="660" y="202" text-anchor="middle" font-size="11" fill="#666">視聴時間シェア</text>
  <text x="660" y="219" text-anchor="middle" font-size="11" fill="#666">統計的有意性</text>

  <!-- Bottom section: Impact -->
  <rect x="80" y="290" width="640" height="200" rx="16" fill="#f0f9ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="400" y="325" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">ABテストで得られる効果</text>

  <!-- Effect cards -->
  <rect x="110" y="350" width="170" height="110" rx="10" fill="#fff" filter="url(#cardShadow)"/>
  <text x="195" y="380" text-anchor="middle" font-size="24">🎯</text>
  <text x="195" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">CTR向上</text>
  <text x="195" y="425" text-anchor="middle" font-size="10" fill="#666">データに基づく</text>
  <text x="195" y="440" text-anchor="middle" font-size="10" fill="#666">サムネイル最適化</text>

  <rect x="315" y="350" width="170" height="110" rx="10" fill="#fff" filter="url(#cardShadow)"/>
  <text x="400" y="380" text-anchor="middle" font-size="24">📈</text>
  <text x="400" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">再生数増加</text>
  <text x="400" y="425" text-anchor="middle" font-size="10" fill="#666">おすすめ表示の</text>
  <text x="400" y="440" text-anchor="middle" font-size="10" fill="#666">優先度アップ</text>

  <rect x="520" y="350" width="170" height="110" rx="10" fill="#fff" filter="url(#cardShadow)"/>
  <text x="605" y="380" text-anchor="middle" font-size="24">🧠</text>
  <text x="605" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">知見の蓄積</text>
  <text x="605" y="425" text-anchor="middle" font-size="10" fill="#666">チャンネル固有の</text>
  <text x="605" y="440" text-anchor="middle" font-size="10" fill="#666">勝ちパターンを発見</text>
</svg>