<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" rx="16" fill="#fafafa"/>

  <!-- Header -->
  <rect width="800" height="64" rx="16" fill="url(#headerGrad2)"/>
  <rect y="32" width="800" height="32" fill="url(#headerGrad2)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">テスト結果の読み方と判断フロー</text>

  <!-- Step 1: Check result -->
  <rect x="250" y="90" width="300" height="70" rx="12" fill="#fff" filter="url(#shadow2)" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">テスト結果を確認</text>
  <text x="400" y="140" text-anchor="middle" font-size="12" fill="#666">YouTube Studioで視聴時間シェアを確認</text>

  <!-- Arrow down -->
  <line x1="400" y1="160" x2="400" y2="190" stroke="#64748b" stroke-width="2"/>
  <polygon points="400,190 394,182 406,182" fill="#64748b"/>

  <!-- Decision diamond -->
  <polygon points="400,200 530,260 400,320 270,260" fill="#fff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow2)"/>
  <text x="400" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">統計的に有意な</text>
  <text x="400" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">差が出た？</text>

  <!-- Yes branch (left) -->
  <line x1="270" y1="260" x2="170" y2="260" stroke="#10b981" stroke-width="2"/>
  <polygon points="170,260 178,254 178,266" fill="#10b981"/>
  <text x="220" y="250" font-size="13" font-weight="bold" fill="#10b981">Yes</text>

  <rect x="30" y="230" width="140" height="60" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>
  <text x="100" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">勝者サムネイルを</text>
  <text x="100" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">採用する</text>

  <!-- No branch (right) -->
  <line x1="530" y1="260" x2="630" y2="260" stroke="#ef4444" stroke-width="2"/>
  <polygon points="630,260 622,254 622,266" fill="#ef4444"/>
  <text x="580" y="250" font-size="13" font-weight="bold" fill="#ef4444">No</text>

  <rect x="630" y="230" width="140" height="60" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="700" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">テスト継続 or</text>
  <text x="700" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">別の動画で再テスト</text>

  <!-- PDCA section -->
  <rect x="80" y="350" width="640" height="185" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="400" y="382" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">結果を活かすPDCAサイクル</text>

  <!-- P -->
  <rect x="110" y="400" width="120" height="110" rx="10" fill="#fff" filter="url(#shadow2)"/>
  <rect x="110" y="400" width="120" height="5" rx="2.5" fill="#3b82f6"/>
  <text x="170" y="435" text-anchor="middle" font-size="22" font-weight="bold" fill="#3b82f6">P</text>
  <text x="170" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a5f">仮説を立てる</text>
  <text x="170" y="475" text-anchor="middle" font-size="9" fill="#666">過去の結果から</text>
  <text x="170" y="488" text-anchor="middle" font-size="9" fill="#666">次のテスト要素を決定</text>

  <!-- Arrow P→D -->
  <line x1="230" y1="455" x2="260" y2="455" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="260,455 254,450 254,460" fill="#64748b"/>

  <!-- D -->
  <rect x="260" y="400" width="120" height="110" rx="10" fill="#fff" filter="url(#shadow2)"/>
  <rect x="260" y="400" width="120" height="5" rx="2.5" fill="#f59e0b"/>
  <text x="320" y="435" text-anchor="middle" font-size="22" font-weight="bold" fill="#f59e0b">D</text>
  <text x="320" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a5f">テスト実行</text>
  <text x="320" y="475" text-anchor="middle" font-size="9" fill="#666">サムネイル制作 &amp;</text>
  <text x="320" y="488" text-anchor="middle" font-size="9" fill="#666">ABテスト開始</text>

  <!-- Arrow D→C -->
  <line x1="380" y1="455" x2="410" y2="455" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="410,455 404,450 404,460" fill="#64748b"/>

  <!-- C -->
  <rect x="410" y="400" width="120" height="110" rx="10" fill="#fff" filter="url(#shadow2)"/>
  <rect x="410" y="400" width="120" height="5" rx="2.5" fill="#10b981"/>
  <text x="470" y="435" text-anchor="middle" font-size="22" font-weight="bold" fill="#10b981">C</text>
  <text x="470" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a5f">結果を検証</text>
  <text x="470" y="475" text-anchor="middle" font-size="9" fill="#666">視聴時間シェア &amp;</text>
  <text x="470" y="488" text-anchor="middle" font-size="9" fill="#666">有意性を確認</text>

  <!-- Arrow C→A -->
  <line x1="530" y1="455" x2="560" y2="455" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="560,455 554,450 554,460" fill="#64748b"/>

  <!-- A -->
  <rect x="560" y="400" width="120" height="110" rx="10" fill="#fff" filter="url(#shadow2)"/>
  <rect x="560" y="400" width="120" height="5" rx="2.5" fill="#8b5cf6"/>
  <text x="620" y="435" text-anchor="middle" font-size="22" font-weight="bold" fill="#8b5cf6">A</text>
  <text x="620" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a5f">ルールに反映</text>
  <text x="620" y="475" text-anchor="middle" font-size="9" fill="#666">勝ちパターンを</text>
  <text x="620" y="488" text-anchor="middle" font-size="9" fill="#666">標準ルール化する</text>

  <!-- Cycle arrow back from A to P -->
  <path d="M 620 510 L 620 530 Q 620 540 610 540 L 180 540 Q 170 540 170 530 L 170 510" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <polygon points="170,510 164,518 176,518" fill="#64748b"/>
</svg>