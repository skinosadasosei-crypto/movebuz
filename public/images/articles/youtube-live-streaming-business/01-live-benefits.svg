<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="16" fill="#fef2f2"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#1e293b">ライブ配信が企業にもたらすメリット</text>
  <g transform="translate(50,75)">
    <rect width="220" height="160" rx="12" fill="white" stroke="#ef4444" stroke-width="2"/>
    <circle cx="110" cy="45" r="28" fill="#ef4444"/>
    <text x="110" y="52" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="24" fill="white">1</text>
    <text x="110" y="95" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#991b1b">双方向コミュニケーション</text>
    <text x="110" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">チャットで視聴者と</text>
    <text x="110" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">リアルタイムに交流</text>
  </g>
  <g transform="translate(290,75)">
    <rect width="220" height="160" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="110" cy="45" r="28" fill="#f59e0b"/>
    <text x="110" y="52" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="24" fill="white">2</text>
    <text x="110" y="95" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#92400e">制作コストが低い</text>
    <text x="110" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">編集不要で即座に</text>
    <text x="110" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">コンテンツ化できる</text>
  </g>
  <g transform="translate(530,75)">
    <rect width="220" height="160" rx="12" fill="white" stroke="#22c55e" stroke-width="2"/>
    <circle cx="110" cy="45" r="28" fill="#22c55e"/>
    <text x="110" y="52" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="24" fill="white">3</text>
    <text x="110" y="95" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#166534">信頼感の醸成</text>
    <text x="110" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">ありのままを見せて</text>
    <text x="110" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">透明性を示せる</text>
  </g>
  <g transform="translate(170,265)">
    <rect width="220" height="160" rx="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="110" cy="45" r="28" fill="#3b82f6"/>
    <text x="110" y="52" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="24" fill="white">4</text>
    <text x="110" y="95" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#1e40af">アルゴリズム優遇</text>
    <text x="110" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">YouTubeがライブを</text>
    <text x="110" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">優先的に通知・表示</text>
  </g>
  <g transform="translate(410,265)">
    <rect width="220" height="160" rx="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="110" cy="45" r="28" fill="#8b5cf6"/>
    <text x="110" y="52" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="24" fill="white">5</text>
    <text x="110" y="95" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#5b21b6">アーカイブ資産化</text>
    <text x="110" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">配信後も動画として</text>
    <text x="110" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">チャンネルに残る</text>
  </g>
</svg>