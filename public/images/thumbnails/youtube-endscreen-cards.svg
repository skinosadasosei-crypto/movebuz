<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="white" opacity="0.07"/>

  <!-- Accent bar left -->
  <rect x="60" y="60" width="6" height="70" rx="3" fill="url(#accentLine)" opacity="0.6"/>

  <!-- Top line -->
  <text x="600" y="155" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="50" fill="#c4b5fd">YouTube</text>

  <!-- Main title line 1 -->
  <text x="600" y="260" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="82" fill="white">終了画面とカード</text>

  <!-- Sub title -->
  <text x="600" y="355" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="64" fill="#a78bfa">の使い方</text>

  <!-- Subtitle pill -->
  <rect x="280" y="395" width="640" height="55" rx="28" fill="white" opacity="0.12"/>
  <text x="600" y="432" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="28" fill="white">回遊率を上げる設定テクニック</text>

  <!-- Decorative elements - End screen icon -->
  <rect x="120" y="480" width="70" height="45" rx="6" fill="white" opacity="0.12"/>
  <rect x="130" y="488" width="22" height="14" rx="3" fill="#a78bfa" opacity="0.4"/>
  <rect x="158" y="488" width="22" height="14" rx="3" fill="#a78bfa" opacity="0.4"/>
  <rect x="130" y="506" width="50" height="12" rx="3" fill="#c4b5fd" opacity="0.3"/>

  <!-- Decorative elements - Card icon -->
  <rect x="1010" y="480" width="70" height="45" rx="6" fill="white" opacity="0.12"/>
  <rect x="1050" y="484" width="24" height="16" rx="4" fill="#a78bfa" opacity="0.5"/>
  <text x="1062" y="496" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white" opacity="0.7">i</text>

  <!-- Decorative circles -->
  <circle cx="160" cy="540" r="18" fill="#a78bfa" opacity="0.15"/>
  <circle cx="1050" cy="545" r="20" fill="#a78bfa" opacity="0.15"/>
  <circle cx="240" cy="555" r="10" fill="#c4b5fd" opacity="0.1"/>
  <circle cx="970" cy="555" r="12" fill="#c4b5fd" opacity="0.1"/>
</svg>
