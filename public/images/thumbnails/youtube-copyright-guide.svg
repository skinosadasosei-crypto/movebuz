<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g opacity="0.06" stroke="#818cf8">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Shield icon (copyright protection) -->
  <g transform="translate(600, 220)">
    <!-- Large shield -->
    <path d="M0,-120 L80,-90 L80,20 C80,70 40,110 0,130 C-40,110 -80,70 -80,20 L-80,-90 Z"
      fill="url(#shieldGrad)" opacity="0.2" stroke="#22c55e" stroke-width="2"/>
    <path d="M0,-90 L55,-68 L55,12 C55,50 28,78 0,92 C-28,78 -55,50 -55,12 L-55,-68 Z"
      fill="url(#shieldGrad)" opacity="0.15"/>
    <!-- Check mark inside shield -->
    <polyline points="-25,-5 -8,18 30,-25" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Musical note icons (left) -->
  <g transform="translate(180, 160)" opacity="0.6">
    <circle cx="0" cy="0" r="45" fill="#818cf8" opacity="0.12"/>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui" font-size="36" fill="#a5b4fc">&#9835;</text>
  </g>
  <g transform="translate(120, 290)" opacity="0.4">
    <circle cx="0" cy="0" r="30" fill="#818cf8" opacity="0.1"/>
    <text x="0" y="8" text-anchor="middle" font-family="system-ui" font-size="26" fill="#a5b4fc">&#9834;</text>
  </g>
  <g transform="translate(230, 340)" opacity="0.5">
    <circle cx="0" cy="0" r="25" fill="#818cf8" opacity="0.1"/>
    <text x="0" y="7" text-anchor="middle" font-family="system-ui" font-size="22" fill="#a5b4fc">&#9833;</text>
  </g>

  <!-- Warning / document icons (right) -->
  <g transform="translate(1000, 170)" opacity="0.5">
    <circle cx="0" cy="0" r="40" fill="#f59e0b" opacity="0.1"/>
    <!-- Document icon -->
    <rect x="-16" y="-22" width="32" height="40" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="-8" y1="-10" x2="8" y2="-10" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-8" y1="6" x2="4" y2="6" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <g transform="translate(1060, 300)" opacity="0.4">
    <circle cx="0" cy="0" r="30" fill="#f43f5e" opacity="0.1"/>
    <!-- X mark -->
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(960, 340)" opacity="0.35">
    <circle cx="0" cy="0" r="22" fill="#22c55e" opacity="0.1"/>
    <!-- Check mark -->
    <polyline points="-8,-2 -2,6 10,-8" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Content ID label badges -->
  <g transform="translate(320, 410)">
    <rect x="-55" y="-18" width="110" height="30" rx="6" fill="#f43f5e" opacity="0.2"/>
    <text x="0" y="2" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#fb7185">Content ID</text>
  </g>
  <g transform="translate(530, 410)">
    <rect x="-75" y="-18" width="150" height="30" rx="6" fill="#22c55e" opacity="0.2"/>
    <text x="0" y="2" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#4ade80">フリーBGM活用</text>
  </g>
  <g transform="translate(740, 410)">
    <rect x="-55" y="-18" width="110" height="30" rx="6" fill="#f59e0b" opacity="0.2"/>
    <text x="0" y="2" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#fbbf24">引用ルール</text>
  </g>

  <!-- Main title -->
  <text x="600" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#e2e8f0">YouTube著作権と音楽利用</text>
  <text x="600" y="555" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#c084fc">企業が知っておくべきルール</text>
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#818cf8">YouTube企業チャンネル運用ガイド</text>

  <!-- Badge -->
  <rect x="30" y="20" width="100" height="32" rx="6" fill="url(#accent)" opacity="0.9"/>
  <text x="80" y="42" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#fff">著作権</text>
</svg>
