<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="white" opacity="0.07"/>

  <!-- Accent bar left -->
  <rect x="60" y="60" width="6" height="70" rx="3" fill="url(#accentLine)" opacity="0.6"/>

  <!-- Top line -->
  <text x="600" y="155" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="48" fill="#99f6e4">YouTube</text>

  <!-- Main title -->
  <text x="600" y="265" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="92" fill="white">競合分析のやり方</text>

  <!-- Sub title -->
  <text x="600" y="365" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="52" fill="#5eead4">ライバルチャンネルを徹底リサーチ</text>

  <!-- Subtitle pill -->
  <rect x="300" y="405" width="600" height="55" rx="28" fill="white" opacity="0.12"/>
  <text x="600" y="443" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="26" fill="white">見つけ方・分析ポイント・無料ツールまで解説</text>

  <!-- Decorative icons -->
  <text x="100" y="530" font-family="sans-serif" font-size="38" fill="white" opacity="0.2">🔍</text>
  <text x="250" y="545" font-family="sans-serif" font-size="34" fill="white" opacity="0.18">📊</text>
  <text x="940" y="530" font-family="sans-serif" font-size="38" fill="white" opacity="0.2">📈</text>
  <text x="1060" y="545" font-family="sans-serif" font-size="34" fill="white" opacity="0.18">🎯</text>

  <!-- Decorative circles -->
  <circle cx="150" cy="535" r="25" fill="#5eead4" opacity="0.12"/>
  <circle cx="1060" cy="535" r="25" fill="#5eead4" opacity="0.12"/>
  <circle cx="230" cy="555" r="14" fill="#99f6e4" opacity="0.08"/>
</svg>
