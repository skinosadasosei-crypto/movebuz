<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="300" r="300" fill="#f97316" opacity="0.03"/>
  <!-- Phone mockup (vertical - shorts format) -->
  <g transform="translate(440, 40)">
    <rect x="0" y="0" width="200" height="400" rx="20" fill="#1c1917" stroke="#f97316" stroke-width="2.5"/>
    <!-- Screen -->
    <rect x="8" y="30" width="184" height="340" rx="4" fill="#292524"/>
    <!-- Short video content -->
    <rect x="8" y="30" width="184" height="340" rx="4" fill="url(#phone)" opacity="0.15"/>
    <!-- Play icon -->
    <circle cx="100" cy="180" r="30" fill="#fff" opacity="0.15"/>
    <polygon points="90,163 90,197 118,180" fill="#fff" opacity="0.6"/>
    <!-- Shorts icon -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="60" height="24" rx="6" fill="#ef4444"/>
      <text x="30" y="17" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#fff">Shorts</text>
    </g>
    <!-- Engagement icons on right -->
    <g transform="translate(152, 220)">
      <circle cx="20" cy="0" r="16" fill="#292524" stroke="#78716c" stroke-width="1"/>
      <text x="20" y="5" text-anchor="middle" font-family="system-ui" font-size="14" fill="#d6d3d1">♥</text>
      <text x="20" y="24" text-anchor="middle" font-family="system-ui" font-size="9" fill="#a8a29e">12K</text>
      <circle cx="20" cy="55" r="16" fill="#292524" stroke="#78716c" stroke-width="1"/>
      <text x="20" y="60" text-anchor="middle" font-family="system-ui" font-size="14" fill="#d6d3d1">💬</text>
      <text x="20" y="79" text-anchor="middle" font-family="system-ui" font-size="9" fill="#a8a29e">340</text>
      <circle cx="20" cy="110" r="16" fill="#292524" stroke="#78716c" stroke-width="1"/>
      <text x="20" y="115" text-anchor="middle" font-family="system-ui" font-size="14" fill="#d6d3d1">↗</text>
      <text x="20" y="134" text-anchor="middle" font-family="system-ui" font-size="9" fill="#a8a29e">共有</text>
    </g>
    <!-- Bottom bar -->
    <rect x="60" y="385" width="80" height="4" rx="2" fill="#78716c"/>
  </g>
  <!-- Left side: benefits -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="300" height="70" rx="10" fill="#292524" stroke="#f97316" stroke-width="1.5" opacity="0.8"/>
    <text x="20" y="28" font-family="system-ui" font-size="13" fill="#fdba74">認知拡大</text>
    <text x="20" y="52" font-family="system-ui" font-size="20" font-weight="700" fill="#fb923c">リーチ 10倍</text>
    <text x="260" y="45" font-family="system-ui" font-size="24" fill="#f97316" opacity="0.5">🚀</text>
  </g>
  <g transform="translate(80, 190)">
    <rect x="0" y="0" width="300" height="70" rx="10" fill="#292524" stroke="#f97316" stroke-width="1.5" opacity="0.8"/>
    <text x="20" y="28" font-family="system-ui" font-size="13" fill="#fdba74">制作コスト</text>
    <text x="20" y="52" font-family="system-ui" font-size="20" font-weight="700" fill="#fb923c">通常の1/5</text>
    <text x="260" y="45" font-family="system-ui" font-size="24" fill="#f97316" opacity="0.5">💰</text>
  </g>
  <g transform="translate(80, 280)">
    <rect x="0" y="0" width="300" height="70" rx="10" fill="#292524" stroke="#f97316" stroke-width="1.5" opacity="0.8"/>
    <text x="20" y="28" font-family="system-ui" font-size="13" fill="#fdba74">投稿頻度</text>
    <text x="20" y="52" font-family="system-ui" font-size="20" font-weight="700" fill="#fb923c">週3〜5本OK</text>
    <text x="260" y="45" font-family="system-ui" font-size="24" fill="#f97316" opacity="0.5">⚡</text>
  </g>
  <!-- Right side: growth chart -->
  <g transform="translate(700, 100)">
    <rect x="0" y="0" width="400" height="250" rx="12" fill="#292524" stroke="#f97316" stroke-width="1.5" opacity="0.8"/>
    <text x="20" y="30" font-family="system-ui" font-size="13" fill="#fdba74">ショート動画の成長曲線</text>
    <polyline points="30,200 80,190 130,170 180,140 230,100 280,60 330,30 380,15" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="30,200 80,190 130,170 180,140 230,100 280,60 330,30 380,15 380,200" fill="#f97316" opacity="0.06"/>
    <circle cx="380" cy="15" r="6" fill="#f97316"/>
    <text x="340" y="228" font-family="system-ui" font-size="10" fill="#78716c">3ヶ月</text>
    <text x="50" y="228" font-family="system-ui" font-size="10" fill="#78716c">開始</text>
  </g>
  <!-- Text -->
  <text x="600" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0">YouTubeショート動画の企業活用ガイド</text>
  <text x="600" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#fdba74">通常動画との使い分けと成功のコツ</text>
</svg>
