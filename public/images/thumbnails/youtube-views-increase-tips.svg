<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c3a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Growth chart -->
  <g transform="translate(100, 80)">
    <!-- Grid -->
    <g opacity="0.1" stroke="#4ade80">
      <line x1="0" y1="0" x2="1000" y2="0"/><line x1="0" y1="80" x2="1000" y2="80"/>
      <line x1="0" y1="160" x2="1000" y2="160"/><line x1="0" y1="240" x2="1000" y2="240"/>
      <line x1="0" y1="320" x2="1000" y2="320"/>
    </g>
    <!-- Area fill -->
    <polygon points="0,320 100,300 200,280 300,260 400,220 500,180 600,150 700,100 800,50 900,20 1000,0 1000,320" fill="#22c55e" opacity="0.08"/>
    <!-- Line -->
    <polyline points="0,320 100,300 200,280 300,260 400,220 500,180 600,150 700,100 800,50 900,20 1000,0" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Points -->
    <circle cx="500" cy="180" r="6" fill="#4ade80"/>
    <circle cx="700" cy="100" r="6" fill="#4ade80"/>
    <circle cx="1000" cy="0" r="10" fill="#0f4c3a" stroke="#4ade80" stroke-width="3"/>
    <!-- View count labels -->
    <rect x="920" y="-40" width="120" height="30" rx="6" fill="#22c55e" opacity="0.2"/>
    <text x="980" y="-19" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#4ade80">+500%</text>
  </g>
  <!-- Strategy icons -->
  <g transform="translate(120, 430)">
    <circle cx="30" cy="20" r="20" fill="#22c55e" opacity="0.15"/>
    <text x="30" y="27" text-anchor="middle" font-family="system-ui" font-size="18" fill="#4ade80">🔍</text>
    <text x="60" y="27" font-family="system-ui" font-size="12" fill="#86efac">SEO最適化</text>
  </g>
  <g transform="translate(320, 430)">
    <circle cx="30" cy="20" r="20" fill="#22c55e" opacity="0.15"/>
    <text x="30" y="27" text-anchor="middle" font-family="system-ui" font-size="18" fill="#4ade80">🎨</text>
    <text x="60" y="27" font-family="system-ui" font-size="12" fill="#86efac">サムネイル改善</text>
  </g>
  <g transform="translate(540, 430)">
    <circle cx="30" cy="20" r="20" fill="#22c55e" opacity="0.15"/>
    <text x="30" y="27" text-anchor="middle" font-family="system-ui" font-size="18" fill="#4ade80">📊</text>
    <text x="60" y="27" font-family="system-ui" font-size="12" fill="#86efac">データ分析</text>
  </g>
  <g transform="translate(760, 430)">
    <circle cx="30" cy="20" r="20" fill="#22c55e" opacity="0.15"/>
    <text x="30" y="27" text-anchor="middle" font-family="system-ui" font-size="18" fill="#4ade80">⏰</text>
    <text x="60" y="27" font-family="system-ui" font-size="12" fill="#86efac">投稿タイミング</text>
  </g>
  <!-- Text -->
  <text x="600" y="530" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0">YouTube再生数を伸ばす7つの戦略</text>
  <text x="600" y="565" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#86efac">企業チャンネルの成長を加速させるテクニック</text>
</svg>
