<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="white" opacity="0.07"/>

  <!-- Accent bar left -->
  <rect x="60" y="60" width="6" height="70" rx="3" fill="url(#accentLine)" opacity="0.6"/>

  <!-- A/B visual element -->
  <rect x="140" y="420" width="120" height="80" rx="10" fill="#fbbf24" opacity="0.9"/>
  <text x="200" y="475" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="48" fill="#1e3a5f">A</text>

  <rect x="300" y="420" width="120" height="80" rx="10" fill="#34d399" opacity="0.9"/>
  <text x="360" y="475" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="48" fill="#065f46">B</text>

  <!-- VS circle -->
  <circle cx="280" cy="460" r="22" fill="white" opacity="0.15"/>
  <text x="280" y="467" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="white">VS</text>

  <!-- Top line -->
  <text x="600" y="155" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="50" fill="#93c5fd">YouTube サムネイル</text>

  <!-- Main title -->
  <text x="600" y="265" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="92" fill="white">ABテスト</text>

  <!-- Sub title -->
  <text x="600" y="360" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="58" fill="#60a5fa">のやり方</text>

  <!-- Subtitle pill -->
  <rect x="320" y="390" width="560" height="55" rx="28" fill="white" opacity="0.12"/>
  <text x="600" y="428" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="28" fill="white">クリック率を最大化する実験手法</text>

  <!-- Decorative chart icon right side -->
  <g transform="translate(880, 420)" opacity="0.3">
    <rect x="0" y="40" width="25" height="40" rx="4" fill="#60a5fa"/>
    <rect x="35" y="20" width="25" height="60" rx="4" fill="#93c5fd"/>
    <rect x="70" y="0" width="25" height="80" rx="4" fill="#bfdbfe"/>
    <line x1="0" y1="80" x2="95" y2="80" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="1060" cy="530" r="25" fill="#60a5fa" opacity="0.15"/>
  <circle cx="1000" cy="555" r="14" fill="#93c5fd" opacity="0.1"/>
  <circle cx="140" cy="560" r="18" fill="#60a5fa" opacity="0.12"/>
</svg>