<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>
  <!-- Chart area -->
  <g transform="translate(120, 100)">
    <!-- Bar chart -->
    <rect x="60" y="280" width="60" height="120" rx="4" fill="#3b82f6" opacity="0.3"/>
    <rect x="160" y="220" width="60" height="180" rx="4" fill="#3b82f6" opacity="0.45"/>
    <rect x="260" y="180" width="60" height="220" rx="4" fill="#3b82f6" opacity="0.6"/>
    <rect x="360" y="140" width="60" height="260" rx="4" fill="#3b82f6" opacity="0.75"/>
    <rect x="460" y="80" width="60" height="320" rx="4" fill="url(#accent)" opacity="0.9"/>
    <!-- Line chart overlay -->
    <polyline points="90,260 190,200 290,170 390,120 490,60" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="90" cy="260" r="6" fill="#60a5fa"/><circle cx="190" cy="200" r="6" fill="#60a5fa"/>
    <circle cx="290" cy="170" r="6" fill="#60a5fa"/><circle cx="390" cy="120" r="6" fill="#60a5fa"/>
    <circle cx="490" cy="60" r="8" fill="#fff" stroke="#3b82f6" stroke-width="3"/>
  </g>
  <!-- Right side: magnifying glass icon -->
  <g transform="translate(780, 180)">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#3b82f6" stroke-width="6" opacity="0.4"/>
    <line x1="183" y1="183" x2="240" y2="240" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
    <!-- Mini chart inside magnifier -->
    <polyline points="60,150 90,120 120,130 150,90" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <circle cx="150" cy="90" r="5" fill="#60a5fa"/>
  </g>
  <!-- Text -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0">YouTubeアナリティクスの見方</text>
  <text x="600" y="595" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">初心者が押さえるべき5つの指標</text>
</svg>
