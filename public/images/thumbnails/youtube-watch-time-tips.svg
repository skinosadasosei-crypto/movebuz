<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="retLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g opacity="0.06" stroke="#818cf8">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Retention curve illustration -->
  <g transform="translate(80, 60)">
    <!-- Bad curve (red, dashed) -->
    <polyline points="0,100 80,180 160,240 240,280 320,310 400,330 500,345 600,355 700,360 800,363 900,365 1040,367"
      fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" stroke-dasharray="10,6"/>
    <!-- Area under good curve -->
    <polygon points="0,80 80,105 160,125 240,140 320,155 400,170 500,190 600,210 700,235 800,255 900,272 1040,290 1040,380 0,380"
      fill="#818cf8" opacity="0.05"/>
    <!-- Good curve (gradient) -->
    <polyline points="0,80 80,105 160,125 240,140 320,155 400,170 500,190 600,210 700,235 800,255 900,272 1040,290"
      fill="none" stroke="url(#retLine)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Highlight point -->
    <circle cx="520" cy="195" r="8" fill="#1e1b4b" stroke="#22c55e" stroke-width="3"/>
    <circle cx="1040" cy="290" r="10" fill="#1e1b4b" stroke="#22c55e" stroke-width="3"/>
    <!-- Improvement arrow -->
    <g transform="translate(520, 100)">
      <rect x="-55" y="-20" width="110" height="32" rx="6" fill="#22c55e" opacity="0.2"/>
      <text x="0" y="2" text-anchor="middle" font-family="system-ui" font-size="15" font-weight="700" fill="#4ade80">+40% 改善</text>
    </g>
  </g>

  <!-- Technique icons -->
  <g transform="translate(100, 420)">
    <circle cx="30" cy="20" r="22" fill="#818cf8" opacity="0.15"/>
    <text x="30" y="27" text-anchor="middle" font-family="system-ui" font-size="20">🎬</text>
    <text x="62" y="27" font-family="system-ui" font-size="12" fill="#a5b4fc">フック</text>
  </g>
  <g transform="translate(280, 420)">
    <circle cx="30" cy="20" r="22" fill="#818cf8" opacity="0.15"/>
    <text x="30" y="27" text-anchor="middle" font-family="system-ui" font-size="20">🔄</text>
    <text x="62" y="27" font-family="system-ui" font-size="12" fill="#a5b4fc">パターン変化</text>
  </g>
  <g transform="translate(490, 420)">
    <circle cx="30" cy="20" r="22" fill="#818cf8" opacity="0.15"/>
    <text x="30" y="27" text-anchor="middle" font-family="system-ui" font-size="20">📝</text>
    <text x="62" y="27" font-family="system-ui" font-size="12" fill="#a5b4fc">テロップ</text>
  </g>
  <g transform="translate(680, 420)">
    <circle cx="30" cy="20" r="22" fill="#818cf8" opacity="0.15"/>
    <text x="30" y="27" text-anchor="middle" font-family="system-ui" font-size="20">🎵</text>
    <text x="62" y="27" font-family="system-ui" font-size="12" fill="#a5b4fc">BGM</text>
  </g>
  <g transform="translate(860, 420)">
    <circle cx="30" cy="20" r="22" fill="#818cf8" opacity="0.15"/>
    <text x="30" y="27" text-anchor="middle" font-family="system-ui" font-size="20">📊</text>
    <text x="62" y="27" font-family="system-ui" font-size="12" fill="#a5b4fc">構成設計</text>
  </g>

  <!-- Main title -->
  <text x="600" y="530" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#e2e8f0">視聴維持率の上げ方</text>
  <text x="600" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#c084fc">離脱を防ぐ動画構成テクニック10選</text>
  <text x="600" y="600" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#818cf8">YouTube企業チャンネル運用ガイド</text>

  <!-- Badge -->
  <rect x="30" y="20" width="80" height="32" rx="6" fill="url(#accent)" opacity="0.9"/>
  <text x="70" y="42" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#fff">10選</text>
</svg>
