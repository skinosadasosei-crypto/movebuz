<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g opacity="0.05" stroke="#818cf8">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Description box illustration (left side) -->
  <g transform="translate(80, 100)">
    <!-- Text editor frame -->
    <rect x="0" y="0" width="420" height="430" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
    <rect x="0" y="0" width="420" height="40" rx="16" fill="#818cf8" opacity="0.15"/>
    <rect x="0" y="24" width="420" height="16" fill="#818cf8" opacity="0.15"/>
    <circle cx="24" cy="20" r="6" fill="#f43f5e" opacity="0.7"/>
    <circle cx="44" cy="20" r="6" fill="#f59e0b" opacity="0.7"/>
    <circle cx="64" cy="20" r="6" fill="#22c55e" opacity="0.7"/>
    <text x="210" y="25" text-anchor="middle" font-family="system-ui" font-size="12" fill="#a5b4fc" opacity="0.7">概要欄</text>

    <!-- Line items representing description content -->
    <!-- Section 1: Summary -->
    <rect x="20" y="55" width="60" height="14" rx="3" fill="#818cf8" opacity="0.5"/>
    <text x="25" y="65" font-family="system-ui" font-size="10" fill="#c7d2fe">要約</text>
    <rect x="90" y="57" width="300" height="8" rx="2" fill="#818cf8" opacity="0.15"/>
    <rect x="90" y="70" width="260" height="8" rx="2" fill="#818cf8" opacity="0.1"/>

    <!-- Section 2: Timestamps -->
    <rect x="20" y="95" width="100" height="14" rx="3" fill="#7c3aed" opacity="0.5"/>
    <text x="25" y="105" font-family="system-ui" font-size="10" fill="#ddd6fe">タイムスタンプ</text>
    <rect x="20" y="115" width="50" height="8" rx="2" fill="#7c3aed" opacity="0.2"/>
    <rect x="80" y="115" width="200" height="8" rx="2" fill="#7c3aed" opacity="0.1"/>
    <rect x="20" y="128" width="50" height="8" rx="2" fill="#7c3aed" opacity="0.2"/>
    <rect x="80" y="128" width="180" height="8" rx="2" fill="#7c3aed" opacity="0.1"/>
    <rect x="20" y="141" width="50" height="8" rx="2" fill="#7c3aed" opacity="0.2"/>
    <rect x="80" y="141" width="220" height="8" rx="2" fill="#7c3aed" opacity="0.1"/>

    <!-- Section 3: Links -->
    <rect x="20" y="165" width="80" height="14" rx="3" fill="#0891b2" opacity="0.5"/>
    <text x="25" y="175" font-family="system-ui" font-size="10" fill="#a5f3fc">関連リンク</text>
    <rect x="20" y="185" width="280" height="8" rx="2" fill="#0891b2" opacity="0.15"/>
    <rect x="20" y="198" width="250" height="8" rx="2" fill="#0891b2" opacity="0.1"/>

    <!-- Section 4: SNS -->
    <rect x="20" y="222" width="50" height="14" rx="3" fill="#059669" opacity="0.5"/>
    <text x="25" y="232" font-family="system-ui" font-size="10" fill="#86efac">SNS</text>
    <rect x="20" y="242" width="240" height="8" rx="2" fill="#059669" opacity="0.15"/>

    <!-- Section 5: Hashtags -->
    <rect x="20" y="266" width="90" height="14" rx="3" fill="#f59e0b" opacity="0.5"/>
    <text x="25" y="276" font-family="system-ui" font-size="10" fill="#fde68a">ハッシュタグ</text>
    <rect x="20" y="286" width="70" height="18" rx="9" fill="#f59e0b" opacity="0.12"/>
    <rect x="100" y="286" width="90" height="18" rx="9" fill="#f59e0b" opacity="0.12"/>
    <rect x="200" y="286" width="80" height="18" rx="9" fill="#f59e0b" opacity="0.12"/>

    <!-- Checkmark overlay -->
    <circle cx="370" cy="370" r="30" fill="#22c55e" opacity="0.15"/>
    <text x="370" y="380" text-anchor="middle" font-family="system-ui" font-size="30" fill="#4ade80">&#10003;</text>
  </g>

  <!-- Title text (right side) -->
  <g transform="translate(580, 120)">
    <text x="0" y="0" font-family="system-ui" font-size="16" font-weight="bold" fill="#818cf8" letter-spacing="4">COMPLETE GUIDE</text>

    <text x="0" y="60" font-family="system-ui" font-size="52" font-weight="900" fill="#ffffff">YouTube</text>
    <text x="0" y="120" font-family="system-ui" font-size="52" font-weight="900" fill="#ffffff">概要欄の</text>
    <text x="0" y="180" font-family="system-ui" font-size="52" font-weight="900" fill="url(#accent)">書き方</text>

    <rect x="0" y="210" width="120" height="4" rx="2" fill="url(#accent)"/>

    <text x="0" y="260" font-family="system-ui" font-size="22" fill="#cbd5e1">SEOと導線を両立する</text>
    <text x="0" y="290" font-family="system-ui" font-size="22" fill="#cbd5e1">テンプレート付き</text>
  </g>

  <!-- Bottom keywords -->
  <g transform="translate(580, 460)">
    <rect x="0" y="0" width="110" height="32" rx="6" fill="#818cf8" opacity="0.15"/>
    <text x="55" y="21" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#a5b4fc">SEO対策</text>

    <rect x="125" y="0" width="110" height="32" rx="6" fill="#818cf8" opacity="0.15"/>
    <text x="180" y="21" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#a5b4fc">導線設計</text>

    <rect x="250" y="0" width="130" height="32" rx="6" fill="#818cf8" opacity="0.15"/>
    <text x="315" y="21" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="bold" fill="#a5b4fc">テンプレート</text>
  </g>

  <!-- Decorative circles -->
  <circle cx="1120" cy="80" r="50" fill="#818cf8" opacity="0.04"/>
  <circle cx="1150" cy="550" r="70" fill="#c084fc" opacity="0.04"/>
</svg>
