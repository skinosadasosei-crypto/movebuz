<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="white" opacity="0.07"/>

  <!-- Accent bar left -->
  <rect x="60" y="60" width="6" height="70" rx="3" fill="url(#accentLine)" opacity="0.6"/>

  <!-- Top line -->
  <text x="600" y="160" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="50" fill="#c4b5fd">YouTubeの</text>

  <!-- Main title -->
  <text x="600" y="265" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="88" fill="white">エンゲージメント</text>

  <!-- Sub title -->
  <text x="600" y="370" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="68" fill="#a78bfa">を高める方法</text>

  <!-- Subtitle pill -->
  <rect x="260" y="410" width="680" height="55" rx="28" fill="white" opacity="0.12"/>
  <text x="600" y="448" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="28" fill="white">コメント・高評価・共有を増やす実践ガイド</text>

  <!-- Decorative icons -->
  <text x="120" y="520" font-family="sans-serif" font-size="40" fill="white" opacity="0.25">💬</text>
  <text x="260" y="540" font-family="sans-serif" font-size="36" fill="white" opacity="0.2">👍</text>
  <text x="920" y="520" font-family="sans-serif" font-size="40" fill="white" opacity="0.25">🔗</text>
  <text x="1050" y="540" font-family="sans-serif" font-size="36" fill="white" opacity="0.2">🔔</text>

  <!-- Decorative circles -->
  <circle cx="150" cy="530" r="25" fill="#a78bfa" opacity="0.15"/>
  <circle cx="1060" cy="530" r="25" fill="#a78bfa" opacity="0.15"/>
  <circle cx="230" cy="555" r="14" fill="#c4b5fd" opacity="0.1"/>
</svg>