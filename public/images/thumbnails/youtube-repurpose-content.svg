<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="white" opacity="0.07"/>

  <!-- Accent bar left -->
  <rect x="60" y="60" width="6" height="70" rx="3" fill="url(#accentLine)" opacity="0.6"/>

  <!-- Top badge -->
  <rect x="430" y="80" width="340" height="45" rx="22" fill="#60a5fa" opacity="0.2"/>
  <text x="600" y="110" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="24" fill="#93c5fd">コンテンツ再活用術</text>

  <!-- Main title line 1 -->
  <text x="600" y="215" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="78" fill="white">YouTube動画を</text>

  <!-- Main title line 2 -->
  <text x="600" y="315" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="78" fill="#60a5fa">他メディアに再活用</text>

  <!-- Subtitle pill -->
  <rect x="260" y="355" width="680" height="55" rx="28" fill="white" opacity="0.12"/>
  <text x="600" y="393" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="30" fill="white">1本の動画で10倍の発信力</text>

  <!-- Content type icons row -->
  <rect x="170" y="450" width="110" height="36" rx="18" fill="white" opacity="0.1"/>
  <text x="225" y="475" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#93c5fd" font-weight="600">ブログ</text>

  <rect x="300" y="450" width="100" height="36" rx="18" fill="white" opacity="0.1"/>
  <text x="350" y="475" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#93c5fd" font-weight="600">SNS</text>

  <rect x="420" y="450" width="130" height="36" rx="18" fill="white" opacity="0.1"/>
  <text x="485" y="475" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#93c5fd" font-weight="600">ショート</text>

  <rect x="570" y="450" width="160" height="36" rx="18" fill="white" opacity="0.1"/>
  <text x="650" y="475" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#93c5fd" font-weight="600">ポッドキャスト</text>

  <rect x="750" y="450" width="130" height="36" rx="18" fill="white" opacity="0.1"/>
  <text x="815" y="475" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#93c5fd" font-weight="600">メルマガ</text>

  <!-- Decorative circles -->
  <circle cx="130" cy="540" r="25" fill="#60a5fa" opacity="0.12"/>
  <circle cx="1080" cy="540" r="25" fill="#60a5fa" opacity="0.12"/>
  <circle cx="210" cy="560" r="14" fill="#93c5fd" opacity="0.08"/>
  <circle cx="1000" cy="555" r="14" fill="#93c5fd" opacity="0.08"/>

  <!-- Arrow icon (repurpose concept) -->
  <g transform="translate(95, 480)" opacity="0.2">
    <path d="M0 20 L30 20 L20 10 M30 20 L20 30" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1050, 480)" opacity="0.2">
    <path d="M30 20 L0 20 L10 10 M0 20 L10 30" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
