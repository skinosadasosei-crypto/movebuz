    <text x="220" y="85" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#e0e7ff">3〜5ポイントで解説</text>
  </g>
  <g transform="translate(650,400)">
    <rect width="440" height="120" rx="16" fill="white" opacity="0.2"/>
    <text x="220" y="50" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="28" fill="white">エンディング</text>
    <text x="220" y="85" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#e0e7ff">まとめ＋CTA</text>
