<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="1100" cy="80" r="200" fill="#7c3aed" opacity="0.08"/>
  <circle cx="100" cy="550" r="150" fill="#a78bfa" opacity="0.06"/>
  <!-- Thumbnail mockup cards -->
  <g transform="translate(100, 80)">
    <!-- Card 1 -->
    <rect x="0" y="60" width="280" height="158" rx="12" fill="#2d2059" stroke="#7c3aed" stroke-width="2" opacity="0.8"/>
    <rect x="12" y="72" width="256" height="100" rx="6" fill="#3b2874"/>
    <text x="140" y="130" text-anchor="middle" font-family="system-ui" font-size="36" fill="#a78bfa" opacity="0.6">▶</text>
    <rect x="12" y="184" width="180" height="10" rx="3" fill="#4c3a7a"/>
    <rect x="12" y="200" width="120" height="8" rx="3" fill="#3b2a6a"/>
    <!-- CTR badge -->
    <rect x="200" y="30" width="80" height="32" rx="16" fill="#22c55e"/>
    <text x="240" y="52" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#fff">CTR 8.2%</text>
  </g>
  <g transform="translate(440, 100)">
    <!-- Card 2 (highlighted) -->
    <rect x="0" y="20" width="320" height="180" rx="14" fill="url(#card)" opacity="0.15" stroke="#a78bfa" stroke-width="2"/>
    <rect x="14" y="34" width="292" height="114" rx="8" fill="#4c2e91"/>
    <text x="160" y="100" text-anchor="middle" font-family="system-ui" font-size="42" fill="#c4b5fd" opacity="0.7">▶</text>
    <!-- Cursor icon -->
    <g transform="translate(260, 130)">
      <path d="M0,0 L0,30 L8,22 L16,36 L22,32 L14,18 L24,18 Z" fill="#fff" opacity="0.9"/>
    </g>
    <rect x="14" y="162" width="200" height="12" rx="4" fill="#5b3a9e"/>
    <rect x="14" y="180" width="140" height="8" rx="3" fill="#4c2e91"/>
    <!-- Star badge -->
    <rect x="230" y="-10" width="90" height="32" rx="16" fill="#f59e0b"/>
    <text x="275" y="12" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#fff">BEST ✦</text>
  </g>
  <g transform="translate(820, 80)">
    <!-- Card 3 -->
    <rect x="0" y="60" width="280" height="158" rx="12" fill="#2d2059" stroke="#7c3aed" stroke-width="2" opacity="0.8"/>
    <rect x="12" y="72" width="256" height="100" rx="6" fill="#3b2874"/>
    <text x="140" y="130" text-anchor="middle" font-family="system-ui" font-size="36" fill="#a78bfa" opacity="0.6">▶</text>
    <rect x="12" y="184" width="180" height="10" rx="3" fill="#4c3a7a"/>
    <rect x="12" y="200" width="120" height="8" rx="3" fill="#3b2a6a"/>
    <!-- CTR badge -->
    <rect x="200" y="30" width="80" height="32" rx="16" fill="#ef4444"/>
    <text x="240" y="52" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#fff">CTR 1.8%</text>
  </g>
  <!-- Color palette dots -->
  <g transform="translate(140, 380)">
    <circle cx="0" cy="0" r="18" fill="#ef4444"/><circle cx="50" cy="0" r="18" fill="#f59e0b"/>
    <circle cx="100" cy="0" r="18" fill="#22c55e"/><circle cx="150" cy="0" r="18" fill="#3b82f6"/>
    <circle cx="200" cy="0" r="18" fill="#8b5cf6"/><circle cx="250" cy="0" r="18" fill="#ec4899"/>
  </g>
  <!-- Text -->
  <text x="600" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0">クリックされるYouTubeサムネイルの作り方</text>
  <text x="600" y="525" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#a5b4fc">デザインの基本と注意点</text>
</svg>
